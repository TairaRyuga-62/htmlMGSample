<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>メダルすごろく マルチ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+1p:wght@400;700;800&display=swap">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>

/* Layout: 上にステータス帯と手順バー、左に10×10外周のすごろく盤(中央が演出ステージ)、右に操作枠(ベット→走行→利確判断で中身が切り替わる)。単一のゲームセンター風ダーク */
:root{
  --bg:#14121c; --panel:#1f1c2b; --line:#36314a; --fg:#f1eefa; --muted:#a39dbb; --ink:#14121c;
  --gold:#f7c948; --gold-d:#b8891a; --out:#6b6876; --out-fg:#e6e4ec;
  --stock:#4fd6e8; --stock-d:#1d8796;
  --c0:#ec4e5a; --c1:#3e8ef7; --c2:#f5c84c; --c3:#3fbf7f; --c4:#a970ff;
  --display:"Dela Gothic One","M PLUS 1p",system-ui,sans-serif;
  --body:"M PLUS 1p","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.page{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:12px}

.status{display:flex;flex-wrap:wrap;gap:10px 28px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.stat{display:flex;flex-direction:column;line-height:1.1}
.stat small{color:var(--muted);font-size:.7rem;letter-spacing:.08em}
.stat b{font-family:var(--display);font-weight:400;font-size:1.4rem;font-variant-numeric:tabular-nums}
.stat.medal b{color:var(--gold);font-size:1.7rem}
.status .sp{flex:1}


.callout{border:2px solid var(--stock-d);border-radius:12px;padding:12px 14px;background:rgba(79,214,232,.06);display:flex;flex-direction:column;gap:6px}
.callout b{font-family:var(--display);font-weight:400;font-size:1.15rem;color:var(--stock);display:flex;align-items:center;gap:8px}
.callout span{font-size:.8rem;color:var(--muted);line-height:1.55}
.callout span strong{color:var(--fg)}
.chip{display:inline-block;width:18px;height:18px;border-radius:4px;background:var(--line);border:2px solid var(--fg)}
.upb{display:inline-block;font-style:normal;font-family:var(--display);font-size:.62rem;line-height:1;padding:3px 5px;border-radius:5px;background:var(--fg);color:var(--ink);vertical-align:middle}
.tile .upb{position:absolute;bottom:2px;right:2px;font-size:clamp(.38rem,1.1vw,.6rem);padding:2px 3px;box-shadow:0 0 0 2px var(--ink)}
.oddsbox{display:grid;grid-template-columns:1fr auto 1fr auto;gap:10px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.oddsbox div{display:flex;flex-direction:column;gap:2px;min-width:0}
.oddsbox small{font-size:.66rem;color:var(--muted);letter-spacing:.06em}
.oddsbox b{font-family:var(--display);font-weight:400;font-size:1.5rem;font-variant-numeric:tabular-nums}
.oddsbox b.now{color:var(--stock)}
.oddsbox .arrow{color:var(--muted);font-size:1.1rem}
.oddsbox .upc{align-items:center}
.oddsbox .upc i{width:26px;height:26px;border-radius:6px;border:2px solid var(--fg)}
.oddsbox.bump b.now{animation:bump .45s ease-out}
.main{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:880px){.main{grid-template-columns:1fr}}

.board{position:relative;display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(10,1fr);gap:4px;aspect-ratio:1;width:100%;max-width:620px;margin:0 auto}
.tile{border-radius:6px;position:relative;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25);transition:opacity .2s,transform .12s;font-family:var(--display);font-size:clamp(.45rem,1.5vw,.8rem);color:var(--c0)}
.tile.dim{opacity:.5}
.tile.aim{box-shadow:inset 0 -4px 0 rgba(0,0,0,.25),0 0 0 3px var(--fg),0 0 14px rgba(255,255,255,.35)}
.tile.out{background:var(--out);color:var(--out-fg);background-image:repeating-linear-gradient(45deg,transparent 0 6px,rgba(0,0,0,.18) 6px 12px)}
.tile.trail::before{content:"";position:absolute;width:22%;aspect-ratio:1;border-radius:50%;background:var(--fg);opacity:.85;box-shadow:0 0 0 2px var(--ink)}
.tile .stepn{position:absolute;top:2px;left:4px;font-size:clamp(.45rem,1.4vw,.75rem);color:var(--ink);background:var(--fg);border-radius:4px;padding:0 3px;line-height:1.3}
/* OUT演出 */
.board.dead{filter:grayscale(1) brightness(.6);transition:filter .3s}
.page.shake{animation:shake .5s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(5px)}30%,50%,70%{transform:translateX(-10px)}40%,60%{transform:translateX(10px)}}
.flashout{position:fixed;inset:0;pointer-events:none;z-index:15;background:radial-gradient(circle,rgba(230,228,236,.0) 20%,rgba(20,18,28,.85) 75%);opacity:0}
.flashout.on{animation:fo 1.6s ease-out forwards}
@keyframes fo{0%{opacity:0;background-color:rgba(255,255,255,.55)}8%{opacity:1;background-color:rgba(255,255,255,.35)}20%{background-color:transparent}75%{opacity:1}100%{opacity:0}}
.banner.out{font-size:clamp(3.4rem,15vw,7.5rem);color:var(--out-fg)!important;letter-spacing:.06em;text-shadow:0 6px 0 #000,0 0 30px rgba(0,0,0,.8)}
.wheel{width:min(100%,clamp(110px,26vw,170px));aspect-ratio:200/212}
.wheel svg{width:100%;height:100%;display:block;overflow:visible}
.tile.peek{transform:scale(1.15);z-index:2;box-shadow:0 0 0 4px var(--gold),0 0 18px var(--gold)}
.tile.tease{animation:tease .45s ease-in-out}
@keyframes tease{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.tile.land{animation:land .5s ease-out}
@keyframes land{0%{transform:scale(1)}35%{transform:scale(1.35);z-index:2;box-shadow:0 0 0 4px var(--fg)}100%{transform:scale(1)}}
.koma{position:absolute;width:58%;aspect-ratio:1;border-radius:50%;background:var(--fg);border:3px solid var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.5);z-index:3;display:flex;align-items:center;justify-content:center}
.koma::after{content:"";width:40%;aspect-ratio:1;border-radius:50%;background:var(--gold)}
.koma.hop{animation:hop .11s ease-out}
@keyframes hop{0%{transform:translateY(0)}50%{transform:translateY(-45%) scale(1.08)}100%{transform:translateY(0)}}

.stage{grid-column:2/10;grid-row:2/10;border-radius:12px;background:radial-gradient(circle at 50% 40%,#2a2540,var(--bg) 75%);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;overflow:hidden;position:relative;padding:8px}
.cp{display:flex;gap:6px}
.cp i{width:clamp(14px,3.4vw,22px);aspect-ratio:1;border-radius:50%;border:2px solid var(--line)}
.cp i.on{background:var(--gold);border-color:var(--gold)}
.hint{font-size:.82rem;text-align:center;max-width:28ch;line-height:1.5;color:var(--muted)}
.banner{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--display);font-size:clamp(1.7rem,7vw,3.8rem);line-height:1.1;pointer-events:none;text-shadow:0 4px 0 rgba(0,0,0,.6);padding:0 8px;white-space:pre-line}
.banner.show{animation:stamp var(--dur,.6s) cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes stamp{0%{transform:scale(2.4);opacity:0}25%{transform:scale(.92);opacity:1}35%{transform:scale(1.04)}80%{transform:scale(1);opacity:1}100%{transform:scale(1);opacity:0}}

.side{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.side h2{margin:0;font-family:var(--display);font-weight:400;font-size:1.05rem}
.box{display:flex;flex-direction:column;gap:14px}
.label{font-size:.72rem;color:var(--muted);letter-spacing:.08em;margin-bottom:6px}
button{font-family:var(--body);font-weight:700;cursor:pointer;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--fg);padding:8px 12px;font-size:.9rem}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button:disabled{opacity:.35;cursor:not-allowed}
.colors,.bets{display:flex;flex-wrap:wrap;gap:8px}
.betin{display:flex;gap:6px;align-items:stretch;flex-wrap:wrap}
.betin input{width:5.5em;font-family:var(--display);font-size:1.4rem;text-align:center;background:var(--bg);color:var(--gold);border:2px solid var(--gold-d);border-radius:10px;padding:4px 6px;font-variant-numeric:tabular-nums}
.betin input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.betin button{min-width:44px}
.preview{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;background:var(--bg);border:1px solid var(--stock-d);border-radius:10px;padding:10px 12px;font-size:.85rem;color:var(--muted)}
.preview b{font-family:var(--display);font-weight:400;font-size:1.6rem;color:var(--stock);font-variant-numeric:tabular-nums}
.tile .pay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:var(--display);font-size:clamp(.5rem,1.6vw,.85rem);color:var(--ink);background:var(--fg);border-radius:5px;padding:1px 4px;line-height:1.25;z-index:2;white-space:nowrap}
.bigpay{display:flex;justify-content:space-between;align-items:center;gap:8px;border:2px solid var(--stock);border-radius:12px;padding:10px 14px}
.bigpay span{font-size:.85rem;color:var(--fg);display:flex;align-items:center;gap:6px;font-weight:700}
.bigpay b{font-family:var(--display);font-weight:400;font-size:2rem;color:var(--stock);font-variant-numeric:tabular-nums}
.cbtn{width:44px;height:44px;padding:0;border-color:transparent}
.cbtn[aria-pressed="true"]{border-color:var(--fg);box-shadow:0 0 0 3px var(--panel),0 0 0 5px var(--fg)}
.big{font-family:var(--display);font-weight:400;font-size:1.3rem;padding:14px;background:var(--gold);color:#2a1d00;border-color:var(--gold-d);box-shadow:0 4px 0 var(--gold-d)}
.big:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--gold-d)}
.safe{font-family:var(--display);font-weight:400;font-size:1.2rem;padding:14px;border-color:var(--c3);color:var(--c3)}
.rules{font-size:.8rem;color:var(--muted);line-height:1.7;margin:0;padding-left:1.2em}
.rules b{color:var(--fg)}

.stock{text-align:center;display:flex;flex-direction:column;gap:4px;border:2px dashed var(--stock-d);border-radius:12px;padding:12px 10px;background:rgba(79,214,232,.06)}
.stock small{font-size:.78rem;color:var(--stock);letter-spacing:.06em;font-weight:800}
.stock b{font-family:var(--display);font-weight:400;font-size:clamp(2.4rem,8vw,3.6rem);line-height:1;color:var(--stock);text-shadow:0 4px 0 var(--stock-d);font-variant-numeric:tabular-nums}
.stock span{font-size:.74rem;color:var(--muted);line-height:1.5}
.stock span em{font-style:normal;color:var(--gold);font-weight:800}
.stock span u{text-decoration:none;color:var(--out-fg);font-weight:800}
.stat.pend b{color:var(--stock)}
.stock.bump b{animation:bump .45s ease-out}
@keyframes bump{0%{transform:scale(1.4)}100%{transform:scale(1)}}
.row{display:flex;justify-content:space-between;align-items:baseline;font-size:.84rem;color:var(--muted)}
.row b{color:var(--fg);font-variant-numeric:tabular-nums}
.check{border:2px solid var(--gold);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px;background:#2a2312}
.check h3{margin:0;font-family:var(--display);font-weight:400;font-size:1.25rem;color:var(--gold)}
.check p{margin:0;font-size:.85rem;color:var(--muted);line-height:1.6}
.check p b{color:var(--fg)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.last{font-size:.8rem;line-height:1.55;border-top:1px dashed var(--line);padding-top:10px;color:var(--muted);min-height:2.6em}
.last b{color:var(--fg)}.last .hit{color:var(--gold)}.last .bad{color:var(--c0)}.last .ok{color:var(--c3)}
.foot{display:flex;justify-content:flex-end}
.foot button{padding:4px 10px;font-size:.76rem}

.overlay{position:fixed;inset:0;background:rgba(10,8,16,.84);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;max-width:480px;width:100%;display:flex;flex-direction:column;gap:14px}
.modal h2{font-family:var(--display);font-weight:400;margin:0;font-size:1.5rem}
.modal p{margin:0;color:var(--muted);font-size:.9rem;line-height:1.7}
.modal p b{color:var(--fg)}
@media (prefers-reduced-motion:reduce){.banner.show,.koma.hop,.tile.land,.tile.tease,.stock.bump b{animation-duration:.01s}}

[hidden]{display:none!important}
*{box-sizing:border-box}
body{margin:0}
.page,.side,.status{min-width:0}

/* 3列:左プレイヤー、中央盤、右操作 */
.main3{display:grid;grid-template-columns:230px minmax(0,1fr) 320px;gap:14px;align-items:start}
@media (max-width:1100px){.main3{grid-template-columns:minmax(0,1fr) 320px}.players{grid-column:1/-1}}
@media (max-width:760px){.main3{grid-template-columns:1fr}}
.players{display:flex;flex-direction:column;gap:8px;min-width:0}
@media (max-width:1100px){.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}}
.pcard{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;position:relative;min-width:0}
.pcard.me{box-shadow:0 0 0 2px var(--fg)}
.pcard.dead{opacity:.45}
.pcard .top{display:flex;align-items:center;gap:8px;min-width:0}
.pcard .top b{font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.pcard .col{width:22px;height:22px;border-radius:6px;border:2px solid var(--fg);flex:none;background:var(--line)}
.pcard .st{margin-left:auto;font-size:.64rem;font-weight:800;padding:2px 7px;border-radius:99px;white-space:nowrap;background:var(--line)}
.st.active{background:var(--gold);color:#2a1d00}.st.cashed{background:var(--c3);color:var(--ink)}.st.out{background:var(--out);color:var(--out-fg)}.st.dead{background:#000;color:var(--c0)}.st.ready{background:var(--c3);color:var(--ink)}
.pcard .nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.pcard .nums div{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.pcard .nums small{font-size:.6rem;color:var(--muted)}
.pcard .nums b{font-family:var(--display);font-weight:400;font-size:1.05rem;font-variant-numeric:tabular-nums}
.pcard .nums .m{color:var(--gold)}.pcard .nums .s{color:var(--stock)}
.pcard .ch{display:flex;gap:4px;flex-wrap:wrap;min-height:4px}
.pcard .ch .chn{display:flex;align-items:center;gap:4px;background:var(--bg);border-radius:6px;padding:2px 6px 2px 2px;max-width:100%}
.pcard .ch .chn svg{width:20px;height:20px;border-radius:4px;display:block;flex:none}
.pcard .ch .chn em{font-style:normal;font-size:.66rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .ch .none{font-size:.64rem;color:var(--muted)}
.pcard .pops{position:absolute;right:10px;top:34px;pointer-events:none}
.pop{position:absolute;right:0;font-family:var(--display);font-size:1.3rem;white-space:nowrap;text-shadow:0 2px 0 #000;animation:popup 1.8s ease-out forwards}
.pop.s{color:var(--stock)}.pop.c{color:var(--c3)}
@keyframes popup{0%{transform:translateY(10px) scale(.6);opacity:0}15%{transform:translateY(0) scale(1.2);opacity:1}30%{transform:scale(1)}80%{opacity:1}100%{transform:translateY(-26px);opacity:0}}
.toasts{position:absolute;left:50%;top:12px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;z-index:7;pointer-events:none;width:90%}
.toast{background:rgba(20,18,28,.92);border:2px solid var(--stock);border-radius:99px;padding:5px 14px;font-weight:800;font-size:.85rem;animation:toast 2.8s ease-out forwards;max-width:100%;text-align:center}
.toast.c{border-color:var(--c3)}.toast.b{border-color:var(--gold)}
@keyframes toast{0%{transform:translateY(-10px);opacity:0}10%{transform:none;opacity:1}85%{opacity:1}100%{opacity:0}}
.rtrack{display:flex;gap:4px;align-items:center}
.rtrack i{width:18px;height:18px;border-radius:5px;border:2px solid var(--line);font-style:normal;font-size:.6rem;display:flex;align-items:center;justify-content:center;color:var(--muted);font-weight:800}
.rtrack i.done{background:var(--gold-d);border-color:var(--gold-d);color:var(--ink)}
.rtrack i.now{background:var(--gold);border-color:var(--gold);color:#2a1d00;transform:scale(1.15)}
.rtrack .shop{font-size:.62rem;color:var(--gold);font-weight:800;padding:0 1px}
.mych{display:flex;flex-direction:column;gap:6px}
.mych div{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;align-items:center;font-size:.74rem;color:var(--muted);line-height:1.4}
.mych svg{width:28px;height:28px;border-radius:6px;display:block}
.mych b{color:var(--fg);font-size:.8rem;display:block}
.pcard .me-tag{font-size:.6rem;color:var(--muted)}
.pcard.fire{animation:pfire .6s ease-out}
@keyframes pfire{30%{transform:translateY(-4px);box-shadow:0 0 0 3px var(--gold),0 0 20px var(--gold)}}

.topbar{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 16px}
.topbar .stat b{font-size:1.3rem}
.timer{flex:1;min-width:160px;display:flex;flex-direction:column;gap:4px}
.timer .row{font-size:.76rem}
.tbar{height:10px;border-radius:5px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.tbar i{display:block;height:100%;background:var(--gold);width:0}
.tbar.hurry i{background:var(--c0)}

.boardwrap{position:relative;padding:8px;border-radius:18px;background:var(--panel);border:2px solid var(--line);width:100%;max-width:640px;margin:0 auto}
.boardwrap .board{max-width:none}
.boardwrap>.banner{z-index:6;font-size:clamp(1.4rem,5.5vw,3.4rem)}
.stage{container-type:size;gap:4cqh;padding:4px}
.wheel{width:auto;height:min(64cqh,82cqw);max-width:100%}
.hint{font-size:clamp(.58rem,3.6cqw,.82rem);max-width:90%}
.cp i{width:clamp(9px,4cqw,20px)}
.tile.start-mark{outline:2px dashed var(--fg);outline-offset:-4px}
.tile .who{position:absolute;bottom:1px;left:3px;font-size:clamp(.4rem,1.1vw,.6rem);color:var(--ink);font-weight:800}

.side h2{display:flex;justify-content:space-between;align-items:baseline}
.side h2 small{font-family:var(--body);font-size:.72rem;color:var(--muted)}
.cbtn{position:relative}
.cbtn .tk{position:absolute;inset:auto -4px -6px auto;background:var(--fg);color:var(--ink);font-size:.6rem;font-weight:800;border-radius:6px;padding:0 4px;max-width:40px;overflow:hidden;white-space:nowrap}
.watch{border:2px dashed var(--line);border-radius:12px;padding:14px;text-align:center;color:var(--muted);font-size:.88rem;line-height:1.6}
.watch b{display:block;font-family:var(--display);font-weight:400;font-size:1.3rem;color:var(--fg)}
.lockd{font-size:.8rem;color:var(--c3);text-align:center;font-weight:800}
.coin{position:fixed;top:-40px;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff7d1,var(--gold) 45%,var(--gold-d));border:2px solid #7a5a0e;pointer-events:none;z-index:16;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.side .bigpay b{white-space:nowrap;font-size:1.6rem}.side .bigpay span{flex-wrap:wrap}
.log2{font-size:.78rem;line-height:1.6;color:var(--muted);max-height:9.6em;overflow:auto;border-top:1px dashed var(--line);padding-top:8px}
.log2 div:first-child{color:var(--fg)}

/* ショップ(右枠内) */
.offers{display:flex;flex-direction:column;gap:8px}
.offer{border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:8px 10px;align-items:center;background:var(--bg)}
.offer svg{width:44px;height:44px;border-radius:9px;display:block}
.offer b{font-size:.88rem;display:block}
.offer small{font-size:.72rem;color:var(--muted);line-height:1.45;display:block}
.offer button{font-family:var(--display);font-weight:400;padding:6px 10px}
.offer.sold{opacity:.35}
.kw{font-size:.6rem;padding:1px 6px;border-radius:99px;background:var(--line);color:var(--fg);font-weight:700;white-space:nowrap;margin-right:3px}
.syn{font-size:.62rem;background:var(--gold);color:#2a1d00;font-weight:800;padding:1px 6px;border-radius:99px}

/* ロビー */
.lobby{max-width:520px}
.lobby input[type=text]{font:inherit;font-size:1rem;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--fg);width:100%}
.lobby .code{font-family:var(--display);font-size:2.4rem;letter-spacing:.2em;color:var(--gold);text-align:center}
.lobby .plist{display:flex;flex-direction:column;gap:6px}
.lobby .plist div{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:4px 0;font-size:.9rem}
.lobby .err{color:var(--c0);font-size:.85rem;min-height:1.2em}
.lobby .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lobby .or{text-align:center;color:var(--muted);font-size:.8rem}
.rank{display:flex;flex-direction:column;gap:6px}
.rank div{display:flex;justify-content:space-between;font-size:.95rem;border-bottom:1px dashed var(--line);padding:6px 0}
.rank div:first-child{color:var(--gold);font-family:var(--display);font-size:1.15rem}

.fxcanvas{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:18}
.boardwrap{padding:13px!important}
.bulbs{position:absolute;inset:4px;pointer-events:none;z-index:4}
.bulbs i{position:absolute;width:8px;height:8px;margin:-4px;border-radius:50%;background:#3a3448}
.bulbs i.on{background:#fff3c4;box-shadow:0 0 6px #f7c948,0 0 12px #f7c948}
.bulbs i.on.win{background:#fff;box-shadow:0 0 8px #fff,0 0 16px #f7c948}
.bulbs i.on.out{background:#ff8a92;box-shadow:0 0 8px #ec4e5a,0 0 14px #ec4e5a}
.bulbs i.on.check{background:#b8ffd6;box-shadow:0 0 8px #3fbf7f,0 0 14px #3fbf7f}
.bulbs i.on.safe{background:#fff;box-shadow:0 0 8px #fff}
.rayclip{position:absolute;inset:0;overflow:hidden;border-radius:16px;pointer-events:none;z-index:5}
.rays{position:absolute;left:50%;top:50%;width:160%;aspect-ratio:1;translate:-50% -50%;opacity:0;
  background:repeating-conic-gradient(from 0deg,rgba(255,243,196,.45) 0 7deg,transparent 7deg 18deg);
  -webkit-mask-image:radial-gradient(circle,#000 15%,transparent 62%);mask-image:radial-gradient(circle,#000 15%,transparent 62%)}
.rays.on{animation:rays 2s ease-out}
@keyframes rays{0%{opacity:0;transform:rotate(0) scale(.5)}15%{opacity:1}100%{opacity:0;transform:rotate(70deg) scale(1.15)}}
.boardwrap.focus .tile:not(.peek){filter:brightness(.55)}
.boardwrap.focus .stage{box-shadow:inset 0 0 60px rgba(0,0,0,.8)}
.wheel{transition:transform .25s}
.flashw{position:fixed;inset:0;background:rgba(255,255,255,.6);pointer-events:none;z-index:17;animation:flw .6s ease-out forwards}
@keyframes flw{from{opacity:1}to{opacity:0}}
.crack{position:fixed;inset:0;pointer-events:none;z-index:17;animation:crk 1.7s ease-out forwards}
@keyframes crk{0%{opacity:0}8%{opacity:1}70%{opacity:1}100%{opacity:0}}
.page.shake2{animation:shake2 .7s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake2{10%,90%{transform:translate(-3px,2px)}20%,80%{transform:translate(8px,-4px)}30%,50%,70%{transform:translate(-14px,6px) rotate(-.5deg)}40%,60%{transform:translate(14px,-6px) rotate(.5deg)}}
.banner.tier2{color:#fff3c4!important;text-shadow:0 5px 0 #b8891a,0 0 26px #f7c948}
.banner.tier3,.banner.tier4,.banner.rainbow{color:transparent!important;text-shadow:none;
  background:linear-gradient(90deg,#ff6b78,#ffd84d,#5fe09a,#5aa7ff,#c08bff,#ff6b78);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;
  -webkit-text-stroke:2px #fff;filter:drop-shadow(0 5px 0 #000) drop-shadow(0 0 18px rgba(247,201,72,.8))}
.banner.show.tier3,.banner.show.tier4,.banner.show.rainbow{animation:stamp var(--dur,.6s) cubic-bezier(.2,1.4,.4,1) forwards,rbmove .7s linear infinite}
.banner.tier4{font-size:clamp(2rem,8vw,4.6rem)!important}
.banner.hot{color:#ffb347!important;text-shadow:0 5px 0 #7a2a10,0 0 20px #ff6b3d}
@keyframes rbmove{to{background-position:200% 0}}
#tOdds.bump{animation:bump .5s ease-out;display:inline-block}
.counting{color:#fff!important;text-shadow:0 0 12px var(--gold)}
.stock.t1{border-style:solid;border-color:var(--gold-d)}
.stock.t2{border-style:solid;border-color:var(--gold);background:radial-gradient(circle at 50% 0%,rgba(247,201,72,.25),transparent 70%)}
.stock.t2 b{color:#fff3c4;text-shadow:0 4px 0 var(--gold-d),0 0 18px rgba(247,201,72,.7)}
.stock.t3{border-style:solid;border-width:3px;border-color:var(--gold);background:radial-gradient(circle at 50% 0%,rgba(247,201,72,.45),rgba(169,112,255,.14) 70%);animation:glow 1s ease-in-out infinite alternate}
.stock.t3 b{color:#fff;text-shadow:0 4px 0 var(--gold-d),0 0 26px var(--gold),0 0 50px rgba(255,255,255,.6)}
@keyframes glow{from{box-shadow:0 0 10px rgba(247,201,72,.4)}to{box-shadow:0 0 34px rgba(247,201,72,.95)}}
.boardwrap.hot1{border-color:var(--gold-d);box-shadow:0 0 24px rgba(247,201,72,.3)}
.boardwrap.hot2{border-color:transparent;background:linear-gradient(var(--panel),var(--panel)) padding-box,linear-gradient(90deg,var(--gold),#fff3c4,var(--gold-d),var(--gold)) border-box;background-size:auto,300% 100%;animation:frame 2.2s linear infinite;box-shadow:0 0 40px rgba(247,201,72,.45)}
.boardwrap.hot3{border-color:transparent;border-width:4px;background:linear-gradient(#241d10,#241d10) padding-box,linear-gradient(90deg,#ec4e5a,#f5c84c,#3fbf7f,#3e8ef7,#a970ff,#ec4e5a) border-box;background-size:auto,300% 100%;animation:frame 1.2s linear infinite;box-shadow:0 0 55px rgba(247,201,72,.6),0 0 100px rgba(169,112,255,.35)}
@keyframes frame{to{background-position:0 0,300% 0}}
@media (prefers-reduced-motion:reduce){.rays.on,.crack,.page.shake2,.boardwrap.hot2,.boardwrap.hot3,.stock.t3{animation:none}}

.tip{position:fixed;z-index:30;max-width:260px;background:#0e0c14;border:2px solid var(--gold-d);border-radius:10px;padding:8px 10px;font-size:.78rem;line-height:1.5;color:var(--muted);pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.6)}
.tip b{display:block;color:var(--fg);font-size:.9rem;margin-bottom:2px}

[data-tip]{cursor:help}
.updraw{display:block;width:22px;height:22px;border-radius:5px;border:2px solid var(--fg)}

.leftcol{display:flex;flex-direction:column;gap:10px;min-width:0}

.rr{display:grid;grid-template-columns:20px minmax(0,4.5em) minmax(0,1fr) auto 2.8em;gap:6px;align-items:center;font-size:.78rem}

.mycoin{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#2e2410,#1f1c2b);border:2px solid var(--gold);border-radius:14px;padding:10px 14px;box-shadow:0 0 22px rgba(247,201,72,.25)}

.mycoin div{display:flex;flex-direction:column;line-height:1;min-width:0;flex:1}
.mycoin small{font-size:.7rem;color:var(--gold);font-weight:800;letter-spacing:.06em}
.mycoin b{font-family:var(--display);font-weight:400;font-size:2.4rem;color:var(--gold);text-shadow:0 3px 0 var(--gold-d),0 0 18px rgba(247,201,72,.5);font-variant-numeric:tabular-nums}
.mycoin span{font-family:var(--display);font-size:.95rem}
.mycoin span.up{color:var(--c3)}.mycoin span.down{color:var(--c0)}
.gekibadge{text-align:center;font-family:var(--display);font-size:1rem;padding:8px;border-radius:12px;color:#fff;background:linear-gradient(90deg,#b8323d,#f7c948,#b8323d);background-size:200% 100%;animation:rbmove 1s linear infinite,glow 1s ease-in-out infinite alternate;text-shadow:0 2px 0 #000}

.cutin{position:fixed;inset:0;pointer-events:none;z-index:19;display:flex;align-items:center}
.cutin .band{width:100%;padding:18px 0;transform:skewY(-6deg);background:linear-gradient(90deg,#1d5fd6,#3e8ef7,#1d5fd6);box-shadow:0 0 40px rgba(62,142,247,.8);animation:band 1.4s cubic-bezier(.2,.9,.3,1) forwards;overflow:hidden}
.cutin .band span{display:block;text-align:center;font-family:var(--display);font-size:clamp(2.4rem,10vw,6rem);color:#fff;-webkit-text-stroke:3px #000;paint-order:stroke fill;text-shadow:6px 6px 0 rgba(0,0,0,.5);animation:slide 1.4s cubic-bezier(.2,.9,.3,1) forwards}

@keyframes band{0%{transform:skewY(-6deg) scaleY(0)}12%{transform:skewY(-6deg) scaleY(1)}85%{transform:skewY(-6deg) scaleY(1);opacity:1}100%{transform:skewY(-6deg) scaleY(0);opacity:0}}

.boardwrap.geki2 .stage{box-shadow:inset 0 0 70px rgba(236,78,90,.8);background:radial-gradient(circle at 50% 100%,rgba(255,120,40,.5),transparent 60%),radial-gradient(circle at 50% 40%,#3a1418,var(--bg) 80%);animation:flame .35s ease-in-out infinite alternate}
.boardwrap.geki3 .stage{box-shadow:inset 0 0 90px rgba(255,243,196,.9);background:radial-gradient(circle at 50% 100%,rgba(255,200,60,.6),transparent 60%),radial-gradient(circle at 50% 40%,#4a3410,var(--bg) 80%);animation:flame .25s ease-in-out infinite alternate}

@media (prefers-reduced-motion:reduce){.cutin .band,.cutin .band span,.gekibadge,.boardwrap.geki2 .stage,.boardwrap.geki3 .stage{animation:none}}

.chn.hasdw{box-shadow:inset 0 0 0 1px rgba(236,78,90,.6)}
.dwt{display:block;font-style:normal;color:#ff8a92!important;font-weight:700;font-size:.7rem;margin-top:2px}
.nodw{display:block;color:var(--c3)!important;font-size:.7rem;margin-top:2px}
.tip .dwt,.tip .nodw{margin-top:4px}
.cpop{position:fixed;z-index:19;transform:translate(-50%,-50%) scale(.4);opacity:0;display:flex;align-items:center;gap:8px;background:rgba(14,12,20,.92);border:2px solid var(--gold);border-radius:14px;padding:6px 12px 6px 6px;pointer-events:none;transition:left .4s cubic-bezier(.2,.9,.3,1),top .4s cubic-bezier(.2,.9,.3,1),transform .4s,opacity .2s;box-shadow:0 0 24px rgba(247,201,72,.6);white-space:nowrap}
.cpop svg{width:40px;height:40px;border-radius:9px}
.cpop span{font-weight:800;font-size:.95rem;display:flex;flex-direction:column;line-height:1.2}
.cpop span b{font-family:var(--display);font-weight:400;color:var(--gold);font-size:1.1rem}
.cpop.go{transform:translate(-50%,-50%) scale(1);opacity:1;animation:cpop 1.7s ease-out forwards}
.cpop.mine{border-color:#fff;box-shadow:0 0 30px #fff,0 0 50px rgba(247,201,72,.8)}
.cpop.mine svg{width:52px;height:52px}
@keyframes cpop{0%{opacity:0}15%{opacity:1}30%{transform:translate(-50%,-50%) scale(1.25)}45%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-80%) scale(.9)}}
.modal.wide{max-width:860px}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.dx{display:grid;grid-template-columns:40px minmax(0,1fr);gap:8px;align-items:start;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px}
.dx svg{width:40px;height:40px;border-radius:8px}
.dx b{font-size:.86rem;display:flex;gap:6px;align-items:center}
.dx small{font-size:.72rem;color:var(--muted);line-height:1.45;display:block}
.dx.own{border-color:var(--gold)}
.dx.dw{grid-template-columns:1fr}.dx.dw b{color:#ff8a92}
.offer small.dwt,.offer small.nodw{font-size:.68rem}

.overlay{overflow-y:auto!important;align-items:flex-start!important}
.modal{max-height:calc(100dvh - 40px);overflow-y:auto;margin:auto 0}
.pendrow{display:flex;align-items:baseline;gap:6px;border:1px dashed var(--stock-d);border-radius:8px;padding:2px 8px;background:rgba(79,214,232,.06);min-width:0}
.pendrow small{font-size:.6rem;color:var(--stock);font-weight:800;white-space:nowrap}
.pendrow b{font-family:var(--display);font-weight:400;font-size:1.1rem;color:var(--stock);flex:1;min-width:0}
.pendrow span{font-size:.56rem;color:var(--muted);white-space:nowrap}
.pcard.me .pendrow b{font-size:1.35rem}
.nums2{grid-template-columns:repeat(2,minmax(0,1fr))!important}
.tile .sym{position:absolute;top:1px;right:3px;font-size:clamp(.5rem,1.4vw,.8rem);color:rgba(20,18,28,.85);line-height:1}
.pcard .col{display:flex;align-items:center;justify-content:center;font-size:.7rem;color:rgba(20,18,28,.9)}
.cbtn .bsym{font-size:1.2rem;color:rgba(20,18,28,.85)}
.chip.up{display:inline-flex;align-items:center;justify-content:center;font-size:.6rem;color:rgba(20,18,28,.9)}
.tg{display:flex;gap:8px;align-items:flex-start;font-size:.86rem;line-height:1.5;cursor:pointer}
.tg input{width:18px;height:18px;margin-top:2px;flex:none}
html.cb{--c0:#D55E00;--c1:#0072B2;--c2:#F0E442;--c3:#009E73;--c4:#CC79A7}
html.low .page.shake,html.low .page.shake2,html.low .page.tense{animation:none!important}
html.low .boardwrap.hot2,html.low .boardwrap.hot3,html.low .stock.t3,html.low .gekibadge,html.low .oya b,html.low .yokoku.on,html.low .boardwrap.geki2 .stage,html.low .boardwrap.geki3 .stage{animation:none!important}
html.low .flashout{display:none}
html.low .rays,html.low .crack,html.low .flashw{display:none}
</style>
</head>
<body>
<div class="page" id="page">
  <div class="topbar">
    <div class="stat"><small>ラウンド <span id="tRound"></span></small><div class="rtrack" id="rtrack"></div></div>
    <div class="stat"><small>ルーレット</small><b id="tSpin">-</b></div>
    <div class="stat"><small>オッズ</small><b id="tOdds" style="color:var(--stock)">×5</b></div>
    <div class="stat"><small>親番(=UPの色)</small><b id="tDealer" style="display:flex;gap:5px;align-items:center;font-size:.95rem;font-family:var(--body);font-weight:800"></b></div>
    <b id="tUp" hidden></b>
    <div class="timer"><div class="row" style="display:flex;justify-content:space-between;color:var(--muted)"><span id="tPhase">待機中</span><span id="tLeft"></span></div><div class="tbar" id="tbar"><i id="tfill"></i></div></div>
    <div class="stat"><small>部屋</small><b id="tRoom" style="color:var(--gold)">-</b></div>
  </div>

  <div class="main3">
    <div class="leftcol"><div class="players" id="players"></div></div>

    <div class="boardwrap" id="boardwrap">
      <div class="board" id="board">
        <div class="stage">
          <div class="spinno" id="spinno"></div>
          <div class="yokoku" id="yokoku"></div>
          <div class="wheel" id="wheel"></div>
          <div class="cp" id="cp"></div>
          <div class="hint" id="hint"></div>
        </div>
      </div>
      <div class="rayclip"><div class="rays" id="rays"></div></div>
      <div class="banner" id="banner"></div>
      <div class="toasts" id="toasts"></div>
      <div class="hist" id="hist" aria-label="止まった色の記録"></div>
    </div>

    <div class="side" id="side">
      <div class="gekibadge" id="geki" hidden></div>
      <div id="panel"></div>
      <div class="log2" id="log" hidden></div>
      <div class="foot" style="gap:8px"><button id="dexBtn">図鑑</button><button id="setBtn">設定</button><button id="bgm" aria-pressed="true">BGM:ON</button><button id="snd" aria-pressed="true">音:ON</button></div>
    </div>
  </div>
</div>
<div class="flashout" id="flashout"></div>
<div class="overlay" id="overlay"><div class="modal lobby" id="modal"></div></div>

<script>
/* =========================================================
   メダルすごろく マルチ
   ホストのブラウザがゲームを進め、参加者はPeerJSでつながって操作を送る。
   ========================================================= */
const COLORS=[{n:"赤",v:"var(--c0)",s:"▲"},{n:"青",v:"var(--c1)",s:"●"},{n:"黄",v:"var(--c2)",s:"★"},{n:"緑",v:"var(--c3)",s:"■"},{n:"紫",v:"var(--c4)",s:"◆"}];
/* 表示の設定:色覚サポート(色ごとに記号+見分けやすい配色)、演出控えめ */
const OPT={cb:false,low:false};try{Object.assign(OPT,JSON.parse(localStorage.getItem("sgr_opt")||"{}"))}catch(e){}
function applyOpt(){document.documentElement.classList.toggle("cb",OPT.cb);document.documentElement.classList.toggle("low",OPT.low);
  try{HEX.splice(0,5,...(OPT.cb?["#D55E00","#0072B2","#F0E442","#009E73","#CC79A7"]:["#ec4e5a","#3e8ef7","#f5c84c","#3fbf7f","#a970ff"]))}catch(e){}}
const sym=c=>OPT.cb&&c!=null&&COLORS[c]?COLORS[c].s:"";
const OUT=5, SIDE=10, ODDS=[5,6,8,10,13,16,20,25,32,40,50,64];
const MAX_SPIN=20, BONUS20=50, START_MEDALS=50, MAX_PLAYERS=5, SAFE_SPINS=3;
/* オッズは表のあとも1段ごとに1.35倍ずつ伸び続ける(1兆まで届くように) */
const oddsAt=i=>i<ODDS.length?ODDS[i]:Math.round(ODDS[ODDS.length-1]*Math.pow(1.35,i-ODDS.length+1));
const fmtN=n=>Math.round(n).toLocaleString("ja-JP");
/* 金額の桁で演出の段階が決まる:10枚=1、100枚=2 … 1兆枚=12 */
const tierOf=n=>n>=10?Math.min(12,Math.floor(Math.log10(n)+1e-9)):0;
const TIERN=["","当たり!","大当たり!!","超大当たり!!!","JACKPOT!!!!","MEGA JACKPOT","GIGA JACKPOT","TERA JACKPOT","億り人!!","十億の夢","百億の神","千億の神話","1兆 伝説!!!"];
const maxRound=()=>G.maxRound||8;
const isShopRound=r=>G.cycle&&r%G.cycle===0&&r<maxRound();
const T_BET=20000, T_CHECK=10000, T_SHOP=60000;
const $=id=>document.getElementById(id);
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;

const PATH=[];
for(let c=0;c<SIDE;c++)PATH.push([0,c]);
for(let r=1;r<SIDE;r++)PATH.push([r,SIDE-1]);
for(let c=SIDE-2;c>=0;c--)PATH.push([SIDE-1,c]);
for(let r=SIDE-2;r>=1;r--)PATH.push([r,0]);
const N=PATH.length;

/* ================= お守り(盤を書き換えるもの・共有のルーレットを変えるものは除外) ================= */
const CHARMS={
  /* ---- 配当 ---- */
  longshot:{n:"遠投の手袋",ic:"遠",tag:"pay",kw:["大きい目"],price:40,d:"5か6の目で自分の色に止まると配当×3",pay:(p,c)=>c.d>=5?3:0},
  cliff:{n:"崖っぷち",ic:"崖",tag:"pay",kw:["OUT"],price:45,d:"OUTのとなりにある自分の色マスに止まると配当×5",pay:(p,c)=>(G.board[(c.i+1)%N]===OUT||G.board[(c.i-1+N)%N]===OUT)?5:0},
  thrift:{n:"倹約家",ic:"倹",tag:"pay",kw:["賭け"],price:35,d:"賭けが10枚以下なら配当×4",pay:p=>p.bet<=10?4:0},
  whale:{n:"大口",ic:"大",tag:"pay",kw:["賭け"],price:45,d:"所持コインの半分以上を賭けていると配当×3",pay:p=>p.bet>=p.betBase*.5?3:0},
  first:{n:"一番槍",ic:"槍",tag:"pay",kw:["当たり"],price:40,d:"このラウンドで最初に自分の色に止まったとき配当×5",pay:p=>p.hits===1?5:0},
  seven:{n:"ラッキー7",ic:"七",tag:"pay",kw:["回数"],price:45,d:"7回目・14回目に自分の色に止まると配当×7",pay:()=>G.spin%7===0?7:0},
  dealerk:{n:"親の威光",ic:"威",tag:"pay",kw:["親"],price:45,d:"自分が親のラウンドは配当×3",pay:p=>G.dealer===p.id?3:0},
  underdog:{n:"下剋上",ic:"逆",tag:"pay",kw:["逆転"],price:40,d:"所持コインが最下位なら配当×5",pay:p=>alivePs().every(q=>q===p||q.medals>=p.medals)&&alivePs().length>1?5:0},
  /* ---- 育つ ---- */
  heat:{n:"熱くなる",ic:"熱",tag:"grow",kw:["当たり"],price:45,d:"自分の色に止まるたび、このラウンド中の自分のオッズが2段上がる",after:p=>{p.ob+=2;return "オッズ2段UP"}},
  combo:{n:"連打",ic:"連",tag:"grow",kw:["当たり"],price:45,d:"このラウンドで当たった回数ぶん、配当に+賭け×回数×5",add:p=>p.bet*p.hits*5},
  snow:{n:"雪だるま",ic:"雪",tag:"grow",kw:["当たり","未確定"],price:50,d:"自分の色に止まるたび、それまでの未確定コインが×1.5",before:p=>{p.stock=Math.floor(p.stock*1.5);return "未確定×1.5"}},
  piggy:{n:"貯金箱",ic:"貯",tag:"grow",kw:["利確"],price:40,d:"利確するたびに中身が+賭け×10。利確のとき中身もまとめてもらえる(中身はなくならない)",cash:(p,c)=>{c.v=(c.v||0)+p.bet*10;return c.v},ctr:c=>c.v||0},
  nerve:{n:"度胸試し",ic:"胆",tag:"grow",kw:["利確","未確定"],price:50,d:"利確チャンスで「続ける」を選ぶたび、未確定コイン×1.5",cont:p=>{p.stock=Math.floor(p.stock*1.5);return "未確定×1.5"}},
  compound:{n:"複利",ic:"複",tag:"grow",kw:["利確"],price:45,d:"利確するとき、利確した額の30%を追加でもらえる",cashMul:.3},
  /* ---- リスク・OUT ---- */
  doll:{n:"身代わり人形",ic:"身",tag:"risk",kw:["OUT","OUT無効"],price:45,d:"ラウンドごとに、最初の2回のOUTを自分だけ無効にする"},
  boots:{n:"安全靴",ic:"靴",tag:"risk",kw:["OUT無効"],price:40,d:"自分だけ、OUTがセーフになる期間が5回目までに延びる",safeTo:5},
  eater:{n:"OUT喰い",ic:"喰",tag:"grow",kw:["OUT無効"],price:45,d:"自分のOUTが無効になるたび、自分のオッズが3段上がる",blocked:p=>{p.ob+=3;return "オッズ3段UP"}},
  fortune:{n:"厄落とし",ic:"厄",tag:"grow",kw:["OUT無効","未確定"],price:50,d:"自分のOUTが無効になるたび、未確定コイン×2",blocked:p=>{p.stock=Math.floor(p.stock*2);return "未確定×2"}},
  insure:{n:"保険証",ic:"保",tag:"risk",kw:["OUT"],price:35,d:"OUTで消える未確定コインのうち50%が戻ってくる",refund:.5},
  phoenix:{n:"不死鳥",ic:"鳳",tag:"risk",kw:["OUT","逆転"],price:50,d:"OUTで消えた未確定コインを、次のラウンドの開始時に全額取り戻す"},
  /* ---- UP・親 ---- */
  rush:{n:"ゴールドラッシュ",ic:"金",tag:"pay",kw:["UP"],price:40,d:"UPの色に止まると、賭け×自分のオッズぶんが未確定に入る",upHit:p=>{const w=Math.floor(p.bet*oddsOf(p));p.stock+=w;return `+${fmtN(w)}`}},
  reso:{n:"共鳴",ic:"響",tag:"grow",kw:["UP"],price:45,d:"UPの色に止まると、自分だけさらにオッズが2段上がる",upHit:p=>{p.ob+=2;return "オッズ2段UP"}},
  steal:{n:"横取り",ic:"奪",tag:"pay",kw:["逆転"],price:45,d:"ほかの人の色に止まると、その人の配当の40%が自分の未確定にも入る",steal:.4},
  rocket:{n:"ロケットスタート",ic:"始",tag:"grow",kw:["未確定"],price:40,d:"ラウンド開始時、未確定コインに賭け×10が入った状態で始まる",start:p=>{p.stock+=p.bet*10;return `未確定+${fmtN(p.bet*10)}`}},
  /* ---- 周回・ルール ---- */
  lap:{n:"周回ボーナス",ic:"周",tag:"board",kw:["周回"],price:45,d:"STARTを通過するたび、自分のオッズが2段上がる",lap:p=>{p.ob+=2;return "オッズ2段UP"}},
  marathon:{n:"マラソン",ic:"走",tag:"grow",kw:["周回","利確"],price:45,d:"利確のとき、このラウンドで回った周数×賭け×30枚を追加",cash:p=>G.laps*p.bet*30},
  early:{n:"早じまい",ic:"早",tag:"rule",kw:["利確"],price:35,d:"自分だけ、利確チャンスが3回ごとに来る",cp:3},
};
/* デメリット:ショップに並ぶとき、お守りごとにランダムで1つ付く */
const DRAWBACKS={
  none:{n:"なし",d:"デメリットなし"},
  top:{n:"1位条件",d:"ラウンドの収支で1位になれないと没収される"},
  tax:{n:"維持費",d:"毎ラウンド開始時、所持コインの5%を失う"},
  fragile:{n:"もろい",d:"3ラウンド後に壊れる"},
  outpain:{n:"道連れ",d:"OUTになったとき、所持コインも10%失う"},
  weak:{n:"弱体",d:"自分の色の配当が×0.7になる"},
  nodealer:{n:"親で無効",d:"自分が親のラウンドは効果がない"},
  minbet:{n:"小心者",d:"所持コインの20%以上を賭けないと効果がない"},
};
const DW_POOL=["none","top","top","tax","fragile","outpain","weak","nodealer","minbet"];
const TAGNAME={pay:"配当",risk:"リスク",board:"盤",grow:"育つ",rule:"ルール"};
const TAGCOL={pay:"#1d8796",risk:"#b8323d",board:"#2c9a63",grow:"#b8891a",rule:"#7a4fd0"};
/* お守りの説明で大事なところに色を付ける */
function hl(t){return esc(t)
  .replace(/(×\d+(?:\.\d+)?|\+\d+枚?|\d+%|\d+段|2倍|\d+回)/g,'<em class="hn">$1</em>')
  .replace(/(OUT)(?![^<]*<\/em>)/g,'<em class="ho">$1</em>')
  .replace(/(UPの色|利確|START|周数|未確定コイン|未確定|自分の色)/g,'<em class="hk">$1</em>')}
function icon(id){const d=CHARMS[id],col=TAGCOL[d.tag];
  return `<svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="12" style="fill:${col}"/>
    <rect x="5" y="5" width="54" height="54" rx="9" fill="rgba(255,255,255,.12)"/>
    <text x="32" y="35" text-anchor="middle" dominant-baseline="central" font-family="Dela Gothic One, sans-serif" font-size="30" fill="#fff" stroke="rgba(0,0,0,.35)" stroke-width="3" paint-order="stroke">${d.ic}</text></svg>`}
/* p.charms は {id, dw(デメリット), life} の配列 */
const cOn=(p,c)=>!(c.dw==="nodealer"&&G.dealer===p.id)&&!(c.dw==="minbet"&&p.bet<(p.betBase||p.medals)*.2);
const pHas=(p,id)=>p.charms.some(c=>c.id===id&&cOn(p,c));
const pEach=(p,hook,fn)=>p.charms.forEach(c=>{const d=CHARMS[c.id];if(d&&d[hook]&&cOn(p,c))fn(d,c)});
const pDw=(p,k)=>p.charms.filter(c=>c.dw===k).length;
const cpOf=p=>Math.min(5,...p.charms.filter(c=>cOn(p,c)).map(c=>CHARMS[c.id].cp||5));
const safeOf=p=>Math.max(SAFE_SPINS,...p.charms.filter(c=>cOn(p,c)).map(c=>CHARMS[c.id].safeTo||0));
const oddsOf=p=>oddsAt(G.oi+p.ob)+p.heat;

/* ================= 音 ================= */
let AC=null,soundOn=true;
const VOL={se:1,bgm:1};try{const v=JSON.parse(localStorage.getItem("sgr_vol")||"null");if(v){VOL.se=+v.se;VOL.bgm=+v.bgm}}catch(e){}
function beep(f,d=.06,type="square",vol=.05,ch="se"){if(!soundOn)return;vol*=VOL[ch];if(vol<=0.0001)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(vol,AC.currentTime);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);
    o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+d);}catch(e){}}
const jingle=(notes,step=70)=>notes.forEach((f,i)=>setTimeout(()=>beep(f,.12,"square",.06),i*step));

/* =========================================================
   通信
   ========================================================= */
const NET={host:false,peer:null,conns:new Map(),hostConn:null,me:null,code:null,offline:false};
function genCode(){const a="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let s="";for(let i=0;i<4;i++)s+=a[Math.random()*a.length|0];return s}
const peerId=code=>"medal-sugoroku-"+code;

function hostCreate(name,offline){
  NET.host=true;NET.me="host";NET.offline=!!offline;
  G=newGame();addPlayer("host",name,false);
  if(offline){NET.code="OFF";lobbyHost();return}
  const tryOpen=()=>{NET.code=genCode();
    const peer=new Peer(peerId(NET.code));NET.peer=peer;
    peer.on("open",()=>lobbyHost());
    peer.on("error",e=>{if(e.type==="unavailable-id"){peer.destroy();tryOpen()}else lobbyError("通信エラー:"+e.type)});
    peer.on("connection",conn=>{
      conn.on("data",msg=>hostRecv(conn,msg));
      conn.on("close",()=>{const p=G.players.find(x=>x.id===conn.peer);if(p){p.online=false;pushState()}NET.conns.delete(conn.peer)});
    });
  };
  tryOpen();
}
function hostRecv(conn,msg){
  if(msg.t==="join"){
    if(G.phase!=="lobby"){conn.send({t:"reject",why:"ゲームはもう始まっています"});return}
    if(G.players.length>=MAX_PLAYERS){conn.send({t:"reject",why:"満員です(最大5人)"});return}
    NET.conns.set(conn.peer,conn);addPlayer(conn.peer,msg.name,false);
    conn.send({t:"welcome",id:conn.peer,code:NET.code});pushState();lobbyHost();return;
  }
  if(msg.t==="act")hostAct(conn.peer,msg);
}
function clientJoin(name,code){
  NET.host=false;NET.code=code;
  const peer=new Peer();NET.peer=peer;
  peer.on("open",()=>{
    const conn=peer.connect(peerId(code),{reliable:true});NET.hostConn=conn;
    conn.on("open",()=>conn.send({t:"join",name}));
    conn.on("data",clientRecv);
    conn.on("close",()=>showModal(`<h2>接続が切れました</h2><p>ホストがページを閉じたか、回線が切れました。</p><button class="big" onclick="location.reload()">最初に戻る</button>`));
    setTimeout(()=>{if(!NET.me)lobbyError("部屋が見つかりません。コードを確認してください")},8000);
  });
  peer.on("error",e=>lobbyError(e.type==="peer-unavailable"?"部屋が見つかりません。コードを確認してください":"通信エラー:"+e.type));
}
function clientRecv(msg){
  if(msg.t==="welcome"){NET.me=msg.id;return}
  if(msg.t==="reject"){lobbyError(msg.why);return}
  if(msg.t==="state"){G=msg.s;G._recv=Date.now();if(G.phase==="lobby")lobbyGuest();else hideModal();view();return}
  if(msg.t==="ev")playEv(msg.ev);
}
function send(a){if(NET.host)hostAct(NET.me,a);else NET.hostConn&&NET.hostConn.open&&NET.hostConn.send({t:"act",...a})}
function pushState(){
  G.left=G.deadline?Math.max(0,G.deadline-Date.now()):0;
  const snap=JSON.parse(JSON.stringify(G));
  NET.conns.forEach(c=>{if(c.open)c.send({t:"state",s:snap})});
  G._recv=Date.now();view();
}
function bcastEv(ev){NET.conns.forEach(c=>{if(c.open)c.send({t:"ev",ev})});playEv(ev)}

/* =========================================================
   ゲーム状態(ホストが持つ。参加者はコピーを受け取って表示するだけ)
   ========================================================= */
let G;
function newGame(){return {phase:"lobby",round:0,spin:0,board:newBoard(),pos:0,oi:0,ups:[],laps:0,players:[],deadline:0,left:0,log:[],winner:null,ranking:null}}
function newBoard(){
  for(let t=0;t<5000;t++){
    const a=[];for(let c=0;c<6;c++)for(let k=0;k<6;k++)a.push(c);
    shuffle(a);if(a[0]!==OUT&&a.every((c,i)=>c!==a[(i+1)%N]))return a;
  }
}
function addPlayer(id,name,bot){
  name=(name||"プレイヤー").slice(0,10);
  let tag=name[0];if(G.players.some(x=>x.tag===tag))tag=name[0]+(G.players.length+1);
  G.players.push({id,name,tag,bot,online:true,alive:true,medals:START_MEDALS,charms:[],
    color:null,want:null,bet:5,bought:[],locked:false,stock:0,status:"wait",hits:0,heat:0,ob:0,dollLeft:0,piggy:0,
    deciding:false,decision:null,offers:[],reroll:5,ready:false,lastGain:0});
}
const P=id=>G.players.find(p=>p.id===id);
const alivePs=()=>G.players.filter(p=>p.alive);
const activePs=()=>G.players.filter(p=>p.alive&&p.status==="active");
function log(t){G.log.unshift(t);G.log=G.log.slice(0,40)}
function setDeadline(ms){G.deadline=ms?Date.now()+ms:0}
function newUps(){const pool=shuffle([0,1,2,3,4].filter(c=>!G.ups.includes(c)));G.ups=pool.slice(0,1)}

/* ---------- ホストの操作受付 ---------- */
function hostAct(pid,a){
  const p=P(pid);if(!p)return;
  if(G.phase==="bet"&&p.alive&&!p.locked){
    if(a.a==="pick"){if(a.color!=null&&G.round===1)p.want=a.color;if(a.bet!=null)p.bet=Math.max(1,Math.min(p.medals,Math.floor(a.bet)||1));pushState()}
    if(a.a==="lock"&&p.want!=null){p.locked=true;pushState();if(alivePs().every(x=>x.locked))wake()}
  }
  if(G.phase==="check"&&p.deciding&&a.a==="decide"){p.decision=a.v;p.deciding=false;pushState();if(!G.players.some(x=>x.deciding))wake()}
  if(G.phase==="shop"&&p.alive&&!p.ready){
    if(a.a==="buy"){const o=p.offers[a.k];if(o)o.price=costOf(p,o);if(o&&!o.sold&&p.bought.length<1&&p.medals>=o.price&&p.charms.length<5){p.medals-=o.price;o.sold=true;p.charms.push({id:o.id,dw:o.dw,life:o.dw==="fragile"?3:null});p.bought.push(o.id);log(`${p.name} が「${CHARMS[o.id].n}」を買った(デメリット:${DRAWBACKS[o.dw].d})`);if(o.id==="doll")p.dollLeft=2}}
    if(a.a==="reroll"&&p.medals>=p.reroll){p.medals-=p.reroll;p.reroll+=3;rollOffers(p)}
    if(a.a==="ready")p.ready=true;
    pushState();if(alivePs().every(x=>x.ready))wake();
  }
  if(G.phase==="lobby"&&NET.host&&pid===NET.me){
    if(a.a==="bot"&&G.players.length<MAX_PLAYERS){addPlayer("bot"+Math.random().toString(36).slice(2,7),"CPU"+(G.players.filter(x=>x.bot).length+1),true);pushState();lobbyHost()}
    if(a.a==="start")runGame();
  }
}
/* 待ち:締め切りか、全員の入力がそろったら進む */
let wakeFn=null;
function wake(){if(wakeFn){const f=wakeFn;wakeFn=null;f()}}
function waitPhase(ms){return new Promise(res=>{setDeadline(ms);pushState();const t=setTimeout(()=>{wakeFn=null;res()},ms);wakeFn=()=>{clearTimeout(t);res()}})}

/* ---------- CPU ---------- */
function botThink(){
  G.players.filter(p=>p.bot&&p.alive).forEach(p=>{
    const later=(fn)=>setTimeout(fn,800+Math.random()*2500);
    if(G.phase==="bet"&&!p.locked)later(()=>{if(G.phase!=="bet"||p.locked)return;
      if(G.round===1){const taken=G.players.filter(x=>x!==p&&x.want!=null).map(x=>x.want);
      const free=[0,1,2,3,4].filter(c=>!taken.includes(c));
      p.want=Math.random()<.8&&free.length?free[Math.random()*free.length|0]:Math.random()*5|0}
      p.bet=Math.max(1,Math.min(p.medals,Math.round(p.medals*(.1+Math.random()*.25))));
      hostAct(p.id,{a:"lock"})});
    if(G.phase==="check"&&p.deciding)later(()=>{if(!p.deciding)return;
      const v=p.stock>=p.bet*8||(p.stock>0&&Math.random()<.4)?"cash":"cont";hostAct(p.id,{a:"decide",v})});
    if(G.phase==="shop"&&!p.ready)later(()=>{
      const k=p.offers.findIndex(o=>!o.sold&&o.pct<=22);if(k>=0&&Math.random()<.6)hostAct(p.id,{a:"buy",k});
      hostAct(p.id,{a:"ready"})});
  });
}

/* ---------- 進行 ---------- */
async function runGame(){
  G.players.forEach(p=>{p.status="wait"});
  G.cycle=Math.max(1,G.players.length);G.maxRound=Math.max(2,G.cycle*2);G.hist=[];
  for(G.round=1;G.round<=G.maxRound;G.round++){
    await betPhase();
    await resolveColors();
    await spinPhase();
    const over=roundEnd();
    if(over)return;
    if(isShopRound(G.round))await shopPhase();
  }
  finish("最大ラウンド終了");
}
async function betPhase(){
  G.phase="bet";G.spin=0;G.oi=0;G.laps=0;G.ups=[];G.dealer=null;if(G.hist&&G.hist.length)G.hist.push("R");
  alivePs().forEach(p=>{p.locked=false;if(G.round===1){p.want=null;p.color=null}else p.want=p.color;
    p.status="wait";p.stock=0;p.hits=0;p.heat=0;p.ob=0;p.rcash=0;p.rlost=0;
    p.dollLeft=pHas(p,"doll")?2:0;p.lastGain=0;
    const tx=pDw(p,"tax");if(tx&&p.medals>0){const l=Math.floor(p.medals*.05*tx);p.medals-=l;if(l)log(`${p.name}:維持費 -${fmtN(l)}枚`)}
    if(p.phoenix){p.medals+=p.phoenix;log(`${p.name}:不死鳥で ${fmtN(p.phoenix)}枚を取り戻した`);bcastEv({k:"charm",id:p.id,cs:["phoenix"],txt:`+${fmtN(p.phoenix)}`});p.phoenix=0}
    p.bet=Math.max(1,Math.min(p.bet,p.medals))});
  log(G.round===1?`ラウンド1:色と賭けを選ぶ(色はゲーム終了まで固定)`:`ラウンド${G.round}:賭けを選ぶ`);
  bcastEv({k:"say",text:`ラウンド${G.round}`,color:"var(--gold)",ms:1100});
  botThink();
  await waitPhase(T_BET);
  // 時間切れの人は自動で決める
  alivePs().forEach(p=>{if(p.want==null)p.want=Math.random()*5|0;p.locked=true;p.bet=Math.max(1,Math.min(p.bet,p.medals))});
}
async function resolveColors(){
  G.phase="resolve";setDeadline(0);
  const ps=alivePs(),groups={};
  if(G.round===1)ps.forEach(p=>{(groups[p.want]=groups[p.want]||[]).push(p)});
  const fixed=[];
  for(const c of Object.keys(groups).map(Number)){
    const g=groups[c];
    if(g.length===1){g[0].color=c;fixed.push(c);continue}
    const win=g[Math.random()*g.length|0];win.color=c;fixed.push(c);
    bcastEv({k:"dup",color:c,names:g.map(x=>x.name),winner:win.name});
    log(`${COLORS[c].n}がかぶった → ルーレットで ${win.name} に決定`);
    await wait(2600);
  }
  ps.filter(p=>p.color==null).forEach(p=>{
    const free=shuffle([0,1,2,3,4].filter(c=>!ps.some(x=>x.color===c)));p.color=free[0];
    log(`${p.name} は ${COLORS[p.color].n} になった`);
  });
  ps.forEach(p=>{p.betBase=p.medals;p.medals-=p.bet;p.status="active"});
  // 親番:順番に回る。親の色がUPの色になる
  const n=G.players.length;let dealer=null;
  for(let k=0;k<n;k++){const q=G.players[n-1-((G.round-1+k)%n)];if(q.alive){dealer=q;break}}
  G.dealer=dealer.id;G.ups=[dealer.color];
  log(`親番:${dealer.name}(${COLORS[dealer.color].n}がUPの色)`);
  ps.forEach(p=>pEach(p,"start",(df,c)=>{log(`${p.name}:${df.n} ${df.start(p)}`)}));
  pushState();
  bcastEv({k:"upDraw",color:G.ups[0],dealer:dealer.name,owners:[dealer.id]});
  await wait(1900);
  pushState();
  bcastEv({k:"say",text:"スタート!!",color:"var(--gold)",ms:800});await wait(900);
}
async function spinPhase(){
  G.phase="run";
  for(G.spin=1;G.spin<=MAX_SPIN;G.spin++){
    if(!activePs().length)break;
    setDeadline(0);pushState();
    bcastEv({k:"say",text:G.spin<=SAFE_SPINS?`${G.spin}回目\nOUT無効`:G.spin===MAX_SPIN?"ラスト\n20回目":`${G.spin}回目`,color:"#fff",ms:850});
    await wait(950);
    const d=1+(Math.random()*6|0),a=5+Math.random()*50,dur=2000+Math.random()*700;
    bcastEv({k:"spin",d,a,dur,from:G.pos});
    await wait(dur+520+d*105+300);
    let laps=0;for(let s=1;s<=d;s++){G.pos=(G.pos+1)%N;if(G.pos===0)laps++}
    G.laps+=laps;
    landing(d,laps);
    pushState();
    await wait(2600);
    if(!activePs().length)break;
    if(G.spin===MAX_SPIN){ // 20回目:残っている人は自動で利確
      const surv=activePs();
      bcastEv({k:"say",text:`20回達成!!\nボーナス 賭け×${BONUS20}`,color:"#fff3c4",ms:1600});await wait(1700);
      surv.forEach(p=>{const b=p.bet*BONUS20;p.stock+=b;log(`${p.name}:20回達成ボーナス +${fmtN(b)}枚`);bcastEv({k:"bonus20",id:p.id,b})});pushState();await wait(1500);
      surv.forEach(p=>doCash(p,"20回到達で自動利確"));pushState();
      await wait(1500);break;
    }
    const due=activePs().filter(p=>G.spin%cpOf(p)===0);
    if(due.length){
      G.phase="check";due.forEach(p=>{p.deciding=true;p.decision=null});
      botThink();
      await waitPhase(T_CHECK);
      due.forEach(p=>{if(p.decision==="cash")doCash(p);else doCont(p);p.deciding=false});
      G.phase="run";pushState();await wait(700);
    }
  }
  G.phase="run";setDeadline(0);pushState();
}
function landing(d,laps){
  const i=G.pos,c=G.board[i],res=[];let upHit=false;
  G.hist=G.hist||[];G.hist.push({c,d});if(G.hist.length>80)G.hist=G.hist.slice(-80);
  G.dcount=G.dcount||[0,0,0,0,0,0];G.dcount[d-1]++;
  if(c===OUT&&G.spin<=SAFE_SPINS){
    log(`${G.spin}回目:OUTに止まったが、3回目まではセーフ`);
    bcastEv({k:"land",c,d,res:[],safe:true});return;
  }
  const hitters=[];
  activePs().forEach(p=>{
    const fx=[];
    for(let k=0;k<laps;k++)pEach(p,"lap",(df,cc)=>{fx.push(cc.id);res.push({id:p.id,t:`${df.n}:${df.lap(p)}`})});
    if(c===OUT){
      if(G.spin<=safeOf(p)){res.push({id:p.id,t:"安全靴でOUTがセーフ",block:true,fx:["boots"]});return}
      if(p.dollLeft>0){p.dollLeft--;const notes=[],bf=["doll"];pEach(p,"blocked",(df,cc)=>{bf.push(cc.id);notes.push(`${df.n}:${df.blocked(p)}`)});
        res.push({id:p.id,t:`身代わり人形でOUTを防いだ${notes.length?"("+notes.join("、")+")":""}`,block:true,fx:bf});return}
      const rf=Math.max(0,...p.charms.filter(cc=>cOn(p,cc)).map(cc=>CHARMS[cc.id].refund||0)),back=Math.floor(p.stock*rf);
      const pain=pDw(p,"outpain"),pl=pain?Math.floor(p.medals*.1*pain):0;
      if(pHas(p,"phoenix"))p.phoenix=(p.phoenix||0)+p.stock;
      res.push({id:p.id,t:`OUT:未確定 ${fmtN(p.stock)}枚が消えた${back?`(保険で${fmtN(back)}枚戻った)`:""}${pl?`(道連れで -${fmtN(pl)}枚)`:""}${pHas(p,"phoenix")?"(不死鳥:次ラウンドで取り戻す)":""}`,lost:p.stock,out:true});
      p.rlost=p.stock;p.medals+=back-pl;p.stock=0;p.status="out";return;
    }
    if(c===p.color){
      p.hits++;let mul=1,add=0,notes=[];const ctx={d,i};
      pEach(p,"before",(df,cc)=>{fx.push(cc.id);notes.push(`${df.n}:${df.before(p)}`)});
      pEach(p,"pay",(df,cc)=>{const m=df.pay(p,ctx);if(m){mul*=m;fx.push(cc.id);notes.push(`${df.n}×${m}`)}});
      pEach(p,"add",(df,cc)=>{const v=df.add(p);if(v){add+=v;fx.push(cc.id);notes.push(`${df.n}+${fmtN(v)}`)}});
      const wk=pDw(p,"weak");if(wk){mul*=Math.pow(.7,wk);notes.push(`弱体×${Math.pow(.7,wk).toFixed(2)}`)}
      const w=Math.floor(p.bet*oddsOf(p)*mul)+add;p.stock+=w;p.lastGain=w;hitters.push({p,w});
      pEach(p,"after",(df,cc)=>{fx.push(cc.id);notes.push(`${df.n}:${df.after(p)}`)});
      res.push({id:p.id,t:`当たり +${fmtN(w)}(${fmtN(p.bet)}×${fmtN(oddsOf(p))}${notes.length?"、"+notes.join("、"):""})`,gain:w,fx});
    }else if(fx.length)res.push({id:p.id,t:"",fx});
    if(G.ups.includes(c))pEach(p,"upHit",(df,cc)=>res.push({id:p.id,t:`${df.n} ${df.upHit(p)}`,fx:[cc.id]}));
    if(c!==OUT&&G.ups.includes(c)&&c===p.color){p.ob+=1;res.push({id:p.id,t:"UP色が自分の色:オッズUPが2倍(自分だけさらに1段UP)",upBonus:true})}
  });
  // 横取り
  hitters.forEach(({p:h,w})=>activePs().forEach(p=>{if(p===h)return;pEach(p,"steal",(df,cc)=>{const v=Math.floor(w*df.steal);if(v){p.stock+=v;res.push({id:p.id,t:`横取り:${h.name}から +${fmtN(v)}`,fx:[cc.id],steal:v})}})}));
  if(c!==OUT&&G.ups.includes(c)){upHit=true;G.oi++}
  res.forEach(r=>log(`${P(r.id).name}:${r.t}`));
  if(upHit)log(`UPの色に止まった → 全員のオッズUP`);
  if(c===OUT&&!res.some(r=>r.out||r.block))log("OUT(参加中の人はいない)");
  bcastEv({k:"land",c,d,res,upHit});
}
function doCash(p,why){
  let g=p.stock,notes=[],fx=[];pEach(p,"cash",(df,cc)=>{const v=df.cash(p,cc);if(v){g+=v;fx.push(cc.id);notes.push(`${df.n}+${fmtN(v)}`)}});
  pEach(p,"cashMul",()=>{});p.charms.filter(cc=>cOn(p,cc)&&CHARMS[cc.id].cashMul).forEach(cc=>{const v=Math.floor(g*CHARMS[cc.id].cashMul);g+=v;fx.push(cc.id);notes.push(`${CHARMS[cc.id].n}+${fmtN(v)}`)});
  if(fx.length)bcastEv({k:"charm",id:p.id,cs:fx,txt:notes.join(" ")});
  p.medals+=g;p.status="cashed";p.lastGain=g;p.rcash=g;
  log(`${p.name}:${why||"利確"} +${fmtN(g)}枚${notes.length?"("+notes.join("、")+")":""}`);
  bcastEv({k:"cash",id:p.id,g});
  p.stock=0;
}
function doCont(p){pEach(p,"cont",(df,cc)=>{log(`${p.name}:${df.n} ${df.cont(p)}`);bcastEv({k:"charm",id:p.id,cs:[cc.id],txt:"未確定×1.5"})})}
function roundEnd(){
  G.phase="roundEnd";setDeadline(0);G.oi=0;G.ups=[];G.spin=0;
  const rv=p=>p.status==="cashed"?p.rcash:0,best=Math.max(0,...alivePs().map(rv));
  alivePs().forEach(p=>{
    const lost=[];
    p.charms=p.charms.filter(c=>{
      if(c.dw==="top"&&!(rv(p)>0&&rv(p)===best)){lost.push(CHARMS[c.id].n+"(1位になれず没収)");return false}
      if(c.dw==="fragile"){c.life=(c.life??3)-1;if(c.life<=0){lost.push(CHARMS[c.id].n+"(壊れた)");return false}}
      return true});
    if(lost.length){log(`${p.name}:${lost.join("、")}`);bcastEv({k:"lostCharm",id:p.id,txt:lost.join("、")})}
  });
  alivePs().forEach(p=>{p.stock=0;if(p.medals<=0){p.alive=false;p.status="dead";log(`${p.name} はコインが尽きて脱落`)}});
  const alive=alivePs();
  pushState();
  if(G.players.length>1&&alive.length<=1){finish(alive.length?"最後の1人":"全員脱落");return true}
  if(G.players.length===1&&!alive.length){finish("脱落");return true}
  if(G.players.some(p=>!p.bot)&&!alive.some(p=>!p.bot)&&alive.length>1){finish("人間のプレイヤーがいなくなったので決着をスキップ");return true}
  if(G.round>=maxRound()){finish(`${maxRound()}ラウンド生き残った`);return true}
  return false;
}
/* お守りの値段は「所持コインの○%」。ショップ1回につき1つだけ買える */
const costOf=(p,o)=>Math.max(10,Math.floor(p.medals*o.pct/100));
function rollOffers(p){
  const pool=shuffle(Object.keys(CHARMS).filter(id=>!p.charms.some(c=>c.id===id))).slice(0,4);
  p.offers=pool.map(id=>{const dw=DW_POOL[Math.random()*DW_POOL.length|0];return {id,dw,sold:false,pct:Math.round(CHARMS[id].price*.5)-(dw==="none"?0:8),price:0}});
}
async function shopPhase(){
  G.phase="shop";
  alivePs().forEach(p=>{p.ready=false;p.reroll=5;p.bought=[];rollOffers(p);p.status="shop"});
  log("ショップ:お守りを買える");
  bcastEv({k:"say",text:"ショップ",color:"var(--gold)",ms:900});
  botThink();
  await waitPhase(T_SHOP);
  bcastEv({k:"bought",list:alivePs().map(p=>({id:p.id,name:p.name,ids:p.bought}))});
  await wait(3500);
}
function finish(why){
  G.phase="end";setDeadline(0);
  const order=[...G.players].sort((a,b)=>(b.alive-a.alive)||(b.medals-a.medals));
  G.ranking=order.map(p=>({name:p.name,medals:p.medals,alive:p.alive}));
  G.winner=order[0].name;log(`勝者:${G.winner}(${why})`);
  pushState();bcastEv({k:"say",text:`勝者\n${G.winner}`,color:"var(--gold)",ms:1800});
}

/* =========================================================
   表示(ホストも参加者も同じ)
   ========================================================= */
let tiles=[],koma,V={pos:0,rot:0,anim:false};
const isSafe=()=>G&&["resolve","run","check"].includes(G.phase)&&G.spin<=SAFE_SPINS;
function buildBoard(){
  const b=$("board");tiles.forEach(t=>t.remove());tiles=[];
  PATH.forEach(([r,c])=>{const t=document.createElement("div");t.className="tile";t.style.gridRow=r+1;t.style.gridColumn=c+1;b.appendChild(t);tiles.push(t)});
  koma=document.createElement("div");koma.className="koma";
}
const meP=()=>G&&G.players.find(p=>p.id===NET.me);
const whoOn=c=>G.players.filter(p=>p.alive&&(p.color===c||(G.phase==="bet"&&p.color==null&&p.want===c)));
function paintBoard(){
  if(!G)return;const me=meP(),my=me&&me.alive&&me.status!=="out"&&me.status!=="cashed"?(me.color??me.want):null;
  tiles.forEach((t,i)=>{const c=G.board[i];t.className="tile";t.textContent="";t.style.background="";

    if(p.type==="fly"){if(p.t===1){p.sx=p.x;p.sy=p.y}const k=p.t/p.life,e=k*k*(3-2*k);p.x=p.sx+(p.tx-p.sx)*e;p.y=p.sy+(p.ty-p.sy)*e-Math.sin(k*Math.PI)*90}

function nextDealer(){if(!G.round||!G.cycle)return null;const n=G.players.length;
  for(let k=0;k<n;k++){const q=G.players[n-1-((G.round+k)%n)];if(q&&q.alive)return G.round<maxRound()||G.phase==="bet"?q.id:null}return null}
function roundVal(p){if(!G.round)return "-";if(p.status==="cashed")return `<span style="color:var(--c3)">+${fmtN(p.rcash)}</span>`;
  if(p.status==="active")return `<span style="color:var(--stock)">+${fmtN(p.stock)}</span>`;if(p.status==="out")return `<span style="color:var(--out-fg)">-${fmtN(p.rlost)}</span>`;return "-"}
function rankOf(p){return 1+G.players.filter(q=>q!==p&&(q.alive>p.alive||(q.alive===p.alive&&q.medals>p.medals))).length}
function renderRank(){
  const ps=G.players.filter(p=>p.alive||p.rcash||p.rlost);
  if(!G.round||!ps.length){$("rrank").innerHTML="";return}
  const val=p=>p.status==="cashed"?p.rcash:p.status==="active"?p.stock:0;
  const rows=[...ps].sort((a,b)=>val(b)-val(a));const max=Math.max(1,...rows.map(val));
  $("rrank").innerHTML=`<b class="rh">R${G.round}収支</b>`+rows.map((p,i)=>{
    const v=val(p),st=p.status==="cashed"?"c":p.status==="active"?"s":p.status==="out"?"o":"n";
    return `<span class="rr ${p.id===NET.me?"me":""} ${st}"><i class="no ${i===0&&v>0?"top":""}">${i+1}</i>${esc(p.tag)}<em>${p.status==="out"?`-${fmtN(p.rlost)}`:(v?"+"+fmtN(v):"0")}</em></span>`}).join("");
}

function timerTick(){

function showModal(h){$("modal").innerHTML=h;$("overlay").hidden=false}
function hideModal(){$("overlay").hidden=true}
function lobbyError(t){const e=$("lerr");if(e)e.textContent=t;else showModal(`<h2>エラー</h2><p>${esc(t)}</p><button class="big" onclick="location.reload()">最初に戻る</button>`)}
function lobbyStart(){
  const ok=typeof Peer!=="undefined";
  showModal(`<h2>メダルすごろく マルチ</h2>
    <div><div class="label">名前</div><input type="text" id="lname" maxlength="10" value="プレイヤー"></div>
    ${ok?`<button class="big" id="lhost">部屋を作る</button>
    <div class="or">または、もらったコードで参加</div>
    <div class="two"><input type="text" id="lcode" maxlength="4" placeholder="コード4文字" style="text-transform:uppercase"><button class="big" id="ljoin">参加する</button></div>`
    :`<p>通信ライブラリを読み込めませんでした。インターネットにつながった状態で、GitHub Pagesなどに置いたページを開くと友達と遊べます。</p>`}
    <button id="loff">CPUとだけ遊ぶ(通信なし)</button>
    <div class="two"><button id="lset">設定(音量)</button><button id="ldex">お守り図鑑</button></div>
    <div class="err" id="lerr"></div>`);
  const nm=()=>$("lname").value.trim()||"プレイヤー";
  if(ok){$("lhost").onclick=()=>{$("lerr").textContent="部屋を作っています…";hostCreate(nm(),false)};
    $("ljoin").onclick=()=>{const code=$("lcode").value.trim().toUpperCase();if(code.length!==4){$("lerr").textContent="コードは4文字です";return}
      $("lerr").textContent="接続しています…";clientJoin(nm(),code)}}
  $("loff").onclick=()=>hostCreate(nm(),true);
  $("lset").onclick=openSettings;$("ldex").onclick=openDex;
}
function lobbyHost(){
  showModal(`<h2>部屋を作りました</h2>
    ${NET.offline?`<p>通信なしモードです。CPUを追加して遊べます。</p>`:`<p>友達にこのコードを送ってください。</p><div class="code">${NET.code}</div>`}
    <div><div class="label">参加者(${G.players.length}/${MAX_PLAYERS})</div><div class="plist">${G.players.map(p=>`<div><span>${esc(p.name)}</span><span>${p.id===NET.me?"ホスト":p.bot?"CPU":"参加"}</span></div>`).join("")}</div></div>
    <div class="two"><button id="lbot" ${G.players.length>=MAX_PLAYERS?"disabled":""}>CPUを追加</button><button class="big" id="lgo">ゲーム開始</button></div>
    <p style="font-size:.8rem">ルール:全員で同じ盤とルーレット。1人1色。各ラウンド3回目まではOUTに止まってもセーフ。親番が順番に回り、親の色がUPの色になる。ラウンド数は人数×2。全員が1回ずつ親をやるとショップ。コインが0になったら脱落。最後まで生き残ったらコインの多い人が勝ち。</p>`);
  $("lbot").onclick=()=>send({a:"bot"});
  $("lgo").onclick=()=>{hideModal();send({a:"start"})};
}
function lobbyGuest(){
  showModal(`<h2>部屋 ${esc(NET.code)} に参加しました</h2><p>ホストがゲームを始めるのを待っています。</p>
    <div class="plist">${G.players.map(p=>`<div><span>${esc(p.name)}</span><span>${p.id===NET.me?"あなた":p.bot?"CPU":""}</span></div>`).join("")}</div>`);
}
function showEnd(){
  if(!G.ranking)return;
  showModal(`<h2>勝者:${esc(G.winner)}</h2><div class="rank">${G.ranking.map((r,i)=>`<div><span>${i+1}位 ${esc(r.name)}${r.alive?"":"(脱落)"}</span><span>${r.medals}枚</span></div>`).join("")}</div>
    ${NET.offline?`<button class="big" id="retryBtn">もう一度(同じCPUで)</button>`:""}<button ${NET.offline?"":'class="big"'} onclick="location.reload()">最初に戻る</button>`);
  const rb=$("retryBtn");if(rb)rb.onclick=retry;
}
function retry(){try{sessionStorage.setItem("sgr_retry",JSON.stringify({name:meP()?.name||"プレイヤー",bots:G.players.filter(p=>p.bot).length}))}catch(e){}location.reload()}
function openSettings(){
  const back=$("overlay").hidden?null:$("modal").innerHTML;
  showModal(`<h2>設定</h2>
    <div><div class="label">効果音の音量</div><input type="range" id="vse" min="0" max="1" step="0.05" value="${VOL.se}" style="width:100%"></div>
    <div><div class="label">BGMの音量</div><input type="range" id="vbgm" min="0" max="1" step="0.05" value="${VOL.bgm}" style="width:100%"></div>
    <label class="tg"><input type="checkbox" id="ocb" ${OPT.cb?"checked":""}> 色覚サポート(色ごとに記号を付け、見分けやすい配色にする)</label>
    <label class="tg"><input type="checkbox" id="olow" ${OPT.low?"checked":""}> 演出控えめ(揺れ・フラッシュ・紙吹雪・メダルの噴き出しを止める)</label>
    ${NET.offline&&G.phase!=="lobby"?`<button id="sRetry">最初からやり直す(同じCPUで)</button>`:""}
    <button class="big" id="sClose">閉じる</button>`);
  const save=()=>{try{localStorage.setItem("sgr_vol",JSON.stringify(VOL))}catch(e){}};
  $("vse").oninput=e=>{VOL.se=+e.target.value;save();beep(880,.06)};
  $("vbgm").oninput=e=>{VOL.bgm=+e.target.value;save()};
  const so=()=>{try{localStorage.setItem("sgr_opt",JSON.stringify(OPT))}catch(e){}applyOpt();panelSig="";if(G)view()};
  $("ocb").onchange=e=>{OPT.cb=e.target.checked;so()};$("olow").onchange=e=>{OPT.low=e.target.checked;so()};
  if($("sRetry"))$("sRetry").onclick=retry;
  $("sClose").onclick=()=>{if(back&&G.phase==="lobby"){$("modal").innerHTML=back;lobbyStart()}else if(G.phase==="lobby")lobbyStart();else hideModal()};
}



/* 激アツ予告:自分の色が多く並ぶ・未確定がふくらんでいるときにカットインが入る(たまにガセもある) */
/* 予告の強さは「当たったら持っていられるコイン(未確定+今回の配当)」の桁で決まる。自分の色が次の6マスに1つ以上あるときだけ */
function heatLevel(me,from){
  if(!me||me.status!=="active"||me.color==null)return 0;
  let segs=0;for(let k=1;k<=6;k++)if(G.board[(from+k)%N]===me.color)segs++;
  if(!segs)return 0;
  const pot=me.stock+me.bet*oddsOf(me),T=tierOf(pot);
  const lv=T>=4?3:T>=3?2:T>=2?1:0;
  return lv?{lv,pot,T,segs}:0;
}
function showYokoku(h){const y=$("yokoku");
  if(!h){y.className="yokoku";y.innerHTML="";return}
  y.className="yokoku on lv"+h.lv;y.innerHTML=`${["","チャンス!","激アツ!!","超激アツ!!!"][h.lv]}<small>当たれば未確定 ${fmtN(h.pot)}枚(${h.segs}/6マス)</small>`}
function cutin(h){
  const lv=h.lv,t=["","チャンス!","激アツ!!","超激アツ!!!"][lv];
  showYokoku(h);
  if(lv===1){sweep(500,1200,300);beep(1200,.15,"square",.05)}
  if(lv===2){sweep(300,1800,450,"sawtooth",.06);setTimeout(()=>jingle([880,1175,1568]),300);bulbs("out",1600);shake()}
  if(lv===3){sweep(200,2400,600,"sawtooth",.07);setTimeout(()=>fanfare(3),350);bulbs("win",2200);shake(true);flashScreen("rgba(255,243,196,.6)");setTimeout(()=>confetti(80),300)}
}

/* 当たりの祝い方:桁が上がるほど派手に */
function celebrate(T,tc,col){
  const t=Math.min(4,T),x=Math.max(0,T-4);
  burst(tc.x,tc.y,[col,"#fff","#f7c948"],25+t*25+x*30,7+t*2+x);
  fountain(tc.x,tc.y,12+t*22+x*25);
  if(t>=2){rays();flashScreen(t>=4?"rgba(255,243,196,.75)":"")}
  if(t>=3){shake(true);confetti(t*60+x*60)}
  if(T>=5){[0,350,700].slice(0,Math.min(3,x)).forEach(d=>setTimeout(()=>{rays();flashScreen("rgba(255,255,255,.7)");const r=rectC($("board"));burst(r.x,r.y,HEX,80,12);fountain(r.x,r.y,40)},d+500))}
  if(T>=8){setTimeout(()=>{confetti(260);shake(true)},1200)}
  bulbs("win",1200+t*500+x*600);fanfare(t);
  if(T>=5)setTimeout(()=>fanfare(4),700);
}

/* お守りが発動したら、持ち主の枠からアイコンが飛び出して盤の上で光る */
function charmPop(pid,ids,txt){
  const card=document.querySelector(`.pcard[data-id="${CSS.escape(pid)}"]`),b=$("board");if(!b)return;
  const from=card?rectC(card):rectC(b),to=rectC(b);const mine=pid===NET.me;
  [...new Set(ids)].forEach((id,k)=>setTimeout(()=>{
    const d=document.createElement("div");d.className="cpop"+(mine?" mine":"");
    d.innerHTML=`${icon(id)}<span>${CHARMS[id].n}${txt&&k===0?`<b>${txt}</b>`:""}</span>`;
    d.style.left=from.x+"px";d.style.top=from.y+"px";document.body.appendChild(d);
    requestAnimationFrame(()=>{d.style.left=to.x+"px";d.style.top=(to.y-60+k*58)+"px";d.classList.add("go")});
    setTimeout(()=>{burst(to.x,to.y-60+k*58,[TAGCOL[CHARMS[id].tag],"#fff","#f7c948"],mine?40:18,mine?8:5);if(mine){beep(1319,.08);beep(1760,.1,"triangle",.05)}},420);
    setTimeout(()=>d.remove(),1700)},k*260));
  firePlayer(pid);
}
/* 図鑑 */
function openDex(){
  const me=meP(),own=new Set((me?.charms||[]).map(c=>c.id));
  const groups=Object.keys(TAGNAME).map(t=>({t,ids:Object.keys(CHARMS).filter(id=>CHARMS[id].tag===t)})).filter(g=>g.ids.length);
  showModal(`<h2>お守り図鑑 <small style="font-family:var(--body);font-size:.8rem;color:var(--muted)">${Object.keys(CHARMS).length}種類</small></h2>
    ${groups.map(g=>`<div><div class="label">${TAGNAME[g.t]}</div><div class="dex">${g.ids.map(id=>{const d=CHARMS[id];return `<div class="dx ${own.has(id)?"own":""}">${icon(id)}<div><b>${d.n}${own.has(id)?`<span class="syn">所持</span>`:""}</b><div>${d.kw.map(k=>`<span class="kw">${k}</span>`).join("")}</div><small>${hl(d.d)}</small></div></div>`}).join("")}</div></div>`).join("")}
    <div><div class="label">デメリット(ショップで並ぶときにランダムで1つ付く)</div><div class="dex">${Object.values(DRAWBACKS).map(w=>`<div class="dx dw"><div><b>${w.n}</b><small>${w.d}</small></div></div>`).join("")}</div></div>
    <button class="big" id="dexClose">閉じる</button>`);
  $("modal").classList.add("wide");
  $("dexClose").onclick=()=>{$("modal").classList.remove("wide");if(G.phase==="lobby")lobbyStart();else hideModal()};
}
/* お守りのツールチップ */
const TIP=document.createElement("div");TIP.className="tip";TIP.hidden=true;document.body.appendChild(TIP);
function showTip(id,x,y,dw){const d=CHARMS[id];if(!d)return;
  TIP.innerHTML=`<b>${d.n}</b><div>${d.kw.map(k=>`<span class="kw">${k}</span>`).join("")}</div>${hl(d.d)}${dw&&DRAWBACKS[dw]?`<div class="${dw==="none"?"nodw":"dwt"}">デメリット:${DRAWBACKS[dw].d}</div>`:""}`;TIP.hidden=false;
  const w=TIP.offsetWidth,h=TIP.offsetHeight;TIP.style.left=Math.max(8,Math.min(innerWidth-w-8,x+14))+"px";TIP.style.top=Math.max(8,Math.min(innerHeight-h-8,y+16))+"px"}
document.addEventListener("mousemove",e=>{const t=e.target.closest&&e.target.closest("[data-tip]");if(t)showTip(t.dataset.tip,e.clientX,e.clientY,t.dataset.dw);else TIP.hidden=true});
let tipT=null;document.addEventListener("click",e=>{const t=e.target.closest&&e.target.closest("[data-tip]");if(!t||e.target.closest("button"))return;
  const r=t.getBoundingClientRect();showTip(t.dataset.tip,r.left,r.bottom,t.dataset.dw);clearTimeout(tipT);tipT=setTimeout(()=>TIP.hidden=true,2800)});
document.addEventListener("pointerdown",()=>{try{if(AC&&AC.state==="suspended")AC.resume()}catch(e){}});
buildBoard();fxInit();bulbsInit();bgmTick();
G=newGame();view();
(()=>{let r=null;try{r=JSON.parse(sessionStorage.getItem("sgr_retry")||"null");sessionStorage.removeItem("sgr_retry")}catch(e){}
  if(r){hostCreate(r.name,true);for(let k=0;k<r.bots;k++)hostAct(NET.me,{a:"bot"});hideModal();hostAct(NET.me,{a:"start"})}else lobbyStart()})();
</script>
