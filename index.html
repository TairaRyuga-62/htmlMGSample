<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ゴールドフィールド</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+1p:wght@400;700;800&display=swap">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>

/* Layout: 上にステータス帯と手順バー、左に10×10外周のすごろく盤(中央が演出ステージ)、右に操作枠(ベット→走行→利確判断で中身が切り替わる)。単一のゲームセンター風ダーク */
:root{
  --bg:#14121c; --panel:#1f1c2b; --line:#36314a; --fg:#f1eefa; --muted:#a39dbb; --ink:#14121c;
  --gold:#f7c948; --gold-d:#b8891a; --out:#6b6876; --out-fg:#e6e4ec;
  --stock:#4fd6e8; --stock-d:#1d8796;
  --c0:#ec4e5a; --c1:#3e8ef7; --c2:#f5c84c; --c3:#3fbf7f; --c4:#a970ff;
  --display:"Dela Gothic One","M PLUS 1p",system-ui,sans-serif;
  --body:"M PLUS 1p","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.page{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:12px}

.status{display:flex;flex-wrap:wrap;gap:10px 28px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.stat{display:flex;flex-direction:column;line-height:1.1}
.stat small{color:var(--muted);font-size:.7rem;letter-spacing:.08em}
.stat b{font-family:var(--display);font-weight:400;font-size:1.4rem;font-variant-numeric:tabular-nums}
.stat.medal b{color:var(--gold);font-size:1.7rem}
.status .sp{flex:1}


.callout{border:2px solid var(--stock-d);border-radius:12px;padding:12px 14px;background:rgba(79,214,232,.06);display:flex;flex-direction:column;gap:6px}
.callout b{font-family:var(--display);font-weight:400;font-size:1.15rem;color:var(--stock);display:flex;align-items:center;gap:8px}
.callout span{font-size:.8rem;color:var(--muted);line-height:1.55}
.callout span strong{color:var(--fg)}
.chip{display:inline-block;width:18px;height:18px;border-radius:4px;background:var(--line);border:2px solid var(--fg)}
.upb{display:inline-block;font-style:normal;font-family:var(--display);font-size:.62rem;line-height:1;padding:3px 5px;border-radius:5px;background:var(--fg);color:var(--ink);vertical-align:middle}
.tile .upb{position:absolute;bottom:2px;right:2px;font-size:clamp(.38rem,1.1vw,.6rem);padding:2px 3px;box-shadow:0 0 0 2px var(--ink)}
.oddsbox{display:grid;grid-template-columns:1fr auto 1fr auto;gap:10px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.oddsbox div{display:flex;flex-direction:column;gap:2px;min-width:0}
.oddsbox small{font-size:.66rem;color:var(--muted);letter-spacing:.06em}
.oddsbox b{font-family:var(--display);font-weight:400;font-size:1.5rem;font-variant-numeric:tabular-nums}
.oddsbox b.now{color:var(--stock)}
.oddsbox .arrow{color:var(--muted);font-size:1.1rem}
.oddsbox .upc{align-items:center}
.oddsbox .upc i{width:26px;height:26px;border-radius:6px;border:2px solid var(--fg)}
.oddsbox.bump b.now{animation:bump .45s ease-out}
.main{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:880px){.main{grid-template-columns:1fr}}

.board{position:relative;display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(10,1fr);gap:4px;aspect-ratio:1;width:100%;max-width:620px;margin:0 auto}
.tile{border-radius:6px;position:relative;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25);transition:opacity .2s,transform .12s;font-family:var(--display);font-size:clamp(.45rem,1.5vw,.8rem);color:var(--c0)}
.tile.dim{opacity:1}
.tile.aim{box-shadow:inset 0 -4px 0 rgba(0,0,0,.25),0 0 0 3px var(--fg),0 0 14px rgba(255,255,255,.35)}
.tile.target{z-index:2;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25),0 0 0 3px #fff,0 0 18px 4px rgba(255,255,255,.85);animation:tgtpulse .7s ease-in-out infinite}
@keyframes tgtpulse{0%,100%{box-shadow:inset 0 -4px 0 rgba(0,0,0,.25),0 0 0 3px #fff,0 0 14px 2px rgba(255,255,255,.7)}50%{box-shadow:inset 0 -4px 0 rgba(0,0,0,.25),0 0 0 4px #fff3c4,0 0 26px 7px rgba(247,201,72,.95)}}
html.low .tile.target{animation:none}
.mchip.near{animation:chipnear .6s ease-in-out infinite;box-shadow:0 0 10px var(--mc)}
@keyframes chipnear{0%,100%{box-shadow:0 0 6px var(--mc)}50%{box-shadow:0 0 16px 2px var(--mc)}}
.mcard.near{box-shadow:0 0 0 2px var(--mc),0 0 16px var(--mc);animation:chipnear .7s ease-in-out infinite}
.tile.upaim{box-shadow:inset 0 -4px 0 rgba(0,0,0,.25),0 0 0 3px #f7c948,0 0 16px rgba(247,201,72,.7)}
.tile.out{background:var(--out);color:var(--out-fg);background-image:repeating-linear-gradient(45deg,transparent 0 6px,rgba(0,0,0,.18) 6px 12px)}
.tile.trail::before{content:"";position:absolute;width:22%;aspect-ratio:1;border-radius:50%;background:var(--fg);opacity:.85;box-shadow:0 0 0 2px var(--ink)}
.tile .stepn{position:absolute;top:2px;left:4px;font-size:clamp(.45rem,1.4vw,.75rem);color:var(--ink);background:var(--fg);border-radius:4px;padding:0 3px;line-height:1.3}
/* OUT演出 */
.board.dead{filter:grayscale(1) brightness(.6);transition:filter .3s}
.page.shake{animation:shake .5s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(5px)}30%,50%,70%{transform:translateX(-10px)}40%,60%{transform:translateX(10px)}}
.flashout{position:fixed;inset:0;pointer-events:none;z-index:15;background:radial-gradient(circle,rgba(230,228,236,.0) 20%,rgba(20,18,28,.85) 75%);opacity:0}
.flashout.on{animation:fo 1.6s ease-out forwards}
@keyframes fo{0%{opacity:0;background-color:rgba(255,255,255,.55)}8%{opacity:1;background-color:rgba(255,255,255,.35)}20%{background-color:transparent}75%{opacity:1}100%{opacity:0}}
.banner.out{font-size:clamp(3.4rem,15vw,7.5rem);color:var(--out-fg)!important;letter-spacing:.06em;text-shadow:0 6px 0 #000,0 0 30px rgba(0,0,0,.8)}
.wheel{width:min(100%,clamp(110px,26vw,170px));aspect-ratio:200/212}
.wheel svg{width:100%;height:100%;display:block;overflow:visible}
.tile.peek{transform:scale(1.15);z-index:2;box-shadow:0 0 0 4px var(--gold),0 0 18px var(--gold)}
.tile.tease{animation:tease .45s ease-in-out}
@keyframes tease{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.tile.land{animation:land .5s ease-out}
@keyframes land{0%{transform:scale(1)}35%{transform:scale(1.35);z-index:2;box-shadow:0 0 0 4px var(--fg)}100%{transform:scale(1)}}
.koma{position:absolute;width:58%;aspect-ratio:1;border-radius:50%;background:var(--fg);border:3px solid var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.5);z-index:3;display:flex;align-items:center;justify-content:center}
.koma::after{content:"";width:40%;aspect-ratio:1;border-radius:50%;background:var(--gold)}
.koma.hop{animation:hop .11s ease-out}
@keyframes hop{0%{transform:translateY(0)}50%{transform:translateY(-45%) scale(1.08)}100%{transform:translateY(0)}}

.stage{grid-column:2/10;grid-row:2/10;border-radius:12px;background:radial-gradient(circle at 50% 40%,#2a2540,var(--bg) 75%);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;overflow:hidden;position:relative;padding:8px}
.cp{display:flex;gap:6px}
.cp i{width:clamp(14px,3.4vw,22px);aspect-ratio:1;border-radius:50%;border:2px solid var(--line)}
.cp i.on{background:var(--gold);border-color:var(--gold)}
.hint{font-size:.82rem;text-align:center;max-width:28ch;line-height:1.5;color:var(--muted)}
.banner{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--display);font-size:clamp(1.7rem,7vw,3.8rem);line-height:1.1;pointer-events:none;text-shadow:0 4px 0 rgba(0,0,0,.6);padding:0 8px;white-space:pre-line}
.banner.show{animation:stamp var(--dur,.6s) cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes stamp{0%{transform:scale(2.4);opacity:0}16%{transform:scale(.92);opacity:1}24%{transform:scale(1.04)}88%{transform:scale(1);opacity:1}100%{transform:scale(1);opacity:0}}

.side{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.side h2{margin:0;font-family:var(--display);font-weight:400;font-size:1.05rem}
.box{display:flex;flex-direction:column;gap:14px}
.label{font-size:.72rem;color:var(--muted);letter-spacing:.08em;margin-bottom:6px}
button{font-family:var(--body);font-weight:700;cursor:pointer;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--fg);padding:8px 12px;font-size:.9rem}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button:disabled{opacity:.35;cursor:not-allowed}
.colors,.bets{display:flex;flex-wrap:wrap;gap:8px}
.betin{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;align-items:stretch}
.betin input{grid-column:span 2;width:auto;min-width:0;font-family:var(--display);font-size:1.4rem;text-align:center;background:var(--bg);color:var(--gold);border:2px solid var(--gold-d);border-radius:10px;padding:4px 6px;font-variant-numeric:tabular-nums}
.betin input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.betin button{min-width:0;padding:6px 2px;font-size:.74rem;white-space:nowrap;overflow:hidden}
.preview{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;background:var(--bg);border:1px solid var(--stock-d);border-radius:10px;padding:10px 12px;font-size:.85rem;color:var(--muted)}
.preview b{font-family:var(--display);font-weight:400;font-size:1.6rem;color:var(--stock);font-variant-numeric:tabular-nums}
.tile .pay{max-width:96%;overflow:hidden;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:var(--display);font-size:clamp(.5rem,1.6vw,.85rem);color:var(--ink);background:var(--fg);border-radius:5px;padding:1px 4px;line-height:1.25;z-index:2;white-space:nowrap}
.bigpay{display:flex;justify-content:space-between;align-items:center;gap:8px;border:2px solid var(--stock);border-radius:12px;padding:10px 14px}
.bigpay span{font-size:.85rem;color:var(--fg);display:flex;align-items:center;gap:6px;font-weight:700}
.bigpay b{font-family:var(--display);font-weight:400;font-size:2rem;color:var(--stock);font-variant-numeric:tabular-nums}
.cbtn{width:44px;height:44px;padding:0;border-color:transparent}
.cbtn[aria-pressed="true"]{border-color:var(--fg);box-shadow:0 0 0 3px var(--panel),0 0 0 5px var(--fg)}
.big{font-family:var(--display);font-weight:400;font-size:1.3rem;padding:14px;background:var(--gold);color:#2a1d00;border-color:var(--gold-d);box-shadow:0 4px 0 var(--gold-d)}
.big:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--gold-d)}
.safe{font-family:var(--display);font-weight:400;font-size:1.2rem;padding:14px;border-color:var(--c3);color:var(--c3)}
.rules{font-size:.8rem;color:var(--muted);line-height:1.7;margin:0;padding-left:1.2em}
.rules b{color:var(--fg)}

.stock{text-align:center;display:flex;flex-direction:column;gap:4px;border:2px dashed var(--stock-d);border-radius:12px;padding:12px 10px;background:rgba(79,214,232,.06)}
.stock small{font-size:.78rem;color:var(--stock);letter-spacing:.06em;font-weight:800}
.stock b{font-family:var(--display);font-weight:400;font-size:clamp(2.4rem,8vw,3.6rem);line-height:1;color:var(--stock);text-shadow:0 4px 0 var(--stock-d);font-variant-numeric:tabular-nums}
.stock span{font-size:.74rem;color:var(--muted);line-height:1.5}
.stock span em{font-style:normal;color:var(--gold);font-weight:800}
.stock span u{text-decoration:none;color:var(--out-fg);font-weight:800}
.stat.pend b{color:var(--stock)}
.stock.bump b{animation:bump .45s ease-out}
@keyframes bump{0%{transform:scale(1.4)}100%{transform:scale(1)}}
.row{display:flex;justify-content:space-between;align-items:baseline;font-size:.84rem;color:var(--muted)}
.row b{color:var(--fg);font-variant-numeric:tabular-nums}
.check{border:2px solid var(--gold);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px;background:#2a2312}
.check h3{margin:0;font-family:var(--display);font-weight:400;font-size:1.25rem;color:var(--gold)}
.check p{margin:0;font-size:.85rem;color:var(--muted);line-height:1.6}
.check p b{color:var(--fg)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.last{font-size:.8rem;line-height:1.55;border-top:1px dashed var(--line);padding-top:10px;color:var(--muted);min-height:2.6em}
.last b{color:var(--fg)}.last .hit{color:var(--gold)}.last .bad{color:var(--c0)}.last .ok{color:var(--c3)}
.foot{display:flex;justify-content:flex-end;flex-wrap:wrap}.foot button{white-space:nowrap}
.foot button{padding:4px 10px;font-size:.76rem}

.overlay{position:fixed;inset:0;background:rgba(10,8,16,.84);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.overlay.solid{background:radial-gradient(circle at 50% 30%,#3a2a10,#14121c 70%)}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;max-width:480px;width:100%;display:flex;flex-direction:column;gap:14px}
.modal h2{font-family:var(--display);font-weight:400;margin:0;font-size:1.5rem}
.modal p{margin:0;color:var(--muted);font-size:.9rem;line-height:1.7}
.modal p b{color:var(--fg)}
@media (prefers-reduced-motion:reduce){.banner.show,.koma.hop,.tile.land,.tile.tease,.stock.bump b{animation-duration:.01s}}

[hidden]{display:none!important}
*{box-sizing:border-box}
body{margin:0}
.page,.side,.status{min-width:0}

/* 3列:左プレイヤー、中央盤、右操作 */
.main3{display:grid;grid-template-columns:230px minmax(0,1fr) 320px;gap:14px;align-items:start}
@media (max-width:1100px){.main3{grid-template-columns:minmax(0,1fr) 320px}.players{grid-column:1/-1}}
@media (max-width:760px){.main3{grid-template-columns:1fr}}
.players{display:flex;flex-direction:column;gap:8px;min-width:0}
@media (max-width:1100px){.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}}
.pcard{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;position:relative;min-width:0}
.pcard.me{box-shadow:0 0 0 2px var(--fg)}
.pcard.dead{opacity:.45}
.pcard .top{display:flex;align-items:center;gap:8px;min-width:0}
.pcard .top b{font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.pcard .col{width:22px;height:22px;border-radius:6px;border:2px solid var(--fg);flex:none;background:var(--line)}
.pcard .st{margin-left:auto;font-size:.64rem;font-weight:800;padding:2px 7px;border-radius:99px;white-space:nowrap;background:var(--line)}
.st.active{background:var(--gold);color:#2a1d00}.st.cashed{background:var(--c3);color:var(--ink)}.st.out{background:var(--out);color:var(--out-fg)}.st.dead{background:#000;color:var(--c0)}.st.ready{background:var(--c3);color:var(--ink)}
.pcard .nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.pcard .nums div{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.pcard .nums small{font-size:.6rem;color:var(--muted)}
.pcard .nums b{font-family:var(--display);font-weight:400;font-size:1.05rem;font-variant-numeric:tabular-nums}
.pcard .nums .m{color:var(--gold)}.pcard .nums .s{color:var(--stock)}
.pcard .ch{display:flex;flex-direction:column;gap:3px;min-height:4px}
.pcard .ch .chn{display:flex;align-items:center;gap:4px;background:var(--bg);border-radius:6px;padding:2px 6px 2px 2px;max-width:100%}
.pcard .ch .chn svg{width:20px;height:20px;border-radius:4px;display:block;flex:none}
.pcard .ch .chn em{font-style:normal;font-size:.66rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .ch .none{font-size:.64rem;color:var(--muted)}
.pcard .pops{position:absolute;right:10px;top:34px;pointer-events:none}
.pop{position:absolute;right:8px;top:30px;z-index:3;font-family:var(--display);font-size:1.1rem;white-space:nowrap;padding:1px 9px;border-radius:8px;background:#0e0c14;border:2px solid currentColor;text-shadow:0 1px 0 #000;animation:popup 2.6s ease-out forwards}
.pop.s{color:var(--stock)}.pop.c{color:var(--c3)}
@keyframes popup{0%{transform:scale(.4);opacity:0}12%{transform:scale(1.15);opacity:1}22%{transform:scale(1)}85%{opacity:1}100%{opacity:0}}
.toasts{position:absolute;left:50%;top:12px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;z-index:7;pointer-events:none;width:90%}
.toast{background:rgba(20,18,28,.92);border:2px solid var(--stock);border-radius:99px;padding:5px 14px;font-weight:800;font-size:.85rem;animation:toast 2.8s ease-out forwards;max-width:100%;text-align:center}
.toast.c{border-color:var(--c3)}.toast.b{border-color:var(--gold)}
@keyframes toast{0%{transform:translateY(-10px);opacity:0}10%{transform:none;opacity:1}85%{opacity:1}100%{opacity:0}}
.rtrack{display:flex;gap:4px;align-items:center}
.rtrack i{width:18px;height:18px;border-radius:5px;border:2px solid var(--line);font-style:normal;font-size:.6rem;display:flex;align-items:center;justify-content:center;color:var(--muted);font-weight:800}
.rtrack i.done{background:var(--gold-d);border-color:var(--gold-d);color:var(--ink)}
.rtrack i.now{background:var(--gold);border-color:var(--gold);color:#2a1d00;transform:scale(1.15)}
.rtrack .shop{font-size:.62rem;color:var(--gold);font-weight:800;padding:0 1px}
.me-tag.carry{background:linear-gradient(135deg,#b8891a,#f7c948)!important;color:#2a1d00!important;border-color:#fff3c4!important;font-family:var(--display);font-weight:400}
.rtrack i.dl{background:var(--pc);border-color:rgba(0,0,0,.45);color:rgba(20,18,28,.92);opacity:.34;font-family:var(--display);font-weight:400}
.rtrack i.dl.done{opacity:.6}
.rtrack i.dl.now{opacity:1;border-color:#fff;box-shadow:0 0 0 2px var(--gold),0 0 12px var(--pc);transform:scale(1.2)}
.mych{display:flex;flex-direction:column;gap:6px}
.mych div{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;align-items:center;font-size:.74rem;color:var(--muted);line-height:1.4}
.mych svg{width:28px;height:28px;border-radius:6px;display:block}
.mych b{color:var(--fg);font-size:.8rem;display:block}
.pcard .me-tag{font-size:.6rem;color:var(--muted)}
.pcard.fire{animation:pfire .6s ease-out}
@keyframes pfire{30%{transform:translateY(-4px);box-shadow:0 0 0 3px var(--gold),0 0 20px var(--gold)}}

.topbar{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 16px}
.topbar .stat b{font-size:1.3rem}
.timer{flex:1;min-width:160px;display:flex;flex-direction:column;gap:4px}
.timer .row{font-size:.76rem}
.tbar{height:10px;border-radius:5px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.tbar i{display:block;height:100%;background:var(--gold);width:0}
.tbar.hurry i{background:var(--c0)}

.boardwrap{position:relative;padding:8px;border-radius:18px;background:var(--panel);border:2px solid var(--line);width:100%;max-width:640px;margin:0 auto}
.boardwrap .board{max-width:none}
.boardwrap>.banner{z-index:6;font-size:clamp(1.7rem,7vw,3.4rem)}
.stage{container-type:size;gap:4cqh;padding:4px}
.wheel{width:auto;height:min(64cqh,82cqw);max-width:100%}
.hint{font-size:clamp(.58rem,3.6cqw,.82rem);max-width:90%}
.cp i{width:clamp(9px,4cqw,20px)}
.tile.start-mark{outline:2px dashed var(--fg);outline-offset:-4px}
.tile .who{position:absolute;bottom:1px;left:3px;font-size:clamp(.4rem,1.1vw,.6rem);color:var(--ink);font-weight:800}

.side h2{display:flex;justify-content:space-between;align-items:baseline}

.cbtn{position:relative}
.cbtn .tk{position:absolute;inset:auto -4px -6px auto;background:var(--fg);color:var(--ink);font-size:.6rem;font-weight:800;border-radius:6px;padding:0 4px;max-width:40px;overflow:hidden;white-space:nowrap}
.watch{border:2px dashed var(--line);border-radius:12px;padding:14px;text-align:center;color:var(--muted);font-size:.88rem;line-height:1.6}
.watch b{display:block;font-family:var(--display);font-weight:400;font-size:1.3rem;color:var(--fg)}
.lockd{font-size:.8rem;color:var(--c3);text-align:center;font-weight:800}
.coin{position:fixed;top:-40px;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff7d1,var(--gold) 45%,var(--gold-d));border:2px solid #7a5a0e;pointer-events:none;z-index:16;animation:fall linear forwards}

/* ショップ(右枠内) */
.offers{display:flex;flex-direction:column;gap:8px}
.offer{border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:8px 10px;align-items:center;background:var(--bg)}
.offer svg{width:44px;height:44px;border-radius:9px;display:block}
.offer b{font-size:.88rem;display:block}
.offer small{font-size:.72rem;color:var(--muted);line-height:1.45;display:block}
.offer button{font-family:var(--display);font-weight:400;padding:6px 10px}
.offer.sold{opacity:.35}
.kw{font-size:.6rem;padding:1px 6px;border-radius:99px;background:var(--line);color:var(--fg);font-weight:700;white-space:nowrap;margin-right:3px}
.syn{font-size:.62rem;background:var(--gold);color:#2a1d00;font-weight:800;padding:1px 6px;border-radius:99px}

/* ロビー */
.lobby{max-width:520px}
.lobby input[type=text]{font:inherit;font-size:1rem;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--fg);width:100%}
.lobby .code{font-family:var(--display);font-size:2.4rem;letter-spacing:.2em;color:var(--gold);text-align:center}
.lobby .plist{display:flex;flex-direction:column;gap:6px}
.lobby .plist div{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:4px 0;font-size:.9rem}
.lobby .err{color:var(--c0);font-size:.85rem;min-height:1.2em}
.lobby .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lobby .or{text-align:center;color:var(--muted);font-size:.8rem}
.rank{display:flex;flex-direction:column;gap:6px}
.rank div{display:flex;justify-content:space-between;font-size:.95rem;border-bottom:1px dashed var(--line);padding:6px 0}
.rank div:first-child{color:var(--gold);font-family:var(--display);font-size:1.15rem}

.fxcanvas{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:18}
.boardwrap{padding:13px!important}
.bulbs{position:absolute;inset:4px;pointer-events:none;z-index:4}
.bulbs i{position:absolute;width:8px;height:8px;margin:-4px;border-radius:50%;background:#3a3448}
.bulbs i.on{background:#fff3c4;box-shadow:0 0 6px #f7c948,0 0 12px #f7c948}
.bulbs i.on.b-win{background:#fff;box-shadow:0 0 8px #fff,0 0 16px #f7c948}
.bulbs i.on.b-out{background:#ff8a92;box-shadow:0 0 8px #ec4e5a,0 0 14px #ec4e5a}
.bulbs i.on.b-check{background:#b8ffd6;box-shadow:0 0 8px #3fbf7f,0 0 14px #3fbf7f}
.bulbs i.on.b-safe{background:#fff;box-shadow:0 0 8px #fff}
.rayclip{position:absolute;inset:0;overflow:hidden;border-radius:16px;pointer-events:none;z-index:5}
.rays{position:absolute;left:50%;top:50%;width:160%;aspect-ratio:1;translate:-50% -50%;opacity:0;
  background:repeating-conic-gradient(from 0deg,rgba(255,243,196,.45) 0 7deg,transparent 7deg 18deg);
  -webkit-mask-image:radial-gradient(circle,#000 15%,transparent 62%);mask-image:radial-gradient(circle,#000 15%,transparent 62%)}
.rays.on{animation:rays 2s ease-out}
@keyframes rays{0%{opacity:0;transform:rotate(0) scale(.5)}15%{opacity:1}100%{opacity:0;transform:rotate(70deg) scale(1.15)}}
.boardwrap.focus .tile:not(.peek){filter:brightness(.55)}
.boardwrap.focus .stage{box-shadow:inset 0 0 60px rgba(0,0,0,.8)}
.wheel{transition:transform .25s}
.flashw{position:fixed;inset:0;background:rgba(255,255,255,.6);pointer-events:none;z-index:17;animation:flw .6s ease-out forwards}
@keyframes flw{from{opacity:1}to{opacity:0}}
.crack{position:fixed;inset:0;pointer-events:none;z-index:17;animation:crk 1.7s ease-out forwards}
@keyframes crk{0%{opacity:0}8%{opacity:1}70%{opacity:1}100%{opacity:0}}
.page.shake2{animation:shake2 .7s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake2{10%,90%{transform:translate(-3px,2px)}20%,80%{transform:translate(8px,-4px)}30%,50%,70%{transform:translate(-14px,6px) rotate(-.5deg)}40%,60%{transform:translate(14px,-6px) rotate(.5deg)}}
.banner.tier2{color:#fff3c4!important;text-shadow:0 5px 0 #b8891a,0 0 26px #f7c948}
.banner.tier3,.banner.tier4,.banner.rainbow{color:transparent!important;text-shadow:none;
  background:linear-gradient(90deg,#ff6b78,#ffd84d,#5fe09a,#5aa7ff,#c08bff,#ff6b78);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;
  -webkit-text-stroke:2px #fff;filter:drop-shadow(0 5px 0 #000) drop-shadow(0 0 18px rgba(247,201,72,.8))}
.banner.show.tier3,.banner.show.tier4,.banner.show.rainbow{animation:stamp var(--dur,.6s) cubic-bezier(.2,1.4,.4,1) forwards,rbmove .7s linear infinite}
.banner.tier4{font-size:clamp(2rem,8vw,4.6rem)!important}
.banner.hot{color:#ffb347!important;text-shadow:0 5px 0 #7a2a10,0 0 20px #ff6b3d}
@keyframes rbmove{to{background-position:200% 0}}
#tOdds.bump{animation:bump .5s ease-out;display:inline-block}
.counting{color:#fff!important;text-shadow:0 0 12px var(--gold)}
.stock.t1{border-style:solid;border-color:var(--gold-d)}
.stock.t2{border-style:solid;border-color:var(--gold);background:radial-gradient(circle at 50% 0%,rgba(247,201,72,.25),transparent 70%)}
.stock.t2 b{color:#fff3c4;text-shadow:0 4px 0 var(--gold-d),0 0 18px rgba(247,201,72,.7)}
.stock.t3{border-style:solid;border-width:3px;border-color:var(--gold);background:radial-gradient(circle at 50% 0%,rgba(247,201,72,.45),rgba(169,112,255,.14) 70%);animation:glow 1s ease-in-out infinite alternate}
.stock.t3 b{color:#fff;text-shadow:0 4px 0 var(--gold-d),0 0 26px var(--gold),0 0 50px rgba(255,255,255,.6)}
@keyframes glow{from{box-shadow:0 0 10px rgba(247,201,72,.4)}to{box-shadow:0 0 34px rgba(247,201,72,.95)}}
.boardwrap.hot1{border-color:var(--gold-d);box-shadow:0 0 24px rgba(247,201,72,.3)}
.boardwrap.hot2{border-color:transparent;background:linear-gradient(var(--panel),var(--panel)) padding-box,linear-gradient(90deg,var(--gold),#fff3c4,var(--gold-d),var(--gold)) border-box;background-size:auto,300% 100%;animation:frame 2.2s linear infinite;box-shadow:0 0 40px rgba(247,201,72,.45)}

@keyframes frame{to{background-position:0 0,300% 0}}
@media (prefers-reduced-motion:reduce){.rays.on,.crack,.page.shake2,.boardwrap.hot2,.boardwrap.hot3,.stock.t3{animation:none}}

.leftcol{display:flex;flex-direction:column;gap:10px;min-width:0}
@media (max-width:1100px){.leftcol{grid-column:1/-1}}
.rrank{background:var(--panel);border:2px solid var(--gold-d);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:5px}

.rr{display:grid;grid-template-columns:20px minmax(0,4.5em) minmax(0,1fr) auto 2.8em;gap:6px;align-items:center;font-size:.78rem}
.rr .no{width:20px;height:20px;border-radius:50%;background:var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:.7rem}

.rr.me .nm{color:var(--gold)}
.mycoin{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#2e2410,#1f1c2b);border:2px solid var(--gold);border-radius:14px;padding:10px 14px;box-shadow:0 0 22px rgba(247,201,72,.25)}
.mycoin .cicn{width:40px;height:40px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 30%,#fff7d1,var(--gold) 45%,var(--gold-d));border:3px solid #7a5a0e;box-shadow:inset 0 0 0 3px rgba(255,255,255,.25)}
.mycoin div{display:flex;flex-direction:column;line-height:1;min-width:0;flex:1}
.mycoin small{font-size:.7rem;color:var(--gold);font-weight:800;letter-spacing:.06em}
.mycoin b{font-family:var(--display);font-weight:400;font-size:2.4rem;color:var(--gold);text-shadow:0 3px 0 var(--gold-d),0 0 18px rgba(247,201,72,.5);font-variant-numeric:tabular-nums}
.mycoin span{font-family:var(--display);font-size:.95rem}
.mycoin span.up{color:var(--c3)}.mycoin span.down{color:var(--c0)}
.gekibadge{text-align:center;font-family:var(--display);font-size:1rem;padding:8px;border-radius:12px;color:#fff;background:linear-gradient(90deg,#b8323d,#f7c948,#b8323d);background-size:200% 100%;animation:rbmove 1s linear infinite,glow 1s ease-in-out infinite alternate;text-shadow:0 2px 0 #000}
.gekibadge.lv3{background:linear-gradient(90deg,#ec4e5a,#f5c84c,#3fbf7f,#3e8ef7,#a970ff,#ec4e5a);background-size:200% 100%}
.cutin{position:fixed;inset:0;pointer-events:none;z-index:19;display:flex;align-items:center}
.cutin .band{width:100%;padding:18px 0;transform:skewY(-6deg);background:linear-gradient(90deg,#1d5fd6,#3e8ef7,#1d5fd6);box-shadow:0 0 40px rgba(62,142,247,.8);animation:band 1.4s cubic-bezier(.2,.9,.3,1) forwards;overflow:hidden}
.cutin .band span{display:block;text-align:center;font-family:var(--display);font-size:clamp(2.4rem,10vw,6rem);color:#fff;-webkit-text-stroke:3px #000;paint-order:stroke fill;text-shadow:6px 6px 0 rgba(0,0,0,.5);animation:slide 1.4s cubic-bezier(.2,.9,.3,1) forwards}

.cutin.lv3 .band{background:linear-gradient(90deg,#ec4e5a,#f5c84c,#3fbf7f,#3e8ef7,#a970ff,#ec4e5a);background-size:200% 100%;box-shadow:0 0 80px rgba(255,255,255,.9);animation:band 1.4s cubic-bezier(.2,.9,.3,1) forwards,rbmove .5s linear infinite}
@keyframes band{0%{transform:skewY(-6deg) scaleY(0)}12%{transform:skewY(-6deg) scaleY(1)}85%{transform:skewY(-6deg) scaleY(1);opacity:1}100%{transform:skewY(-6deg) scaleY(0);opacity:0}}

body.mega{background:radial-gradient(circle at 50% 0%,#3a2a10,var(--bg) 70%)}

/* ===== ボーナスごとの専用ビジュアル ===== */
.vrow{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-top:3px}
.vd{font-style:normal;min-width:20px;height:20px;padding:0 3px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:400;font-size:.72rem;border:2px solid rgba(255,255,255,.22);color:rgba(255,255,255,.3);background:rgba(0,0,0,.25)}
.vd.on{border-color:var(--mc);background:var(--mc);color:#14121c}
.vd.hot{border-color:#fff;background:var(--mc);color:#14121c;box-shadow:0 0 10px var(--mc)}
.vd.bad{border-color:#fff;background:#ec4e5a;color:#fff;box-shadow:0 0 8px #ec4e5a;text-decoration:line-through}
.vp{font-style:normal;min-width:18px;height:18px;padding:0 2px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;font-size:.62rem;border:2px dashed rgba(255,255,255,.22);color:rgba(255,255,255,.25);background:rgba(0,0,0,.25)}
.vp.on{border-style:solid;border-color:var(--mc);background:var(--mc);color:#14121c;box-shadow:0 0 8px var(--mc)}
.vq{font-style:normal;width:18px;height:18px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;font-size:.6rem;border:2px solid rgba(255,255,255,.18);filter:grayscale(1);opacity:.45}
.vq.on{filter:none;opacity:1;border-color:var(--mc);box-shadow:0 0 8px var(--mc)}
.vc{font-style:normal;width:18px;height:18px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;font-size:.55rem;font-weight:800;color:#14121c;border:1px solid rgba(0,0,0,.4)}
.vc.off{opacity:.22;filter:grayscale(.7)}
.vt{font-style:normal;font-size:.63rem;font-weight:800;color:#e8dcc0;white-space:nowrap}
.vt.dim{color:var(--muted);font-weight:600}
.vt.go{color:#8ff0bc}
.vbar{position:relative;flex:1;min-width:110px;height:15px;border-radius:8px;background:rgba(0,0,0,.4);overflow:hidden}
.vbar i{position:absolute;inset:0 auto 0 0;background:var(--mc);transition:width .3s}
.vbar em{position:relative;display:block;text-align:center;font-style:normal;font-size:.58rem;font-weight:800;line-height:15px;color:#fff;text-shadow:0 1px 0 #000}
.mfoot{display:flex;flex-direction:column;gap:1px;margin-top:5px}
.mtip{font-style:normal;font-size:.72rem;color:#fff3c4;font-weight:700;line-height:1.35}
.mtip b{font-family:var(--display);font-weight:400;font-size:.95rem;color:var(--gold)!important;padding:0!important}
.mtip.on{color:#fff}
.equp.carry{background:linear-gradient(135deg,#b8891a,#f7c948)!important;color:#2a1d00!important;border-color:#fff3c4!important;font-family:var(--display);font-weight:400}
.mlvn{font-style:normal;font-size:.62rem;color:var(--muted)}
.mcard.hot{box-shadow:0 0 0 2px var(--mc),0 0 18px var(--mc);animation:chipnear .7s ease-in-out infinite}
.mcard.pick .vrow.win{display:none}
.mcard .vbar{flex:1 1 100%;min-width:140px;height:17px}
.mcard .vbar em{font-size:.62rem;line-height:17px}
/* 他プレイヤーの枠に出すボーナス表示(高さは1行で固定。盤のサイズがガクつかないように) */
.mbadge{display:grid;grid-template-columns:18px 66px minmax(0,1fr);gap:4px;align-items:center;width:100%;height:22px;
  border:1px solid var(--mc);border-left:3px solid var(--mc);border-radius:6px;padding:0 4px;background:rgba(0,0,0,.28);text-align:left;overflow:hidden}
.mbadge .be{font-style:normal;width:18px;height:18px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:.68rem;background:var(--mc);color:#14121c}
.mbadge .bn{font-family:var(--display);font-weight:400;font-size:.6rem;line-height:20px;height:20px;color:#fff;white-space:nowrap;display:flex;align-items:center;gap:2px;min-width:0;overflow:hidden}
.mbadge .bn u{text-decoration:none;font-size:.5rem;background:rgba(255,255,255,.2);border-radius:3px;padding:0 2px}
.mbadge .bv{height:20px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;min-width:0}
.mbadge .bv .vrow{flex:none;height:20px;line-height:20px;margin-top:0;gap:3px;flex-wrap:nowrap;min-width:0;align-items:center}

.mbadge .vp,.mbadge .vq,.mbadge .vc{flex:0 1 auto;min-width:8px;width:13px;height:13px;padding:0;font-size:.46rem;line-height:1;border-width:1px}
.mbadge .vt{font-size:.54rem;overflow:hidden;text-overflow:ellipsis;min-width:0}
.mbadge .vbar{height:11px;min-width:50px}
.mbadge .vbar em{font-size:.48rem;line-height:11px}
.mbadge.hot{background:rgba(255,255,255,.08);box-shadow:0 0 0 1px var(--mc),0 0 12px var(--mc);animation:chipnear .7s ease-in-out infinite}

/* ===== レイアウト:プレイヤーは上に横並び、盤は画面の高さに合わせ、操作パネルは常に見える ===== */
.main3{grid-template-columns:minmax(0,1fr) 340px!important;gap:12px!important}
.leftcol{grid-column:1/-1!important}
.players{display:grid!important;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))!important;gap:8px!important}

  .actions{position:fixed;left:0;right:0;bottom:0;z-index:12;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:rgba(20,18,28,.96);border-top:2px solid var(--gold-d);box-shadow:0 -8px 24px rgba(0,0,0,.5);border-radius:0;margin:0}
  .check.actions{border-left:0;border-right:0;border-bottom:0}
  body{padding-bottom:150px!important}
  /* スマホは幅がないので、ふだんは名前だけ。チャンスのときだけ中身を開く */
  .mbadge{grid-template-columns:15px 46px minmax(0,1fr);height:20px;gap:3px;padding:0 3px}

}

.dcount.nums small{color:var(--muted);margin-right:2px}
.dcount b.dn{font-family:var(--display);font-weight:400;background:#fff;color:#14121c;border-radius:4px;padding:0 5px;font-size:.7rem}
.dnums{display:flex;gap:3px;flex-wrap:wrap}
.dnums i{position:relative;width:22px;height:22px;border-radius:5px;border:2px dashed rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;font-style:normal;font-family:var(--display);font-size:.8rem;color:rgba(255,255,255,.3)}
.dnums i.on{background:#fff;color:#14121c;border:2px solid var(--mc);box-shadow:0 0 8px var(--mc)}

  .players{grid-template-columns:1fr!important;gap:6px!important}

}
.page{max-width:1560px!important}

.tile .startlbl{position:absolute;left:50%;bottom:2px;transform:translateX(-50%);font-family:var(--display);font-size:clamp(.38rem,1.05vw,.6rem);color:#14121c;background:#fff;border-radius:4px;padding:0 3px;line-height:1.3;z-index:2;white-space:nowrap;box-shadow:0 0 0 2px var(--gold)}

.dcount>small{color:var(--muted);font-size:.66rem;min-width:2.2em}

.tile.hidden{background:#2a2633!important;color:#55506a;font-family:var(--display);font-size:clamp(.6rem,1.8vw,1rem);opacity:1!important;box-shadow:inset 0 0 0 1px #3a3448}

/* ===== 画面がガクつかないレイアウト:ページ全体を画面の高さに固定し、各列の中だけをスクロールさせる ===== */
html{scrollbar-gutter:stable;overflow-x:hidden}
/* 盤の中の演出(拡大する文字など)が盤の外にはみ出して、ページの大きさを変えないようにする */
.boardwrap{overflow:hidden!important;contain:paint}
.overlay,.modal{overscroll-behavior:contain}

  html,body{height:100%}

  .topbar{flex:none}
  .main3{flex:1 1 auto;min-height:0;align-items:stretch!important;grid-template-rows:auto minmax(0,1fr)}

/* ===== 賭け×オッズの枠:もらえる枚数が大きいほど豪華に ===== */
.eq{position:relative;overflow:visible;transition:box-shadow .3s}
.eqtag{position:absolute;top:-11px;left:50%;transform:translateX(-50%);font-family:var(--display);font-size:.72rem;padding:1px 12px;border-radius:99px;white-space:nowrap;z-index:2;color:#14121c;background:var(--gold);box-shadow:0 0 10px var(--gold)}
.eq.eqt1{border-color:var(--gold)!important;box-shadow:0 0 18px rgba(247,201,72,.45)!important;background:radial-gradient(circle at 50% 0%,rgba(247,201,72,.18),var(--bg) 70%)}
.eq.eqt1 .eqn.res{color:#fff3c4!important;text-shadow:0 3px 0 var(--gold-d),0 0 16px rgba(247,201,72,.7)!important}
.eq.eqt2{border-color:transparent!important;background:linear-gradient(#2a2010,#1a1408) padding-box,linear-gradient(90deg,#f7c948,#fff3c4,#b8891a,#f7c948) border-box!important;background-size:auto,300% 100%!important;animation:frame 1.8s linear infinite;box-shadow:0 0 30px rgba(247,201,72,.6)!important}
.eq.eqt2 .eqn.res{color:#fff!important;text-shadow:0 3px 0 var(--gold-d),0 0 22px #f7c948,0 0 40px rgba(255,243,196,.6)!important}
.eq.eqt2 .eqtag{background:linear-gradient(90deg,#ec4e5a,#f7c948);color:#fff;text-shadow:0 1px 0 #000}
.eq.eqt3,.eq.eqt4{border-color:transparent!important;border-width:4px!important;background:radial-gradient(circle at 50% 0%,rgba(255,243,196,.25),#1c1408 70%) padding-box,linear-gradient(90deg,#ec4e5a,#f5c84c,#3fbf7f,#3e8ef7,#a970ff,#ec4e5a) border-box!important;background-size:auto,300% 100%!important;animation:frame 1s linear infinite,eqglow .9s ease-in-out infinite alternate;box-shadow:0 0 40px rgba(247,201,72,.75),0 0 80px rgba(169,112,255,.35)!important}
.eq.eqt3 .eqn.res,.eq.eqt4 .eqn.res{color:transparent!important;background:linear-gradient(90deg,#ff6b78,#ffd84d,#5fe09a,#5aa7ff,#c08bff,#ff6b78);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-stroke:1px #fff;filter:drop-shadow(0 3px 0 #000) drop-shadow(0 0 12px rgba(255,243,196,.8));animation:rbmove .8s linear infinite;text-shadow:none!important}
.eq.eqt3 .eqtag,.eq.eqt4 .eqtag{background:linear-gradient(90deg,#ec4e5a,#f5c84c,#3fbf7f,#3e8ef7,#a970ff);background-size:200% 100%;animation:rbmove .8s linear infinite;color:#fff;text-shadow:0 1px 0 #000}
.eq.eqt4{border-width:5px!important;animation:frame .6s linear infinite,eqglow .5s ease-in-out infinite alternate}
.eq.eqt4 .eqtag{font-size:.9rem}
@keyframes eqglow{from{transform:scale(1)}to{transform:scale(1.02)}}
.eqn.odup{animation:oddspop .8s ease-out}
@keyframes oddspop{0%,40%{color:#fff3c4;text-shadow:0 0 6px #fff,0 0 18px #f7c948,0 0 30px #f7c948}100%{}}

.oddsfloat{position:absolute;left:50%;top:6px;transform:translateX(-50%);font-family:var(--display);font-size:1.3rem;color:#fff3c4;text-shadow:0 2px 0 #000,0 0 12px #f7c948;pointer-events:none;animation:ofloat 1.3s ease-out forwards;white-space:nowrap}
@keyframes ofloat{0%{opacity:0;transform:translate(-50%,10px) scale(.5)}20%{opacity:1;transform:translate(-50%,-6px) scale(1.2)}100%{opacity:0;transform:translate(-50%,-40px) scale(1)}}
.eq.flash{animation:eqflash .6s ease-out}
@keyframes eqflash{0%{box-shadow:0 0 0 0 #fff}30%{box-shadow:0 0 0 6px rgba(255,255,255,.8),0 0 40px #fff}100%{}}
.eq.lvup{animation:eqlvup .8s cubic-bezier(.2,1.4,.4,1)}
@keyframes eqlvup{0%{transform:scale(1)}30%{transform:scale(1.08)}100%{transform:scale(1)}}
html.low .eq{animation:none!important}
html.low .eq .eqn.res{animation:none!important}

/* ===== 枠の中の「決定!」スタンプ ===== */
.pcard{overflow:hidden}
.stamp{position:absolute;right:10px;top:8px;z-index:4;font-family:var(--display);font-size:1.3rem;color:#ec4e5a;border:3px solid #ec4e5a;border-radius:8px;padding:0 8px;transform:rotate(-12deg);background:rgba(14,12,20,.85);animation:stamp2 1.4s ease-out forwards}
@keyframes stamp2{0%{transform:rotate(-12deg) scale(2.2);opacity:0}15%{transform:rotate(-12deg) scale(1);opacity:1}80%{opacity:1}100%{opacity:0}}
/* 盤面が決まる:マスが順番にめくれる */
.tile.reveal{animation:reveal .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes reveal{0%{transform:rotateY(90deg) scale(.6);filter:brightness(2)}100%{transform:none;filter:none}}
/* 期待値が上がった:枠の中で脈打つ(消えない)+ 広がる輪 */
.eqn.odup{animation:oddspop .5s cubic-bezier(.2,1.6,.4,1)!important}
@keyframes oddspop{0%{transform:scale(1)}35%{transform:scale(1.35);color:#fff;text-shadow:0 0 8px #fff,0 0 22px #f7c948,0 0 40px #f7c948}100%{transform:scale(1)}}
.ring{position:fixed;pointer-events:none;z-index:17;border:4px solid #fff3c4;border-radius:18px;box-shadow:0 0 24px #f7c948,inset 0 0 24px rgba(247,201,72,.5);animation:ringx .7s ease-out forwards}
@keyframes ringx{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.35)}}
/* 残り5秒 */
.side.hurry{box-shadow:0 0 0 3px #ec4e5a,0 0 30px rgba(236,78,90,.6);animation:hurry .5s ease-in-out infinite alternate}
@keyframes hurry{from{box-shadow:0 0 0 3px #ec4e5a,0 0 14px rgba(236,78,90,.4)}to{box-shadow:0 0 0 4px #ff8a92,0 0 40px rgba(236,78,90,.9)}}
.side.hurry [data-left]{color:#ff8a92!important;font-weight:800;font-size:1rem!important}
/* ラウンド結果 */
.rsum{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);z-index:19;min-width:280px;max-width:90vw;padding:14px 20px;border-radius:16px;background:rgba(14,12,20,.95);border:3px solid var(--gold);box-shadow:0 0 40px rgba(247,201,72,.5);pointer-events:none;animation:rsum 3s ease-out forwards}
.rsum small{display:block;font-family:var(--display);color:var(--gold);letter-spacing:.1em;margin-bottom:6px;text-align:center}
.rsum div{display:flex;align-items:center;gap:8px;font-size:.95rem;padding:3px 0;opacity:0;animation:rrow .4s cubic-bezier(.2,1.4,.4,1) forwards}
.rsum div b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rsum div em{font-style:normal;font-family:var(--display);font-size:1.25rem;color:var(--muted)}
.rsum div.up em{color:var(--c3)}.rsum div.dn em{color:#ff8a92}.rsum div.me b{color:var(--gold)}
.rsum div u{text-decoration:none;font-size:.62rem;background:var(--out);color:var(--out-fg);border-radius:4px;padding:0 5px}
@keyframes rsum{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}10%{opacity:1;transform:translate(-50%,-50%) scale(1)}88%{opacity:1}100%{opacity:0}}
@keyframes rrow{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
/* 結果発表 */
.rrow{display:flex;justify-content:space-between;font-size:1rem;border-bottom:1px dashed var(--line);padding:8px 0;animation:rrow .5s cubic-bezier(.2,1.4,.4,1)}
.rrow.win{font-family:var(--display);font-size:1.4rem;color:var(--gold);text-shadow:0 0 14px rgba(247,201,72,.7);border-bottom:2px solid var(--gold)}
.rrow .rend{display:flex;flex-direction:column;align-items:flex-end;gap:1px}
.rrow .rend small{font-size:.6rem;color:var(--muted);text-shadow:none;font-family:var(--body)}
.rrow.win .rend small{color:#e7cf8a}
/* ===== タイトル画面 ===== */
.title{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;background:radial-gradient(circle at 50% 30%,#3a2a10,#14121c 70%);overflow:hidden;cursor:pointer;transition:opacity .6s,transform .6s}
.title.out{opacity:0;transform:scale(1.15);pointer-events:none}
.tlogo{display:flex;flex-wrap:wrap;justify-content:center;gap:0 .02em;font-family:var(--display);font-size:clamp(2.2rem,9vw,6rem);line-height:1.1;text-align:center;padding:0 10px}
.tlogo span{display:inline-block;color:transparent;background:linear-gradient(180deg,#fff7d1,#f7c948 45%,#b8891a);-webkit-background-clip:text;background-clip:text;-webkit-text-stroke:2px #5a3d00;filter:drop-shadow(0 6px 0 #3a2508) drop-shadow(0 0 18px rgba(247,201,72,.6));animation:tb 1.6s ease-in-out infinite;animation-delay:calc(var(--i) * -.12s)}
.tlogo span:nth-child(n+5){background-image:linear-gradient(180deg,#eafff2,#3fbf7f 45%,#1a6b42);-webkit-text-stroke:2px #0d3321}
.tlogo span:last-child{}
@keyframes tb{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-14px) rotate(2deg)}}
.tsub{margin:0;color:#fff3c4;font-weight:800;font-size:clamp(.85rem,2.4vw,1.1rem);text-align:center;text-shadow:0 2px 0 #000;max-width:30em}
.tstart{font-family:var(--display);font-weight:400;font-size:clamp(1.2rem,4vw,1.8rem);padding:16px 40px;border-radius:99px;background:var(--gold);color:#2a1d00;border:3px solid #fff3c4;box-shadow:0 6px 0 var(--gold-d),0 0 30px rgba(247,201,72,.7);animation:blink 1.1s ease-in-out infinite;cursor:pointer}
@keyframes blink{0%,100%{transform:scale(1)}50%{transform:scale(1.06);box-shadow:0 6px 0 var(--gold-d),0 0 50px rgba(247,201,72,1)}}
.tbulbs{position:absolute;inset:14px;border-radius:24px;pointer-events:none}
.tbulbs i{position:absolute;width:10px;height:10px;border-radius:50%;background:#3a3448;animation:tbl 1s steps(1) infinite;animation-delay:calc(var(--k) * -.0667s)}
.tbulbs i:nth-child(-n+15){top:0;left:calc(var(--k) / 15 * 100%)}
.tbulbs i:nth-child(n+16):nth-child(-n+30){right:0;top:calc((var(--k) - 15) / 15 * 100%)}
.tbulbs i:nth-child(n+31):nth-child(-n+45){bottom:0;right:calc((var(--k) - 30) / 15 * 100%)}
.tbulbs i:nth-child(n+46){left:0;bottom:calc((var(--k) - 45) / 15 * 100%)}
@keyframes tbl{0%,30%{background:#fff3c4;box-shadow:0 0 8px #f7c948,0 0 16px #f7c948}31%,100%{background:#3a3448;box-shadow:none}}
.tcoins{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tcoins i{position:absolute;top:-40px;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff7d1,var(--gold) 45%,var(--gold-d));border:2px solid #7a5a0e;opacity:.7;animation:fall linear infinite}
html.low .tlogo span,html.low .tstart,html.low .tbulbs i,html.low .tcoins i{animation:none}
.rolling{color:#fff!important;text-shadow:0 0 8px #fff,0 0 20px #f7c948!important}

/* ===== 結果発表 ===== */
.modal.win{border:3px solid transparent;background:linear-gradient(#1f1c2b,#1f1c2b) padding-box,linear-gradient(90deg,#ec4e5a,#f5c84c,#3fbf7f,#3e8ef7,#a970ff,#ec4e5a) border-box;background-size:auto,300% 100%;animation:frame 1.4s linear infinite;box-shadow:0 0 60px rgba(247,201,72,.6)}
#endTitle{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
#endTitle .wcrown{font-size:3rem;animation:yk .6s ease-in-out infinite alternate}
#endTitle small{font-family:var(--display);font-size:1rem;letter-spacing:.3em;color:var(--gold)}
#endTitle em{font-style:normal;font-family:var(--display);font-size:2.4rem;color:transparent;background:linear-gradient(90deg,#ff6b78,#ffd84d,#5fe09a,#5aa7ff,#c08bff,#ff6b78);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-stroke:1px #fff;filter:drop-shadow(0 3px 0 #000) drop-shadow(0 0 14px rgba(247,201,72,.8));animation:rbmove .8s linear infinite;overflow-wrap:anywhere}
/* ===== 利確チャンスの枠が脈打つ ===== */
.check{animation:checkpulse .7s ease-in-out infinite alternate}
@keyframes checkpulse{from{box-shadow:0 0 0 0 rgba(247,201,72,.4)}to{box-shadow:0 0 0 4px rgba(247,201,72,.9),0 0 30px rgba(247,201,72,.6)}}
.check .safe{animation:safeglow .7s ease-in-out infinite alternate}
@keyframes safeglow{from{box-shadow:0 0 0 0 rgba(63,191,127,.3)}to{box-shadow:0 0 18px rgba(63,191,127,.9)}}
/* ===== あと少しで達成:ボーナス条件・20回ボーナス ===== */
.mcard.near{box-shadow:0 0 0 2px #fff,0 0 22px var(--mc)!important;animation:nearpulse .6s ease-in-out infinite alternate}
.mcard.near .mx{background:#fff;color:#14121c}
.mcard.near .mx::after{content:" あと少し!"}
@keyframes nearpulse{from{transform:scale(1)}to{transform:scale(1.02)}}
.bonus20.near{animation:shine 2.6s linear infinite,nearglow .5s ease-in-out infinite alternate}
@keyframes nearglow{from{box-shadow:0 0 22px rgba(247,201,72,.45)}to{box-shadow:0 0 0 4px #fff3c4,0 0 50px rgba(247,201,72,.95)}}
.bonus20.near .bbar span::after{content:" もう少し!"}
html.low .check,html.low .check .safe,html.low .mcard.near,html.low .bonus20.near,html.low .modal.win,html.low #endTitle .wcrown{animation:none!important}
.mchip .mp{text-decoration:none;font-size:.56rem;background:var(--mc);color:#14121c;border-radius:4px;padding:0 4px;margin-left:3px;font-family:var(--display);font-weight:400}
.mchip .mp.ok{background:#fff;color:#14121c}
.pcard .ch{align-items:stretch}
html.low .mcard.hot,html.low .mbadge.hot,html.low .tile.mhot{animation:none!important}
/* ボーナスが狙っているマスの印 */
.tile.mtarget{box-shadow:inset 0 0 0 3px var(--mmc),0 0 10px var(--mmc)}
.tile.mtarget.mfar,.tile.mavoid.mfar{box-shadow:inset 0 0 0 2px var(--mmc);opacity:.95}
.tile.mavoid{box-shadow:inset 0 0 0 3px #ec4e5a,0 0 10px rgba(236,78,90,.75)}
.tile.mhot{animation:mtpulse .8s ease-in-out infinite}
@keyframes mtpulse{0%,100%{box-shadow:inset 0 0 0 3px var(--mmc),0 0 8px var(--mmc)}50%{box-shadow:inset 0 0 0 4px #fff,0 0 22px var(--mmc)}}
.tile .mmark{position:absolute;top:0;left:1px;font-style:normal;font-size:.62rem;line-height:1.1;z-index:3;pointer-events:none;filter:drop-shadow(0 1px 2px #000)}

/* 虹マス(角) */
.tile.rbtile{background:radial-gradient(circle at 50% 42%,#2a2340,#141120)!important;overflow:hidden;box-shadow:inset 0 0 0 2px rgba(255,255,255,.18),0 0 14px rgba(170,112,255,.55);animation:rbglow 1.9s ease-in-out infinite}
@keyframes rbglow{0%,100%{box-shadow:inset 0 0 0 2px rgba(255,255,255,.18),0 0 10px rgba(170,112,255,.45)}50%{box-shadow:inset 0 0 0 2px rgba(255,255,255,.35),0 0 22px rgba(95,224,154,.85)}}
.tile .rbmark{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:inherit}
.tile .rbmark::before{content:"";position:absolute;width:150%;aspect-ratio:1;border-radius:50%;background:conic-gradient(#ff6b78,#ffd84d,#5fe09a,#5aa7ff,#c08bff,#ff6b78);opacity:.92;animation:rbspin 3.6s linear infinite}
.tile .rbmark::after{content:"✦";position:relative;z-index:1;font-family:var(--display);font-size:clamp(.75rem,2.6vw,1.35rem);color:#fff;text-shadow:0 0 6px rgba(0,0,0,.65),0 0 12px rgba(255,255,255,.9);animation:rbstar 1.9s ease-in-out infinite}
@keyframes rbspin{to{transform:rotate(360deg)}}
@keyframes rbstar{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
html.low .tile.rbtile,html.low .tile .rbmark::before,html.low .tile .rbmark::after{animation:none}
.hist .hrow i.rb{background:linear-gradient(135deg,#ec4e5a,#f5c84c,#3fbf7f,#3e8ef7,#a970ff);color:#fff!important;font-size:.5rem!important}
/* スペシャルゾーン演出 */
.szone{position:absolute;inset:8px;z-index:8;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  background:radial-gradient(circle at 50% 40%,rgba(40,30,10,.96),rgba(14,12,20,.98));backdrop-filter:blur(2px);overflow:hidden;animation:szbg .5s ease-out both}
.szone.leave{animation:szbgout .5s ease-in both}
.szsel{position:fixed;z-index:13;border-radius:6px;box-shadow:0 0 0 4px #f7c948,0 0 16px 5px rgba(247,201,72,.85);pointer-events:none;transition:left .05s linear,top .05s linear,width .05s linear,height .05s linear}
.szsel.hit{box-shadow:0 0 0 5px #fff,0 0 28px 10px rgba(255,255,255,.95);animation:selhit .4s ease-out}
@keyframes selhit{0%{transform:scale(1)}50%{transform:scale(1.18)}100%{transform:scale(1)}}
html.low .szsel{transition:none}
.sztrans{position:fixed;z-index:14;perspective:500px;pointer-events:none}
.sztrans .szinner2{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.4,0,.3,1.2)}
.sztrans.flip .szinner2{transform:rotateY(180deg)}
.sztrans .szface{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border-radius:6px;backface-visibility:hidden;font-family:var(--display);font-weight:400}
.sztrans .szf-out{background:var(--out);color:#fff;font-size:clamp(.55rem,2vw,1rem)}
.sztrans .szf-sp{color:#fff;font-size:clamp(.9rem,3vw,1.6rem);transform:rotateY(180deg);overflow:hidden;background:radial-gradient(circle at 50% 42%,#2a2340,#141120);box-shadow:inset 0 0 0 2px rgba(255,255,255,.35),0 0 18px rgba(170,112,255,.8);text-shadow:0 0 8px rgba(255,255,255,.8)}
/* 本物のスペシャルマスと同じ、回る虹模様を乗せる(めくれた瞬間に黒く見えないように) */
.sztrans .szf-sp::before{content:"";position:absolute;width:150%;aspect-ratio:1;border-radius:50%;background:conic-gradient(#ff6b78,#ffd84d,#5fe09a,#5aa7ff,#c08bff,#ff6b78);opacity:.92;animation:rbspin 3.6s linear infinite}
.sztrans .szf-sp>span{position:relative;z-index:1}
html.low .sztrans .szf-sp::before{animation:none}
@keyframes szbg{from{opacity:0}to{opacity:1}}
@keyframes szbgout{from{opacity:1}to{opacity:0}}
.szone .szinner{display:flex;flex-direction:column;align-items:center;gap:4px;width:100%;animation:szrise .6s cubic-bezier(.18,.9,.3,1.25) both}
.szone.leave .szinner{animation:szfall .5s ease-in both}
@keyframes szrise{from{transform:translateY(80px) scale(.45);opacity:0}55%{opacity:1}to{transform:translateY(0) scale(1);opacity:1}}
@keyframes szfall{from{transform:translateY(0) scale(1);opacity:1}to{transform:translateY(90px) scale(.4);opacity:0}}
.szone .szres.rb i{color:#fff;font-size:clamp(1.3rem,5vw,2.4rem);text-shadow:0 2px 0 #000;background:linear-gradient(90deg,#ff6b78,#ffd84d,#5fe09a,#5aa7ff,#c08bff,#ff6b78);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;-webkit-text-stroke:1.5px #fff;animation:rbmove 1s linear infinite}
html.low .szone,html.low .szone.leave,html.low .szone .szinner,html.low .szone.leave .szinner{animation:none}
.stagepick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0}
.stagebtn{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:linear-gradient(135deg,#221c2e,#1a1724);color:var(--fg);cursor:pointer;text-align:left;transition:transform .08s,border-color .15s,box-shadow .15s}
.stagebtn:hover{transform:translateY(-2px);border-color:var(--gold)}
.stagebtn b{font-family:var(--display);font-weight:400;font-size:1.1rem}
.stagebtn small{color:var(--muted);font-size:.72rem}
.stagebtn.sp{border-color:#8a5cff;background:linear-gradient(135deg,#2a1c3e,#1f1830)}
.stagebtn.sp b{background:linear-gradient(90deg,#ff6b78,#ffd84d,#5fe09a,#5aa7ff,#c08bff);-webkit-background-clip:text;background-clip:text;color:transparent}
.stagebtn.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold),0 0 16px rgba(247,201,72,.5)}
.szone .szt{font-family:var(--display);font-size:clamp(1.3rem,5vw,2.2rem);color:transparent;background:linear-gradient(90deg,#ff6b78,#ffd84d,#5fe09a,#5aa7ff,#c08bff,#ff6b78);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-stroke:1.5px #fff;filter:drop-shadow(0 3px 0 #000);animation:rbmove 1s linear infinite}
.szone .szsub{font-size:clamp(.6rem,2vw,.85rem);color:#e8dcc0;margin-bottom:4px}
.szone .szwheel{width:min(62%,300px);height:auto;filter:drop-shadow(0 0 16px rgba(247,201,72,.6))}
.szone .szres{position:absolute;top:46%;left:50%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:6px;font-family:var(--display);font-size:clamp(1.4rem,5.5vw,2.6rem);animation:oddspop .8s ease-out;white-space:nowrap}
.szone .szres i{font-style:normal;text-shadow:0 3px 0 #000,0 0 20px currentColor}
.szone .szres em{font-style:normal;font-size:.6em;color:#fff;text-shadow:0 2px 0 #000}
html.low .szone .szt{animation:none}
</style>
</head>
<body>
<div class="page" id="page">
  <div class="topbar">
    <div class="roundbig"><small>ROUND</small><b id="tRound">-</b><div class="rtrack" id="rtrack"></div></div>
    <div hidden><b id="tSpin"></b><b id="tOdds"></b><b id="tDealer"></b><b id="tUp"></b><b id="tRoom"></b></div>
    <div class="foot topfoot" style="gap:8px"><button id="dexBtn">一覧</button><button id="setBtn">設定</button><button id="bgm" aria-pressed="true">BGM:ON</button><button id="snd" aria-pressed="true">音:ON</button></div>
    <div class="timer"><div class="row" style="display:flex;justify-content:space-between;color:var(--muted)"><span id="tPhase">待機中</span><span id="tLeft"></span></div><div class="tbar" id="tbar"><i id="tfill"></i></div></div>
  </div>

  <div class="main3">
    <div class="leftcol"><div class="players" id="players"></div></div>

    <div class="boardwrap" id="boardwrap">
      <div class="board" id="board">
        <div class="stage">
          <div class="spinno" id="spinno"></div>
          <div class="yokoku" id="yokoku"></div>
          <div class="wheel" id="wheel"></div>
          <div class="cp" id="cp"></div>
          <div class="hint" id="hint"></div>
        </div>
      </div>
      <div class="rayclip"><div class="rays" id="rays"></div></div>
      <div class="banner" id="banner"></div>
      <div class="szone" id="szone" hidden></div>
      <div class="toasts" id="toasts"></div>
      <div class="hist" id="hist" aria-label="止まった色の記録"></div>
    </div>

    <div class="side" id="side">
      <div class="gekibadge" id="geki" hidden></div>
      <div id="panel"></div>
      <div class="log2" id="log" hidden></div>
    </div>
  </div>
</div>
<div class="title" id="title">
  <div class="tbulbs"></div>
  <div class="tlogo" aria-label="ゴールドフィールド"><span style="--i:0">ゴ</span><span style="--i:1">ー</span><span style="--i:2">ル</span><span style="--i:3">ド</span><span style="--i:4">フ</span><span style="--i:5">ィ</span><span style="--i:6">ー</span><span style="--i:7">ル</span><span style="--i:8">ド</span></div>
  <p class="tsub">同じ盤を回して、金貨を奪い合うルーレットすごろく</p>
  <div class="tcoins"></div>
  <button class="tstart" id="tstart">タップしてスタート</button>
</div>
<div class="flashout" id="flashout"></div>
<div class="overlay" id="overlay"><div class="modal lobby" id="modal"></div></div>

<script>
/* =========================================================
   メダルすごろく マルチ
   ホストのブラウザがゲームを進め、参加者はPeerJSでつながって操作を送る。
   ========================================================= */
const COLORS=[{n:"赤",v:"var(--c0)",s:"▲"},{n:"青",v:"var(--c1)",s:"●"},{n:"黄",v:"var(--c2)",s:"★"},{n:"緑",v:"var(--c3)",s:"■"},{n:"紫",v:"var(--c4)",s:"◆"}];
/* 表示の設定:色覚サポート(色ごとに記号+見分けやすい配色)、演出控えめ */
const OPT={cb:false,low:false};try{Object.assign(OPT,JSON.parse(localStorage.getItem("sgr_opt")||"{}"))}catch(e){}
function applyOpt(){document.documentElement.classList.toggle("cb",OPT.cb);document.documentElement.classList.toggle("low",OPT.low);
  try{HEX.splice(0,5,...(OPT.cb?["#D55E00","#0072B2","#F0E442","#009E73","#CC79A7"]:["#ec4e5a","#3e8ef7","#f5c84c","#3fbf7f","#a970ff"]))}catch(e){}}
const sym=c=>OPT.cb&&c!=null&&COLORS[c]?COLORS[c].s:"";
const OUT=5, RB=6, SIDE=10, CORNER_TL=0, CORNER_BR=18, ODDS=[5,6,8,10,13,16,20,25,32,40,50,64];
const MAX_SPIN=20, BONUS20=50, START_MEDALS=50, MAX_PLAYERS=5, SAFE_SPINS=3;
/* オッズは表のあとも1段ごとに1.35倍ずつ伸び続ける(1兆まで届くように) */
const oddsAt=i=>i<ODDS.length?ODDS[i]:Math.round(ODDS[ODDS.length-1]*Math.pow(1.35,i-ODDS.length+1));
const fmtN=n=>Math.round(n).toLocaleString("ja-JP");
/* 狭い枠(手持ち表示)用:大きくなったら 1.2k / 3.4M などで短く */
const fmtK=n=>{n=Math.round(n);const a=Math.abs(n);if(a<10000)return n.toLocaleString("ja-JP");
  for(const [v,su] of [[1e12,"T"],[1e9,"B"],[1e6,"M"],[1e3,"k"]])if(a>=v){const x=n/v;return (a>=v*100?Math.round(x):Math.round(x*10)/10)+su}};
/* マスの上など狭い場所用:1万以上は「万」「億」「兆」で短くする */
const fmtS=n=>{n=Math.round(n);const u=[[1e12,"兆"],[1e8,"億"],[1e4,"万"]];for(const [v,k] of u)if(n>=v){const x=n/v;return (x>=100?Math.floor(x):Math.floor(x*10)/10)+k}return n.toLocaleString("ja-JP")};
/* 金額の桁で演出の段階が決まる:10枚=1、100枚=2 … 1兆枚=12 */
const tierOf=n=>n>=10?Math.min(12,Math.floor(Math.log10(n)+1e-9)):0;
const TIERN=["","当たり!","大当たり!!","超大当たり!!!","JACKPOT!!!!","MEGA JACKPOT","GIGA JACKPOT","TERA JACKPOT","億り人!!","十億の夢","百億の神","千億の神話","1兆 伝説!!!"];
const maxRound=()=>G.maxRound||8;
const isShopRound=r=>r===Math.floor(maxRound()/2)&&r<maxRound(); /* ボーナス選択はラウンドの折り返しで1回だけ */
const T_BET=20000, T_CHECK=10000, T_SHOP=60000;
/* ステージ(マップ):ラウンドごとに変わって飽きさせない。角は必ずOUTにならない */
const STAGES=[
  // 標準:スペシャルゾーンあり。虹1 + OUT5 + 5色×6 = 36(各色きっちり6個で完全均一)
  {id:"zone",n:"標準",special:true,outN:6,startPick:false,
   d:"スペシャルゾーンあり。ボーナスは折り返しで1つ選ぶ"},
  // ボーナス:同じ盤+最初にもボーナスを選べる(慣れた人向け)
  {id:"bonus",n:"ボーナス",special:true,outN:6,startPick:true,
   d:"開始前にもボーナスを1つ選べる。折り返しでもう1つ"},
];
const $=id=>document.getElementById(id);
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;

const PATH=[];
for(let c=0;c<SIDE;c++)PATH.push([0,c]);
for(let r=1;r<SIDE;r++)PATH.push([r,SIDE-1]);
for(let c=SIDE-2;c>=0;c--)PATH.push([SIDE-1,c]);
for(let r=SIDE-2;r>=1;r--)PATH.push([r,0]);
const N=PATH.length;

/* ================= お守り(盤を書き換えるもの・共有のルーレットを変えるものは除外) ================= */

/* デメリット:ショップに並ぶとき、お守りごとにランダムで1つ付く */

  none:{n:"なし",d:"デメリットなし"},
  top:{n:"1位条件",d:"ラウンドの収支で1位になれないと没収される"},
  tax:{n:"維持費",d:"毎ラウンド開始時、所持コインの5%を失う"},
