  weak:{n:"弱体",d:"自分の色の配当が×0.7になる"},
  nodealer:{n:"親で無効",d:"自分が親のラウンドは効果がない"},
  minbet:{n:"小心者",d:"所持コインの20%以上を賭けないと効果がない"},
};
const DW_POOL=["none","top","top","tax","fragile","outpain","weak","nodealer","minbet"];
const TAGNAME={pay:"配当",risk:"リスク",board:"盤",grow:"育つ",rule:"ルール"};
const TAGCOL={pay:"#1d8796",risk:"#b8323d",board:"#2c9a63",grow:"#b8891a",rule:"#7a4fd0"};
/* お守りの説明で大事なところに色を付ける */
function hl(t){return esc(t)
  .replace(/(×\d+(?:\.\d+)?|\+\d+枚?|\d+%|\d+段|2倍|\d+回)/g,'<em class="hn">$1</em>')
  .replace(/(OUT)(?![^<]*<\/em>)/g,'<em class="ho">$1</em>')
  .replace(/(UPの色|利確|START|周数|未確定コイン|未確定|自分の色)/g,'<em class="hk">$1</em>')}
function icon(id){const d=CHARMS[id],col=TAGCOL[d.tag];
  return `<svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="12" style="fill:${col}"/>
    <rect x="5" y="5" width="54" height="54" rx="9" fill="rgba(255,255,255,.12)"/>
    <text x="32" y="35" text-anchor="middle" dominant-baseline="central" font-family="Dela Gothic One, sans-serif" font-size="30" fill="#fff" stroke="rgba(0,0,0,.35)" stroke-width="3" paint-order="stroke">${d.ic}</text></svg>`}
/* p.charms は {id, dw(デメリット), life} の配列 */
const cOn=(p,c)=>!(c.dw==="nodealer"&&G.dealer===p.id)&&!(c.dw==="minbet"&&p.bet<(p.betBase||p.medals)*.2);
const pHas=(p,id)=>p.charms.some(c=>c.id===id&&cOn(p,c));
const pEach=(p,hook,fn)=>p.charms.forEach(c=>{const d=CHARMS[c.id];if(d&&d[hook]&&cOn(p,c))fn(d,c)});
const pDw=(p,k)=>p.charms.filter(c=>c.dw===k).length;
const cpOf=p=>Math.min(5,...p.charms.filter(c=>cOn(p,c)).map(c=>CHARMS[c.id].cp||5));
const safeOf=p=>Math.max(SAFE_SPINS,...p.charms.filter(c=>cOn(p,c)).map(c=>CHARMS[c.id].safeTo||0));
/* オッズ:ふつうは2の倍数(2→4→6→8…)、親は3の倍数(3→6→9…)。UPの色に止まるたびに1段上がる */
/* オッズは×1スタート。親(UP)の色が出るたびに、親以外は+1・親は+2 */
const upInc=p=>p&&G.dealer===p.id?2:1;
const oddsBase=p=>upInc(p); // 互換:UP1回あたりの上がり幅
const oddsOf=p=>1+G.oi*upInc(p)+(G.oadd||0)+(p.oadd||0)+(p.ob||0)+(p.heat||0);
const oddsNextOf=p=>1+(G.oi+1)*upInc(p)+(G.oadd||0)+(p.oadd||0)+(p.ob||0)+(p.heat||0);
// オッズは小数になりうる(スペシャルゾーンや空きマスの加算)。整数ならそのまま、小数なら1桁で表示
const fmtOdds=o=>Number.isInteger(o)?fmtN(o):(Math.round(o*10)/10).toFixed(1);

/* ================= 音 ================= */
let AC=null,soundOn=true;
const VOL={se:1,bgm:1};try{const v=JSON.parse(localStorage.getItem("sgr_vol")||"null");if(v){VOL.se=+v.se;VOL.bgm=+v.bgm}}catch(e){}
function beep(f,d=.06,type="square",vol=.05,ch="se"){if(!soundOn)return;vol*=VOL[ch];if(vol<=0.0001)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(vol,AC.currentTime);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);
    o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+d);}catch(e){}}
const jingle=(notes,step=70)=>notes.forEach((f,i)=>{if(!f)return;setTimeout(()=>beep(f,.12,"square",.06),i*step)});

/* =========================================================
   通信
   ========================================================= */
const NET={host:false,peer:null,conns:new Map(),hostConn:null,me:null,code:null,offline:false};
function genCode(){const a="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let s="";for(let i=0;i<4;i++)s+=a[Math.random()*a.length|0];return s}
const peerId=code=>"medal-sugoroku-"+code;

function hostCreate(name,offline){
  NET.host=true;NET.me="host";NET.offline=!!offline;
  G=newGame();addPlayer("host",name,false);
  if(offline){NET.code="OFF";lobbyHost();return}
  const tryOpen=()=>{NET.code=genCode();
    const peer=new Peer(peerId(NET.code));NET.peer=peer;
    peer.on("open",()=>lobbyHost());
    peer.on("error",e=>{if(e.type==="unavailable-id"){peer.destroy();tryOpen()}else lobbyError("通信エラー:"+e.type)});
    peer.on("connection",conn=>{
      conn.on("data",msg=>hostRecv(conn,msg));
      conn.on("close",()=>{const p=G.players.find(x=>x.id===conn.peer);if(p){p.online=false;pushState()}NET.conns.delete(conn.peer)});
    });
  };
  tryOpen();
}
function hostRecv(conn,msg){
  if(msg.t==="join"){
    const nm=(msg.name||"プレイヤー").slice(0,10);
    const same=G.players.find(p=>!p.bot&&p.name===nm);
    // 同じ名前なら元の席に戻す。ゲーム中は新規参加がないので、同名=本人の再接続とみなす
    const oldConn=same?NET.conns.get(same.id):null;
    const canTake=same&&(G.phase!=="lobby"||!same.online||!oldConn||!oldConn.open);
    if(canTake){const oldId=same.id;
      if(oldConn&&oldConn!==conn){try{oldConn.close()}catch(e){}}
      NET.conns.delete(oldId);NET.conns.set(conn.peer,conn);
      same.id=conn.peer;same.online=true;
      if(G.dealer===oldId)G.dealer=conn.peer;
      conn.send({t:"welcome",id:conn.peer,code:NET.code});pushState();
      if(G.phase==="lobby")lobbyHost();
      log(`${nm} が再接続しました`);bcastEv({k:"say",text:`${nm}\n再接続`,color:"var(--c3)",ms:1100});return}
    if(G.phase!=="lobby"){conn.send({t:"reject",why:"ゲームはもう始まっています(同じ名前なら再接続できます)"});return}
    if(G.players.length>=MAX_PLAYERS){conn.send({t:"reject",why:"満員です(最大5人)"});return}
    if(same){conn.send({t:"reject",why:"同じ名前の人がいます。名前を変えてください"});return}
    NET.conns.set(conn.peer,conn);addPlayer(conn.peer,nm,false);
    conn.send({t:"welcome",id:conn.peer,code:NET.code});pushState();lobbyHost();return;
  }
  if(msg.t==="act")hostAct(conn.peer,msg);
}
function clientJoin(name,code){
  NET.host=false;NET.code=code;
  const peer=new Peer();NET.peer=peer;
  peer.on("open",()=>{
    const conn=peer.connect(peerId(code),{reliable:true});NET.hostConn=conn;
    conn.on("open",()=>conn.send({t:"join",name}));
    conn.on("data",clientRecv);
    conn.on("close",()=>showModal(`<h2>接続が切れました</h2><p>ホストがページを閉じたか、回線が切れました。</p><button class="big" onclick="location.reload()">最初に戻る</button>`));
    setTimeout(()=>{if(!NET.me)lobbyError("部屋が見つかりません。コードを確認してください")},8000);
  });
  peer.on("error",e=>lobbyError(e.type==="peer-unavailable"?"部屋が見つかりません。コードを確認してください":"通信エラー:"+e.type));
}
function clientRecv(msg){
  if(msg.t==="welcome"){NET.me=msg.id;if(NET.code)LS.set("gf_code",NET.code);return}
  if(msg.t==="reject"){lobbyError(msg.why);return}
  if(msg.t==="state"){G=msg.s;G._recv=Date.now();
    if(G.phase==="lobby")lobbyGuest();
    else if(G.phase!=="end"&&(MODAL_KIND==="lobby"||MODAL_KIND==="end")){stopEndFx()}
    view();return}
  if(msg.t==="ev")playEv(msg.ev);
}
function send(a){if(NET.host)hostAct(NET.me,a);else NET.hostConn&&NET.hostConn.open&&NET.hostConn.send({t:"act",...a})}
function pushState(){
  G.left=G.deadline?Math.max(0,G.deadline-Date.now()):0;
  const snap=JSON.parse(JSON.stringify(G));
  NET.conns.forEach(c=>{if(c.open)c.send({t:"state",s:snap})});
  G._recv=Date.now();view();
}
function bcastEv(ev){NET.conns.forEach(c=>{if(c.open)c.send({t:"ev",ev})});playEv(ev)}

/* =========================================================
   ゲーム状態(ホストが持つ。参加者はコピーを受け取って表示するだけ)
   ========================================================= */
let G;
function newGame(){return {phase:"lobby",round:0,spin:0,board:newBoard(),pos:0,oi:0,oadd:0,ups:[],laps:0,players:[],deadline:0,left:0,log:[],winner:null,ranking:null,gameStage:0}}
function newBoard(special,outN){
  outN=outN||6; // 通常もスペシャルもOUTを6枚置く。スペシャルは後でそのうち1枚をスペシャルゾーンに変える
  for(let t=0;t<8000;t++){
    const a=new Array(N).fill(-1);
    const slots=[...Array(N).keys()];
    const pool=[];for(let k=0;k<outN;k++)pool.push(OUT);
    // 5色を均等に:起点だけランダムにずらす(色マス30枚は5で割り切れるので各色6枚)
    const cs=Math.random()*5|0;let ci=0;while(pool.length<slots.length){pool.push((cs+ci)%5);ci++}
    shuffle(pool);slots.forEach((idx,k)=>a[idx]=pool[k]);
    // 角(左上・右下)は必ずOUTにしない
    if(a[CORNER_TL]===OUT||a[CORNER_BR]===OUT)continue;
    if(!a.every((c,i)=>c!==a[(i+1)%N]))continue;
    if(special){ // OUT 6枚のうち1枚をスペシャルゾーンに変える(角以外)
      const outs=[];a.forEach((c,i)=>{if(c===OUT)outs.push(i)});
      if(!outs.length)continue;
      a[outs[Math.random()*outs.length|0]]=RB;
    }
    return a;
  }
  // 最後の手段:単純に色だけで埋める
  const a=new Array(N).fill(0).map((_,i)=>i%5);if(special){const oi=a.indexOf(OUT);a[oi>=0?oi:1]=RB}return a;
}
function addPlayer(id,name,bot){
  name=(name||"プレイヤー").slice(0,10);
  let tag=name[0];if(G.players.some(x=>x.tag===tag))tag=name[0]+(G.players.length+1);
  G.players.push({id,name,tag,bot,online:true,alive:true,medals:START_MEDALS,charms:[],missions:[],ms:null,
    color:null,want:null,bet:5,bought:[],locked:false,stock:0,status:"wait",hits:0,heat:0,ob:0,dollLeft:0,piggy:0,
    deciding:false,decision:null,offers:[],reroll:5,ready:false,lastGain:0});
}
const P=id=>G.players.find(p=>p.id===id);
const alivePs=()=>G.players.filter(p=>p.alive);
const activePs=()=>G.players.filter(p=>p.alive&&p.status==="active");
// 利確済みで「もし続けてたら」の幻の未確定を追跡中の人(まだOUTしていない)
const phantomPs=()=>G.players.filter(p=>p.status==="cashed"&&p.phantom!=null&&!p.phantomOut);
function log(t){G.log.unshift(t);G.log=G.log.slice(0,40)}
function setDeadline(ms){G.deadline=ms?Date.now()+ms:0}
function newUps(){const pool=shuffle([0,1,2,3,4].filter(c=>!G.ups.includes(c)));G.ups=pool.slice(0,1)}

/* ---------- ホストの操作受付 ---------- */
function hostAct(pid,a){
  const p=P(pid);if(!p)return;
  if(G.phase==="bet"&&p.alive&&!p.locked){
    if(a.a==="pick"){if(a.color!=null&&G.round===1)p.want=a.color;if(a.bet!=null)p.bet=Math.max(1,Math.min(p.medals,Math.floor(a.bet)||1));pushState()}
    if(a.a==="lock"&&p.want!=null){p.locked=true;pushState();bcastEv({k:"lock",id:p.id,all:alivePs().every(x=>x.locked)});if(alivePs().every(x=>x.locked))wake()}
  }
  // 決定の取り消し(全員がそろう前なら変更できる)
  if(G.phase==="bet"&&p.alive&&a.a==="unlock"&&p.locked){p.locked=false;pushState()}
  // 利確/継続は、全員が選ぶまで何度でも変更できる
  if(G.phase==="check"&&p.deciding&&a.a==="decide"){p.decision=a.v;pushState();if(G.players.filter(x=>x.deciding).every(x=>x.decision!=null))wake()}
  if(G.phase==="shop"&&p.alive&&!p.ready){
    if(a.a==="mpick"&&p.offers[a.k]&&(p.missions.length<MAXM||a.drop!=null)){if(a.drop!=null)p.missions.splice(a.drop,1);const id=p.offers[a.k].id;p.missions.push(id);p.picked=id;p.ready=true;log(`${p.name} がボーナス「${MISSIONS[id].n}」を選んだ`)}
    if(a.a==="buy"&&false){const o=p.offers[a.k];if(o&&!o.sold){p.medals-=o.price;o.sold=true;p.charms.push({id:o.id,dw:o.dw,life:o.dw==="fragile"?3:null});p.bought.push(o.id);log(`${p.name} が「${CHARMS[o.id].n}」を買った(デメリット:${DRAWBACKS[o.dw].d})`);if(o.id==="doll")p.dollLeft=2}}
    if(a.a==="reroll"&&p.medals>=p.reroll){p.medals-=p.reroll;p.reroll+=3;rollOffers(p)}
    if(a.a==="ready")p.ready=true;
    pushState();if(alivePs().every(x=>x.ready))wake();
  }
  if(G.phase==="lobby"&&NET.host&&pid===NET.me){
    if(a.a==="bot"&&G.players.length<MAX_PLAYERS){addPlayer("bot"+Math.random().toString(36).slice(2,7),"CPU"+(G.players.filter(x=>x.bot).length+1),true);pushState();lobbyHost()}
    if(a.a==="stageSel"){G.gameStage=Math.max(0,Math.min(STAGES.length-1,a.k|0));pushState();lobbyHost()}
    if(a.a==="start")runGame();
  }
  // もう一度(ホストのみ)
  if(G.phase==="end"&&NET.host&&pid===NET.me&&a.a==="again")playAgain();
}
/* 待ち:締め切りか、全員の入力がそろったら進む */
let wakeFn=null;
function wake(){if(wakeFn){const f=wakeFn;wakeFn=null;f()}}
function waitPhase(ms){return new Promise(res=>{setDeadline(ms);pushState();const t=setTimeout(()=>{wakeFn=null;res()},ms);wakeFn=()=>{clearTimeout(t);res()}})}

/* ---------- CPU ---------- */
function botThink(){
  G.players.filter(p=>p.bot&&p.alive).forEach(p=>{
    const later=(fn)=>setTimeout(fn,800+Math.random()*2500);
    if(G.phase==="bet"&&!p.locked)later(()=>{if(G.phase!=="bet"||p.locked)return;
      if(G.round===1){const taken=G.players.filter(x=>x!==p&&x.want!=null).map(x=>x.want);
      const free=[0,1,2,3,4].filter(c=>!taken.includes(c));
      p.want=Math.random()<.8&&free.length?free[Math.random()*free.length|0]:Math.random()*5|0}
      p.bet=Math.max(1,Math.min(p.medals,Math.round(p.medals*(.1+Math.random()*.25))));
      hostAct(p.id,{a:"lock"})});
    if(G.phase==="check"&&p.deciding)later(()=>{if(!p.deciding)return;
      const v=p.stock>=p.bet*8||(p.stock>0&&Math.random()<.4)?"cash":"cont";hostAct(p.id,{a:"decide",v})});
    if(G.phase==="shop"&&!p.ready)later(()=>{
      if(p.missions.length<MAXM)hostAct(p.id,{a:"mpick",k:Math.random()*p.offers.length|0});else hostAct(p.id,{a:"ready"})});
  });
}

/* ---------- 進行 ---------- */
async function runGame(){
  G.players.forEach(p=>{p.status="wait"});
  G.cycle=Math.max(1,G.players.length);G.maxRound=Math.max(2,G.cycle*2);G.hist=[];
  // ボーナスモード:ゲームが始まる前に1つ選ばせる
  G.stage=STAGES[Math.max(0,Math.min(STAGES.length-1,G.gameStage|0))];
  if(G.stage.startPick){G.round=0;await shopPhase(true)}
  for(G.round=1;G.round<=G.maxRound;G.round++){
    await betPhase();
    await resolveColors();
    await spinPhase();
    const over=roundEnd();
    if(over)return;
    bcastEv({k:"roundSum",round:G.round,rows:G.players.filter(p=>p.alive||p.rcash||p.rlost).map(p=>({id:p.id,name:p.name,color:p.color,v:p.status==="cashed"?p.rcash:p.status==="out"?-p.rlost:0,out:p.status==="out"}))});
    await wait(3200);
    if(isShopRound(G.round))await shopPhase();
  }
  finish("最大ラウンド終了");
}
async function betPhase(){
  G.phase="bet";G.spin=0;G.oi=0;G.oadd=0;G.laps=0;G.ups=[];G.anyHit=false;G.lastD=null;G.runNum=null;G.runLen=0;
  // 親番は賭けの前に決める。固定順で全員を回る(脱落しても順番は変わらない)
  G.dealer=dealerForRound(G.round).id;
  G.boardHidden=true;G.pos=0;if(G.hist&&G.hist.length)G.hist.push("R");
  alivePs().forEach(p=>{p.locked=false;if(G.round===1){p.want=null;p.color=null}else p.want=p.color;
    p.status="wait";p.ms=null;p.stock=0;p.hits=0;p.heat=0;p.ob=0;p.oadd=0;p.rcash=0;p.rlost=0;p.phantom=null;p.phantomOut=false;
    // オッズ継続:前ラウンドで20回を走りきった人は、そのオッズから再スタート
    p.carried=p.carry||0;if(p.carried){p.oadd=p.carried;p.carry=0}
    p.dollLeft=pHas(p,"doll")?2:0;p.lastGain=0;
    const tx=pDw(p,"tax");if(tx&&p.medals>0){const l=Math.floor(p.medals*.05*tx);p.medals-=l;if(l)log(`${p.name}:維持費 -${fmtN(l)}枚`)}
    if(p.phoenix){p.medals+=p.phoenix;log(`${p.name}:不死鳥で ${fmtN(p.phoenix)}枚を取り戻した`);bcastEv({k:"charm",id:p.id,cs:["phoenix"],txt:`+${fmtN(p.phoenix)}`});p.phoenix=0}
    p.bet=Math.max(1,Math.min(p.bet,p.medals))});
  log(G.round===1?`ラウンド1:色と賭けを選ぶ(色はゲーム終了まで固定)`:`ラウンド${G.round}:賭けを選ぶ`);
  bcastEv({k:"say",text:`ラウンド${G.round}`,color:"var(--gold)",ms:1100});
  botThink();
  await waitPhase(T_BET);
  // 時間切れの人は自動で決める
  alivePs().forEach(p=>{if(p.want==null)p.want=Math.random()*5|0;p.locked=true;p.bet=Math.max(1,Math.min(p.bet,p.medals))});
}
async function resolveColors(){
  G.phase="resolve";setDeadline(0);
  const ps=alivePs(),groups={};
  if(G.round===1)ps.forEach(p=>{(groups[p.want]=groups[p.want]||[]).push(p)});
  const fixed=[];
  for(const c of Object.keys(groups).map(Number)){
    const g=groups[c];
    if(g.length===1){g[0].color=c;fixed.push(c);continue}
    const win=g[Math.random()*g.length|0];win.color=c;fixed.push(c);
    bcastEv({k:"dup",color:c,names:g.map(x=>x.name),winner:win.name});
    log(`${COLORS[c].n}がかぶった → ルーレットで ${win.name} に決定`);
    await wait(2600);
  }
  ps.filter(p=>p.color==null).forEach(p=>{
    const free=shuffle([0,1,2,3,4].filter(c=>!ps.some(x=>x.color===c)));p.color=free[0];
    log(`${p.name} は ${COLORS[p.color].n} になった`);
  });
  ps.forEach(p=>{p.betBase=p.medals;p.medals-=p.bet;p.status="active"});
  // ステージはゲーム開始前に部屋でホストが選択済み(G.gameStage)。毎ラウンド色の並びだけ組み直す
  G.stage=STAGES[Math.max(0,Math.min(STAGES.length-1,G.gameStage|0))];
  G.board=newBoard(G.stage.special,G.stage.outN);G.pos=0;G.boardHidden=false;pushState();
  bcastEv({k:"shuffle",stage:G.stage.n,special:G.stage.special});await wait(G.stage.special?4200:1500);
  // 親番はbetPhaseで決定済み。色が確定したのでUPの色をセット(脱落してても親の色がUPになる)
  const dealer=P(G.dealer)||dealerForRound(G.round);
  G.dealer=dealer.id;G.ups=[dealer.color];
  log(`親番:${dealer.name}(${COLORS[dealer.color].n}がUPの色)${dealer.alive?"":"・脱落中"}`);
  ps.forEach(p=>pEach(p,"start",(df,c)=>{log(`${p.name}:${df.n} ${df.start(p)}`)}));
  pushState();
  bcastEv({k:"upDraw",color:G.ups[0],dealer:dealer.name,owners:[dealer.id]});
  await wait(1900);
  pushState();
  bcastEv({k:"say",text:"スタート!!",color:"var(--gold)",ms:800});await wait(900);
}
async function spinPhase(){
  G.phase="run";
  for(G.spin=1;G.spin<=MAX_SPIN;G.spin++){
    if(!activePs().length)break;
    setDeadline(0);pushState();
    // 1回目:OUTマスが「SAFE」に変わる合図
    if(G.spin===1&&SAFE_SPINS>0)bcastEv({k:"safeOn"});
    bcastEv({k:"say",text:G.spin<=SAFE_SPINS?`${G.spin}回目\nOUT無効`:G.spin===MAX_SPIN?"ラスト\n20回目":`${G.spin}回目`,color:"#fff",ms:850});
    await wait(950);
    const d=1+(Math.random()*6|0),a=5+Math.random()*50,dur=2000+Math.random()*700;
    bcastEv({k:"spin",d,a,dur,from:G.pos});
    await wait(dur+520+d*105+700);
    let laps=0;for(let s=1;s<=d;s++){G.pos=(G.pos+1)%N;if(G.pos===0)laps++}
    G.laps+=laps;
    landing(d,laps);
    // 生き残った人は生存カウント+1(粘り腰・一発逆転のゲージ)。利確済みの幻もカウント(表示だけ)
    activePs().concat(phantomPs()).forEach(p=>{const ms=mState(p);ms.survived++;mSettle(p)});
    pushState();
    await wait(G._szoneWait?5600:2600);G._szoneWait=false;
    if(!activePs().length)break;
    if(G.spin===MAX_SPIN){ // 20回目:残っている人は自動で利確
      const surv=activePs();
      bcastEv({k:"say",text:`20回達成!!\nボーナス 賭け×${BONUS20}`,color:"#fff3c4",ms:1600});await wait(1700);
      surv.forEach(p=>{const b=p.bet*BONUS20;p.stock+=b;log(`${p.name}:20回達成ボーナス +${fmtN(b)}枚`);bcastEv({k:"bonus20",id:p.id,b})});pushState();await wait(1500);
      // オッズ継続:20回を走りきったオッズを、そのまま次のラウンドへ持ち越す
      {const carries=surv.map(p=>{const c=Math.round((oddsOf(p)-1)*10)/10;p.carry=c>0?c:0;return {id:p.id,c:p.carry}}).filter(x=>x.c>0);
       if(carries.length){carries.forEach(x=>log(`${P(x.id).name}:オッズ継続 次のラウンドは ×${fmtOdds(1+x.c)} から`));
         bcastEv({k:"carry",list:carries});await wait(2600);}}
      surv.forEach(p=>doCash(p,"20回到達で自動利確"));pushState();
      await wait(1500);break;
    }
    const due=activePs().filter(p=>G.spin%cpOf(p)===0);
    if(due.length){
      G.phase="check";due.forEach(p=>{p.deciding=true;p.decision=null});
      botThink();
      await waitPhase(T_CHECK);
      due.forEach(p=>{if(p.decision==="cash")doCash(p);else doCont(p);p.deciding=false});
      G.phase="run";pushState();await wait(700);
    }
  }
  G.phase="run";setDeadline(0);pushState();
}
function landing(d,laps){
  const i=G.pos,c=G.board[i],res=[];let upHit=false;
  G.hist=G.hist||[];G.hist.push({c,d});if(G.hist.length>80)G.hist=G.hist.slice(-80);
  G.dcount=G.dcount||[0,0,0,0,0,0];G.dcount[d-1]++;
  // 1周ボーナス:STARTを通過したら、続けている全員のオッズ +2
  if(laps>0){const add=2*laps;G.oadd=Math.round(((G.oadd||0)+add)*10)/10;
    log(`1周ボーナス:全員のオッズ +${add}`);bcastEv({k:"lapBonus",laps,add});}
  if(c===OUT&&G.spin<=SAFE_SPINS){
    log(`${G.spin}回目:OUTに止まったが、3回目まではセーフ`);
    mTickSpin(d,c,i,laps,true);
    bcastEv({k:"land",c,d,res:[],safe:true});return;
  }
  const hitters=[];
  // スペシャルゾーン:①参加中の全員が「全色当たり」で今のオッズ配当 → ②オッズアップ抽選(+0.1〜+10)
  if(c===RB){
    const wins=[];
    activePs().forEach(p=>{
      for(let k=0;k<laps;k++)pEach(p,"lap",(df,cc)=>{res.push({id:p.id,t:`${df.n}:${df.lap(p)}`,fx:[cc.id]})});
      const ms=mState(p);ms.laps+=laps;
      // 全色扱い:見た色/制覇の色/UPの色をすべてカウント
      [0,1,2,3,4].forEach(rc=>{if(!ms.seen.includes(rc))ms.seen.push(rc);if(!ms.seihaC.includes(rc))ms.seihaC.push(rc)});
      if(ms.seihaN.length>=6&&ms.seihaC.length>=5){ms.seiha++;ms.seihaN=[];ms.seihaC=[]}
      ms.upStops++;
      const w=Math.floor(p.bet*oddsOf(p));p.stock+=w;p.lastGain=w;hitters.push({p,w});wins.push({id:p.id,gain:w});
      res.push({id:p.id,t:`スペシャルゾーン(全色当たり) +${fmtN(w)}`});
      mSettle(p);
    });
    // 利確済みの幻の未確定も全色当たり(表示だけ)
    phantomPs().forEach(p=>{p.phantom=(p.phantom||0)+Math.floor(p.bet*oddsOf(p))});
    // ②オッズアップ抽選:この後のスピンのためにオッズを加算
    const boosts=[0.1,0.5,1,3,5,10];const bi=Math.random()*boosts.length|0,boost=boosts[bi];
    G.oadd=(G.oadd||0)+boost;
    // 下の色カウントに反映(全色)
    [0,1,2,3,4].forEach(rc=>{G.hist.push({c:rc,d:"✦",sz:true})});if(G.hist.length>80)G.hist=G.hist.slice(-80);
    hitters.forEach(({p:h,w})=>activePs().forEach(p=>{if(p===h)return;pEach(p,"steal",(df,cc)=>{const v=Math.floor(w*df.steal);if(v){p.stock+=v;res.push({id:p.id,t:`横取り:${h.name}から +${fmtN(v)}`,fx:[cc.id],steal:v})}})}));
    res.forEach(r=>log(`${P(r.id).name}:${r.t}`));
    log(`スペシャルゾーン:全員が全色当たり → オッズ +${boost}`);
    G._szoneWait=true;bcastEv({k:"szone",boosts,bi,boost,res:wins});return;
  }
  // オッズと色が同じ(UPの色に止まった)→ 先にオッズを上げてから、新しいオッズで配当
  if(c!==OUT&&G.ups.includes(c)){upHit=true;G.oi++}
  // 自分の色でも親(UP)の色でもない色に止まったら、その人のオッズを+0.1
  let emptyUp=false;
  if(c!==OUT&&c!==RB){const up=G.ups[0];
    activePs().concat(phantomPs()).forEach(p=>{if(c!==p.color&&c!==up){p.oadd=Math.round(((p.oadd||0)+0.1)*10)/10;if(p.status==="active")emptyUp=true}});
    if(emptyUp)log(`${COLORS[c].n}に止まった → 自分の色・親の色でない人のオッズ +0.1`)}
  activePs().forEach(p=>{
    const fx=[];
    for(let k=0;k<laps;k++)pEach(p,"lap",(df,cc)=>{fx.push(cc.id);res.push({id:p.id,t:`${df.n}:${df.lap(p)}`})});
    if(c===OUT){
      if(G.spin<=safeOf(p)){res.push({id:p.id,t:"安全靴でOUTがセーフ",block:true,fx:["boots"]});return}
      if(p.dollLeft>0){p.dollLeft--;const notes=[],bf=["doll"];pEach(p,"blocked",(df,cc)=>{bf.push(cc.id);notes.push(`${df.n}:${df.blocked(p)}`)});
        res.push({id:p.id,t:`身代わり人形でOUTを防いだ${notes.length?"("+notes.join("、")+")":""}`,block:true,fx:bf});return}
      const rf=Math.max(0,...p.charms.filter(cc=>cOn(p,cc)).map(cc=>CHARMS[cc.id].refund||0)),back=Math.floor(p.stock*rf);
      const pain=pDw(p,"outpain"),pl=pain?Math.floor(p.medals*.1*pain):0;
      if(pHas(p,"phoenix"))p.phoenix=(p.phoenix||0)+p.stock;
      res.push({id:p.id,t:`OUT:未確定 ${fmtN(p.stock)}枚が消えた${back?`(保険で${fmtN(back)}枚戻った)`:""}${pl?`(道連れで -${fmtN(pl)}枚)`:""}${pHas(p,"phoenix")?"(不死鳥:次ラウンドで取り戻す)":""}`,lost:p.stock,out:true});
      p.rlost=p.stock;p.medals+=back-pl;p.stock=0;p.status="out";return;
    }
    if(c===p.color){
      p.hits++;let mul=1,add=0,notes=[];const ctx={d,i};
      pEach(p,"before",(df,cc)=>{fx.push(cc.id);notes.push(`${df.n}:${df.before(p)}`)});
      pEach(p,"pay",(df,cc)=>{const m=df.pay(p,ctx);if(m){mul*=m;fx.push(cc.id);notes.push(`${df.n}×${m}`)}});
      pEach(p,"add",(df,cc)=>{const v=df.add(p);if(v){add+=v;fx.push(cc.id);notes.push(`${df.n}+${fmtN(v)}`)}});
      const wk=pDw(p,"weak");if(wk){mul*=Math.pow(.7,wk);notes.push(`弱体×${Math.pow(.7,wk).toFixed(2)}`)}
      const w=Math.floor(p.bet*oddsOf(p)*mul)+add;p.stock+=w;p.lastGain=w;hitters.push({p,w});
      pEach(p,"after",(df,cc)=>{fx.push(cc.id);notes.push(`${df.n}:${df.after(p)}`)});
      res.push({id:p.id,t:`当たり +${fmtN(w)}(${fmtN(p.bet)}×${fmtOdds(oddsOf(p))}${notes.length?"、"+notes.join("、"):""})`,gain:w,fx});
    }else if(fx.length)res.push({id:p.id,t:"",fx});
    if(G.ups.includes(c))pEach(p,"upHit",(df,cc)=>res.push({id:p.id,t:`${df.n} ${df.upHit(p)}`,fx:[cc.id]}));
  });
  // ボーナス条件(ゲージ集計)
  if(hitters.length)G.anyHit=true;
  // 利確済みの「もし続けてたら」の幻の未確定を更新(コインはもらえない、表示だけ)
  phantomPs().forEach(p=>{
    if(c===OUT){if(G.spin>SAFE_SPINS){p.phantom=0;p.phantomOut=true}}
    else if(c===p.color){p.phantom=(p.phantom||0)+Math.floor(p.bet*oddsOf(p))}
  });
  mTickSpin(d,c,i,laps,false);
  // 横取り
  hitters.forEach(({p:h,w})=>activePs().forEach(p=>{if(p===h)return;pEach(p,"steal",(df,cc)=>{const v=Math.floor(w*df.steal);if(v){p.stock+=v;res.push({id:p.id,t:`横取り:${h.name}から +${fmtN(v)}`,fx:[cc.id],steal:v})}})}));
  res.forEach(r=>log(`${P(r.id).name}:${r.t}`));
  if(upHit)log(`UPの色に止まった → 全員のオッズUP`);
  if(c===OUT&&!res.some(r=>r.out||r.block))log("OUT(参加中の人はいない)");
  bcastEv({k:"land",c,d,res,upHit,emptyUp});
}
function doCash(p,why){
  let g=p.stock,notes=[],fx=[];pEach(p,"cash",(df,cc)=>{const v=df.cash(p,cc);if(v){g+=v;fx.push(cc.id);notes.push(`${df.n}+${fmtN(v)}`)}});
  pEach(p,"cashMul",()=>{});p.charms.filter(cc=>cOn(p,cc)&&CHARMS[cc.id].cashMul).forEach(cc=>{const v=Math.floor(g*CHARMS[cc.id].cashMul);g+=v;fx.push(cc.id);notes.push(`${CHARMS[cc.id].n}+${fmtN(v)}`)});
  if(fx.length)bcastEv({k:"charm",id:p.id,cs:fx,txt:notes.join(" ")});
  p.medals+=g;p.status="cashed";p.lastGain=g;p.rcash=g;
  {const msc=mState(p);if(G.spin===5&&!why)msc.quickDone++;if(p.bet>=(p.betBase||0)*.5)msc.shortDone++;mSettle(p)}
  // 「やめてから」どれだけ増えたかを0から数える(コインはもらえず表示だけ)
  p.phantom=0;p.phantomOut=false;
  log(`${p.name}:${why||"利確"} +${fmtN(g)}枚${notes.length?"("+notes.join("、")+")":""}`);
  bcastEv({k:"cash",id:p.id,g});
  p.stock=0;
}
function doCont(p){const ms=mState(p);ms.conts++;mSettle(p);pEach(p,"cont",(df,cc)=>{log(`${p.name}:${df.n} ${df.cont(p)}`);bcastEv({k:"charm",id:p.id,cs:[cc.id],txt:"未確定×1.5"})})}
function roundEnd(){
  G.phase="roundEnd";setDeadline(0);G.oi=0;G.oadd=0;G.ups=[];G.spin=0;
  const rv=p=>p.status==="cashed"?p.rcash:0,best=Math.max(0,...alivePs().map(rv));
  alivePs().forEach(p=>{
    const lost=[];
    p.charms=p.charms.filter(c=>{
      if(c.dw==="top"&&!(rv(p)>0&&rv(p)===best)){lost.push(CHARMS[c.id].n+"(1位になれず没収)");return false}
      if(c.dw==="fragile"){c.life=(c.life??3)-1;if(c.life<=0){lost.push(CHARMS[c.id].n+"(壊れた)");return false}}
      return true});
    if(lost.length){log(`${p.name}:${lost.join("、")}`);bcastEv({k:"lostCharm",id:p.id,txt:lost.join("、")})}
  });
  alivePs().forEach(p=>{p.stock=0;if(p.medals<=0){p.alive=false;p.status="dead";log(`${p.name} はコインが尽きて脱落`)}});
  const alive=alivePs();
  pushState();
  if(G.players.length>1&&alive.length<=1){finish(alive.length?"最後の1人":"全員脱落");return true}
  if(G.players.length===1&&!alive.length){finish("脱落");return true}
  if(G.players.some(p=>!p.bot)&&!alive.some(p=>!p.bot)&&alive.length>1){finish("人間のプレイヤーがいなくなったので決着をスキップ");return true}
  if(G.round>=maxRound()){finish(`${maxRound()}ラウンド生き残った`);return true}
  return false;
}

/* =========================================================
   ボーナス条件(お守りの代わり)。条件を達成すると「賭け×倍率」のコインがもらえる。
   ショップで3つから1つを無料で選ぶ。最大4つ。各ボーナスは1ラウンドに1回まで。
   ========================================================= */
const MAXM=4;
/* =========================================================
   ボーナス専用ビジュアルの部品
   「何をどう達成したか」「あといくつか」「今回どの目が出れば取れるか」を
   ボーナスごとに専用の見た目で出すための小さな部品たち
   ========================================================= */
const BLANK_MS={hits:0,comboStreak:0,comboDone:0,fizz:0,cliffHits:0,pieroStops:0,upStops:0,pitaHits:0,hitNums:[],
  zoroCount:0,sixes:0,choko:0,elevenCount:0,tripleDone:0,numComp:0,seiha:0,numSet:[],seihaN:[],seihaC:[],dseen:[],seen:[],
  dc:[0,0,0,0,0,0],laps:0,cornerStops:0,survived:0,conts:0,quickDone:0,jumps:0,safeStops:0,shortDone:0,
  halfs:0,colSet:[],allcol:0,big:0,coolStreak:0,coolCols:[],coolDone:0,awarded:{},lucky:0};
const msOf=p=>(p&&p.ms)||BLANK_MS;
const myColOf=p=>p?(p.color??p.want):null;
const inRun=()=>!!G&&(G.phase==="run"||G.phase==="check");
const nIdx=k=>((G.pos+k)%N+N)%N;
/* このルーレットで止まりうる6マス */
function next6(){if(!G||!G.board)return [];const r=[];for(let k=1;k<=6;k++){const i=nIdx(k);r.push({k,i,c:G.board[i]})}return r}
/* 条件に合う目(1〜6)を返す */
const winNums=pred=>next6().filter(pred).map(t=>t.k);
const myIdx=p=>{const my=myColOf(p);return my==null?[]:next6().filter(t=>t.c===my).map(t=>t.i)};
/* OUTのとなりにある自分の色マス(盤ぜんたい) */
const cliffIdx=p=>{const my=myColOf(p);if(my==null||!G||!G.board)return [];const r=[];
  for(let i=0;i<N;i++){if(G.board[i]===my&&(G.board[(i+1)%N]===OUT||G.board[(i-1+N)%N]===OUT))r.push(i)}return r};
const CORNERS=[0,9,18,27];
/* --- 見た目の部品 --- */
function vd(n,on,extra){return `<i class="vd ${on?"on":""} ${extra||""}">${n}</i>`}
function vds(nums,onSet,extra){return nums.map(n=>vd(n,onSet.includes(n),extra)).join("")}
function vp(total,on,ch){let h="";for(let i=0;i<total;i++)h+=`<i class="vp ${i<on?"on":""}">${ch}</i>`;return h}
function vc(c,cls){return c==null?"":`<i class="vc ${cls||"on"}" style="background:${COLORS[c].v}">${sym(c)}</i>`}
function vcs(onSet){return [0,1,2,3,4].map(c=>vc(c,onSet.includes(c)?"on":"off")).join("")}
function vt(t,cls){return `<i class="vt ${cls||""}">${t}</i>`}
function vrow(inner,cls){return `<span class="vrow ${cls||""}">${inner}</span>`}
/* ショップでの見本表示中は、進み具合を出さず「まっさら」な状態で見せる */
let VBLANK=false;
/* 「◯が出れば達成」の目を並べる。なければ理由を出す */
function vwin(ns,none){if(VBLANK)return "";
  return ns.length?vrow(ns.map(n=>vd(n,true,"hot")).join("")+vt("で達成","go"),"win")
  :vrow(vt(none||"このルーレットでは出ない","dim"))}
/* 盤の1周バー */
function vring(){const pos=G?G.pos:0,left=(N-pos)%N||N;
  return `<span class="vbar"><i style="width:${pos/N*100}%"></i><em>STARTまで あと${left}マス</em></span>`}
function vgauge2(v,max){const r=Math.min(1,v/Math.max(1,max));
  return `<span class="vbar"><i style="width:${r*100}%"></i><em>${fmtN(v)} / ${fmtN(max)}</em></span>`}

function mState(p){return p.ms||(p.ms={hits:0,comboStreak:0,comboDone:0,fizz:0,cliffHits:0,pieroStops:0,upStops:0,pitaHits:0,hitNums:[],

/* ゲージが満タンになった回数ぶん報酬+レベルアップ(1回のイベントで複数回も可)。達成するたびレベルが上がり倍率が増える */
function mAward(p,mid,times){
  if(times<=0)return;let total=0;p.mlv=p.mlv||{};
  const phantom=(p.status==="cashed"&&p.phantom!=null); // 幻はレベルを上げない(現在のレベルで計算)
  for(let i=0;i<times;i++){total+=p.bet*mX(p,mid);if(!phantom)p.mlv[mid]=(p.mlv[mid]||0)+1}
  const ms=mState(p);ms.awarded[mid]=(ms.awarded[mid]||0)+times;
  if(phantom){p.phantom+=total;return;} // 幻:表示だけ(演出・ログ・レベルUPなし)
  if(p.status==="active")p.stock+=total;else p.medals+=total;
  log(`${p.name}:ボーナス「${MISSIONS[mid].n}」達成${times>1?`×${times}`:""} +${fmtN(total)}枚`);
  bcastEv({k:"mission",id:p.id,mid,amt:total,lv:p.mlv[mid],toStock:p.status==="active",times});
}
function mSettle(p){const ms=mState(p);
  (p.missions||[]).forEach(mid=>{const M=MISSIONS[mid];if(!M.goal)return;
    const owed=Math.floor((M.prog(ms,p)||0)/M.goal)-(ms.awarded[mid]||0);
    if(owed>0)mAward(p,mid,owed);});
}
/* 1スピンぶんの集計(全アクティブプレイヤー)。c=止まった色/OUT/RB, i=止まった位置, laps=周回数, safe=SAFEのOUT */
function mTickSpin(d,c,i,laps,safe){
  const prevD=G.lastD;
  const isZoro=prevD!=null&&d===prevD;
  const isEleven=prevD!=null&&(d+prevD===11);
  if(d===G.runNum)G.runLen=(G.runLen||0)+1;else{G.runNum=d;G.runLen=1}
  const isTriple=G.runLen>0&&G.runLen%3===0;
  const isCorner=(i%9===0); // 角 0,9,18,27
  const isColor=(c!==OUT&&c!==RB);
  const startPos=((i-d)%N+N)%N; // 回す前の位置(ルーレットの6マスを数えるため)
  // 利確済みの幻(まだOUTしてない人)もボーナス集計の対象(報酬は幻ストックに入るだけ)
  activePs().concat(phantomPs()).forEach(p=>{const ms=mState(p);
    ms.laps+=laps;
    const hit=isColor&&c===p.color;
    if(hit){ms.hits++;ms.comboStreak++;if(ms.comboStreak>=2){ms.comboDone++;ms.comboStreak=0}}else ms.comboStreak=0;
    if(d===3)ms.fizz++; if(d===6)ms.sixes++; if(d===1||d===2)ms.choko++;
    if(isZoro)ms.zoroCount++; if(isEleven)ms.elevenCount++; if(isTriple)ms.tripleDone++;
    if(!ms.dseen.includes(d))ms.dseen.push(d);
    if(!ms.numSet.includes(d)){ms.numSet.push(d);if(ms.numSet.length>=6){ms.numComp++;ms.numSet=[]}}
    if(!ms.seihaN.includes(d))ms.seihaN.push(d);
    if(isColor&&!ms.seihaC.includes(c))ms.seihaC.push(c);
    if(ms.seihaN.length>=6&&ms.seihaC.length>=5){ms.seiha++;ms.seihaN=[];ms.seihaC=[]}
    if(isColor&&!ms.seen.includes(c))ms.seen.push(c);
    if(hit){if(!ms.hitNums.includes(d))ms.hitNums.push(d); if(d===ms.lucky)ms.pitaHits++;
      if(G.board[(i+1)%N]===OUT||G.board[(i-1+N)%N]===OUT)ms.cliffHits++;}
    if(isColor&&!hit)ms.pieroStops++;
    // 折り返し:STARTの真裏(18番)に止まったか
    if(i===CORNER_BR)ms.halfs++;
    if(d>=5)ms.big++;
    if(isColor){if(!ms.colSet.includes(c))ms.colSet.push(c);if(ms.colSet.length>=5){ms.allcol++;ms.colSet=[]}}
    // 冷静沈着:自分の色いがいの「ちがう色」が3連続。自分の色でも、同じ色が出てもリセット
    ms.coolCols=ms.coolCols||[];
    if(isColor){
      if(hit||ms.coolCols.includes(c)){ms.coolCols=[];ms.coolStreak=0}
      else{ms.coolCols.push(c);ms.coolStreak=ms.coolCols.length;
        if(ms.coolStreak>=3){ms.coolDone++;ms.coolCols=[];ms.coolStreak=0}}
    }
    if(isColor&&c===G.ups[0])ms.upStops++;
    if(isCorner)ms.cornerStops++;
    if(safe)ms.safeStops++;
    // 飛び越え:このルーレット(次の6マス)に自分の色が2つ以上あったのに、自分の色が出なかったとき
    if(!hit){let own=0;for(let s=1;s<=6;s++){if(G.board[((startPos+s)%N+N)%N]===p.color)own++}
      if(own>=2)ms.jumps++;}
    mSettle(p);
  });
  G.lastD=d;
}
function rollMissionOffers(p){
  // 最下位(生存者が2人以上で、所持コインが最少)のときだけ lastOnly のボーナスを候補に出す
  const al=alivePs(),ms=al.map(q=>q.medals),
    isLast=al.length>1&&Math.max(...ms)>Math.min(...ms)&&p.medals<=Math.min(...ms);
  const pool=shuffle(Object.keys(MISSIONS).filter(id=>!(p.missions||[]).includes(id)&&(!MISSIONS[id].lastOnly||isLast))).slice(0,3);
  p.offers=pool.map(id=>({id}));p.picked=null;
}

/* お守りの値段は「所持コインの○%」。ショップ1回につき1つだけ買える */
const costOf=(p,o)=>Math.max(10,Math.floor(p.medals*o.pct/100));
function rollOffers(p){
  const pool=shuffle(Object.keys(CHARMS).filter(id=>!p.charms.some(c=>c.id===id))).slice(0,3);
  p.offers=pool.map(id=>{const dw=DW_POOL[Math.random()*DW_POOL.length|0];return {id,dw,sold:false,pct:Math.round(CHARMS[id].price*.5)-(dw==="none"?0:8),price:0}});
}
async function shopPhase(first){
  G.phase="shop";G.shopFirst=!!first;
  alivePs().forEach(p=>{p.ready=false;rollMissionOffers(p);p.status="shop"});
  log(first?"ボーナス選択:ゲーム開始前に1つ選べる":"ボーナス選択:3つから1つ無料で選べる");
  bcastEv({k:"say",text:first?"スタート前\nボーナス選択":"ボーナス選択",color:"var(--gold)",ms:900});
  botThink();
  await waitPhase(T_SHOP);
  alivePs().forEach(p=>{if(!p.picked&&p.missions.length<MAXM&&p.offers.length){const id=p.offers[0].id;p.missions.push(id);p.picked=id}});
  bcastEv({k:"bought",list:alivePs().map(p=>({id:p.id,name:p.name,ids:p.picked?[p.picked]:[]}))});
  await wait(2500);
}
function finish(why){
  G.phase="end";setDeadline(0);
  const order=[...G.players].sort((a,b)=>(b.alive-a.alive)||(b.medals-a.medals));
  // このルームの通算成績を加算(ゲーム数・獲得コイン・勝利数)
  G.players.forEach(p=>{p.games=(p.games||0)+1;p.totalEarned=(p.totalEarned||0)+Math.max(0,p.medals)});
  // 同順位(同じコイン・生存)は同じ順位。1位が複数いれば全員を勝者に
  const posOf=p=>1+order.filter(q=>(q.alive>p.alive)||(q.alive===p.alive&&q.medals>p.medals)).length;
  order.forEach(p=>{if(posOf(p)===1)p.wins=(p.wins||0)+1});
  G.ranking=order.map(p=>({name:p.name,medals:p.medals,alive:p.alive,pos:posOf(p),wins:p.wins||0,games:p.games||0,total:p.totalEarned||0}));
  G.winner=order.filter(p=>posOf(p)===1).map(p=>p.name).join("・");log(`勝者:${G.winner}(${why})`);

function dealerForRound(r){const n=G.players.length;return G.players[((n-1-((r-1)%n))%n+n)%n]}
function nextDealer(){if(!G.round)return null;if(G.round>=maxRound())return null;const d=dealerForRound(G.round+1);return d?d.id:null}
function roundVal(p){if(!G.round)return "-";if(p.status==="cashed")return `<span style="color:var(--c3)">+${fmtN(p.rcash)}</span>`;
  if(p.status==="active")return `<span style="color:var(--stock)">+${fmtN(p.stock)}</span>`;if(p.status==="out")return `<span style="color:var(--out-fg)">-${fmtN(p.rlost)}</span>`;return "-"}
function rankOf(p){return 1+G.players.filter(q=>q!==p&&(q.alive>p.alive||(q.alive===p.alive&&q.medals>p.medals))).length}
function renderRank(){
  const ps=G.players.filter(p=>p.alive||p.rcash||p.rlost);
  if(!G.round||!ps.length){$("rrank").innerHTML="";return}
  const val=p=>p.status==="cashed"?p.rcash:p.status==="active"?p.stock:0;
  const rows=[...ps].sort((a,b)=>val(b)-val(a));const max=Math.max(1,...rows.map(val));

function szTransform(){
  const rbi=G.board.indexOf(RB);if(rbi<0)return;
  const outs=[];G.board.forEach((c,i)=>{if(c===OUT)outs.push(i)});
  // ルーレットの対象=本物のOUT5マス + これから変わる1マス(今はOUTに見せる)。順番に点灯して回る
  const ord=shuffle([rbi,...outs]);const n=ord.length,rp=ord.indexOf(rbi);
  // rbiマスを一時的に「OUT」に見せるためのフタ
  const rt=tiles[rbi];if(!rt)return;const rr=rt.getBoundingClientRect();
  const ov=document.createElement("div");ov.className="sztrans";
  ov.style.left=rr.left+"px";ov.style.top=rr.top+"px";ov.style.width=rr.width+"px";ov.style.height=rr.height+"px";
  ov.innerHTML=`<div class="szinner2"><div class="szface szf-out">OUT</div><div class="szface szf-sp"><span>✦</span></div></div>`;
  document.body.appendChild(ov);
  // 点灯マーカー
  const mark=document.createElement("div");mark.className="szsel";document.body.appendChild(mark);
  const total=n*2+rp+1; // 2周ちょっと回ってrbiで止まる
  let step=0;
  function tick(){
    const i=ord[step%n],t=tiles[i];if(t){const tr=t.getBoundingClientRect();
      mark.style.left=tr.left+"px";mark.style.top=tr.top+"px";mark.style.width=tr.width+"px";mark.style.height=tr.height+"px";}
    beep(560+(step%2?220:0),.03,"square",.05);

    if(step<total){const k=step/total,delay=reduced?16:(45+Math.pow(k,3)*230);setTimeout(tick,delay);} // だんだん減速
    else {mark.classList.add("hit");setTimeout(done,360);}
  }
  tick();
  function done(){
    const cx=rr.left+rr.width/2,cy=rr.top+rr.height/2;
    jingle([523,659,880]);shake();
    setTimeout(()=>{ov.classList.add("flip");beep(1047,.12);

    setTimeout(()=>{mark.remove();ov.remove()},1400); // 早めに外して本物のマスを見せる
  }
}

/* 「賭け × オッズ = 止まると」の式。オッズの下にUPで変わる倍率を小さく出す */
function payEq(me,pre){

  const od=pre?1+(me.carried||0):dispOdds(me),pay=me.bet*od,col=me.color??me.want;
  let up="";
  if(!pre&&G.ups.length){const u=G.ups[0],mine=u===me.color;

    up=`<small class="equp ${mine?"mine":""}"><i class="chip" style="background:${COLORS[u].v}">${sym(u)}</i>+${oddsBase(me)}</small>`;
    // 自分の色でも親の色でもない3色は +0.1
    const mc=me.color??me.want,others=[0,1,2,3,4].filter(k=>k!==mc&&k!==u);
    up+=`<small class="equp oth">${others.map(k=>`<i class="chip" style="background:${COLORS[k].v}">${sym(k)}</i>`).join("")}+0.1</small>`;}
  else if(pre)up=`${me.carried?`<small class="equp carry">×${fmtOdds(1+me.carried)} 継続中</small>`:""}<small class="equp">UPの色で上がる</small>`;
  const T=pre?0:tierOf(pay),lv=T>=5?4:T>=4?3:T>=3?2:T>=2?1:0;
  return `<div class="eq eqt${lv}" data-lv="${lv}">${lv?`<span class="eqtag">${["","チャンス","激アツ","超激アツ","神"][lv]}</span>`:""}

    <b class="eqn fit">${fmtN(me.bet)}</b><i class="op">×</i><b class="eqn odds fit">${fmtOdds(od)}</b><i class="op">=</i><b class="eqn res fit">+${fmtN(Math.floor(pay))}</b>
    <span class="eqs"></span><i class="op"></i><span class="eqs">${up}</span><i class="op"></i><span class="eqs">${col!=null?`<small class="equp"><i class="chip" style="background:${COLORS[col].v}">${sym(col)}</i></small>`:""}</span>
  </div>`}


/* 数字がその場で回り上がる(スロットのカウントアップ)。要素は一度も消えない */
function rollUp(el,from,to,ms,prefix,fmt){if(!el)return;prefix=prefix||"";fmt=fmt||fmtN;if(reduced||from==null||from===to){el.textContent=prefix+fmt(to);return}
  const t0=performance.now();el.classList.add("rolling");
  (function f(now){const k=Math.min(1,(now-t0)/ms),e=1-Math.pow(1-k,2.2);el.textContent=prefix+fmt(from+(to-from)*e);
    if(k<1)requestAnimationFrame(f);else{el.textContent=prefix+fmt(to);el.classList.remove("rolling");if(el.classList.contains("fit"))fitAll(el.parentElement)}})(t0)}
/* 「賭け×オッズ」の演出:オッズが上がったら数字が跳ねて伸び、枠の格が上がったら光る */
function eqAnim(el,me){

  const po=SHOWN.odds,pl=SHOWN.eqlv||0;SHOWN.odds=od;SHOWN.eqlv=lv;
  if(po!=null&&od>po){
    /* 数字はその場で古い値から新しい値へ一気に回り上がる(ずっと表示されたまま)。光って少し膨らむだけで、動いたり消えたりしない */
    const ob=eq.querySelector(".eqn.odds"),rbb=eq.querySelector(".eqn.res");
    if(!ob||!rbb)return;const oc=ob,rb=rbb;
    rollUp(ob,po,od,500,"",fmtOdds);rollUp(rbb,Math.floor(me.bet*po),Math.floor(pay),700,"+");
    [oc,rb].forEach(x=>{x.classList.remove("odup");void x.offsetWidth;x.classList.add("odup")});
    eq.classList.remove("flash");void eq.offsetWidth;eq.classList.add("flash");
    ring(eq);const rr=eq.getBoundingClientRect();[[rr.left+6,rr.top+6],[rr.right-6,rr.top+6],[rr.left+6,rr.bottom-6],[rr.right-6,rr.bottom-6]].forEach(([x,y])=>burst(x,y,["#fff","#f7c948"],OPT.low?3:9,5));
    sweep(500,1500,350,"square",.04);setTimeout(()=>beep(1760,.12,"triangle",.05),300);
  }
  if(lv>pl&&po!=null){
    eq.classList.remove("lvup");void eq.offsetWidth;eq.classList.add("lvup");
    jingle([784,988,1319,1568].slice(0,2+lv),70);
    const r=eq.getBoundingClientRect();[r.left+8,r.right-8].forEach(x=>burst(x,r.top+4,lv>=3?HEX:["#f7c948","#fff"],OPT.low?4:10+lv*3,5));
  }
}
function ring(el){if(OPT.low)return;const r=el.getBoundingClientRect(),d=document.createElement("div");d.className="ring";d.style.left=r.left+"px";d.style.top=r.top+"px";d.style.width=r.width+"px";d.style.height=r.height+"px";document.body.appendChild(d);setTimeout(()=>d.remove(),750)}
/* 20回生存ボーナス */
function bonusCard(me){
  const left=Math.max(0,MAX_SPIN-G.spin),pct=Math.min(100,G.spin/MAX_SPIN*100);
  return `<div class="bonus20 ${left&&left<=5?"near":""}"><div class="rib">BONUS</div>
    <div class="bt"><b>20回生存ボーナス!!</b><span>賭け×${BONUS20}</span></div>
    <div class="bcarry">＋<b>オッズ継続</b>いまのオッズのまま次へ</div>
    <div class="bv fit">+${fmtN(me.bet*BONUS20)}<small>枚</small></div>
    <div class="bbar"><i style="width:${pct}%"></i><span>${left?`あと${left}回`:"達成!"}</span></div></div>`}

/* 自分のボーナス条件の一覧(進み具合つき) */
function mEmblem(id){const M=MISSIONS[id];return `<span class="memb" style="--mc:${M.col}">${M.em}</span>`}
function mStars(p,id){const lv=mLv(p,id);return lv?`<span class="mstars">${"★".repeat(Math.min(5,lv))}${lv>5?`+${lv-5}`:""}</span>`:""}
function mCard(p,id,mode){const M=MISSIONS[id],lv=mLv(p,id);
  const live=mode==="live"&&G.phase!=="shop"&&p.status!=="out";
  const hot=live&&mHot(p,id);
  const amt=p.bet?`+${fmtN(p.bet*mX(p,id))}`:`賭け×${mX(p,id)}`;
  return `<div class="mcard ${mode} ${hot?"hot":""}" data-mtip="${id}" style="--mc:${M.col}">
    ${mEmblem(id)}<div class="mbody"><div class="mhead"><b>${M.n}</b>${mStars(p,id)}<span class="mx">${amt}</span></div>
    <small>${hl(M.d)}</small>
    ${live?`<div class="mvis">${mVis(p,id)}</div><div class="mfoot"><em class="mtip ${hot?"on":""}">${hot?"🔥 ":""}${mTip(p,id)}</em><em class="mlvn">Lv${lv+1}・達成ごとに 賭け×${mX(p,id)}</em></div>`
      :`<div class="mfoot"><em class="mtip">報酬:賭け×${M.x}</em><em class="mlvn">達成するたびレベルが上がり +${M.x}</em></div>`}</div></div>`}
function myMissions(me,all){const ids=me.missions||[];if(!ids.length)return "";return `<div class="mlist">${ids.map(id=>mCard(me,id,"live")).join("")}</div>`}
/* 他のプレイヤーの枠にも出す、ボーナスごとの専用ミニ表示 */
function mBadge(p,id){const M=MISSIONS[id],lv=mLv(p,id);
  const live=(G.phase==="run"||G.phase==="check")&&p.alive&&p.status!=="out";
  const hot=live&&mHot(p,id);
  return `<div class="mbadge ${hot?"hot":""}" data-mtip="${id}" style="--mc:${M.col}">
    <i class="be">${M.em}</i><b class="bn">${M.n}${lv?`<u>${lv+1}</u>`:""}</b>
    <div class="bv">${live?mVis(p,id).replace(/<i class="vt dim">通算[^<]*<\/i>/g,""):`<i class="vt dim">${M.d}</i>`}</div></div>`}

/* 盤の中の文字はマスからはみ出さないよう縮める */
function fitBoard(){const b=$("board");if(!b)return;b.querySelectorAll(".tile .fit").forEach(el=>{el.style.removeProperty("font-size");const t=el.parentElement,max=t.clientWidth-4;let fs=parseFloat(getComputedStyle(el).fontSize),n=0;
  while(el.scrollWidth>max&&fs>5&&n<25){fs*=.88;el.style.setProperty("font-size",fs+"px","important");n++}})}
/* 盤の大きさを画面の高さに合わせる(スクロールせずに全体が見えるように) */
/* 盤の大きさ:画面の高さと「盤の上端の位置」だけから決める(盤の中身の高さには影響されない=ガクつかない) */
const HIST_H=96; /* 盤の下の記録欄は固定の高さ */
function sizeBoard(){const w=$("boardwrap");if(!w)return;
  if(innerWidth<=760){w.style.maxWidth="";return}
  const top=w.getBoundingClientRect().top,avail=innerHeight-top-12-HIST_H-26;
  const nw=Math.max(340,Math.min(680,Math.floor(avail))),cur=parseFloat(w.style.maxWidth)||0;
  if(Math.abs(nw-cur)>2){w.style.maxWidth=nw+"px";requestAnimationFrame(fitBoard)}}
let sizeT=null;const sizeSoon=()=>{clearTimeout(sizeT);sizeT=setTimeout(sizeBoard,60)};
addEventListener("resize",()=>{sizeSoon();fitAll()});
new ResizeObserver(sizeSoon).observe(document.querySelector(".topbar"));
new ResizeObserver(sizeSoon).observe(document.querySelector(".leftcol"));
sizeBoard();
/* お守りのツールチップ */
const TIP=document.createElement("div");TIP.className="tip";TIP.hidden=true;document.body.appendChild(TIP);
function showTip(id,x,y,dw){const d=CHARMS[id];if(!d)return;
  TIP.innerHTML=`<b>${d.n}</b><div>${d.kw.map(k=>`<span class="kw">${k}</span>`).join("")}</div>${hl(d.d)}${dw&&DRAWBACKS[dw]?`<div class="${dw==="none"?"nodw":"dwt"}">デメリット:${DRAWBACKS[dw].d}</div>`:""}`;TIP.hidden=false;
  const w=TIP.offsetWidth,h=TIP.offsetHeight;TIP.style.left=Math.max(8,Math.min(innerWidth-w-8,x+14))+"px";TIP.style.top=Math.max(8,Math.min(innerHeight-h-8,y+16))+"px"}
document.addEventListener("mousemove",e=>{const mt=e.target.closest&&e.target.closest("[data-mtip]");
  if(mt){const M=MISSIONS[mt.dataset.mtip];{const mp=meP();TIP.innerHTML=`<b>${M.em} ${M.n}</b>${hl(M.d)}<div class="nodw">達成で 賭け×${mp?mX(mp,mt.dataset.mtip):M.x}(達成するたびに報酬UP)</div>`}TIP.hidden=false;const w=TIP.offsetWidth,h=TIP.offsetHeight;TIP.style.left=Math.max(8,Math.min(innerWidth-w-8,e.clientX+14))+"px";TIP.style.top=Math.max(8,Math.min(innerHeight-h-8,e.clientY+16))+"px";return}
  const t=e.target.closest&&e.target.closest("[data-tip]");if(t)showTip(t.dataset.tip,e.clientX,e.clientY,t.dataset.dw);else TIP.hidden=true});
let tipT=null;document.addEventListener("click",e=>{const t=e.target.closest&&e.target.closest("[data-tip]");if(!t||e.target.closest("button"))return;
  const r=t.getBoundingClientRect();showTip(t.dataset.tip,r.left,r.bottom,t.dataset.dw);clearTimeout(tipT);tipT=setTimeout(()=>TIP.hidden=true,2800)});
document.addEventListener("pointerdown",()=>{try{if(AC&&AC.state==="suspended")AC.resume()}catch(e){}});
buildBoard();fxInit();bulbsInit();bgmTick();
G=newGame();view();
(()=>{let r=null;try{r=JSON.parse(sessionStorage.getItem("sgr_retry")||"null");sessionStorage.removeItem("sgr_retry")}catch(e){}
  if(r){$("title").remove();hostCreate(r.name,true);for(let k=0;k<r.bots;k++)hostAct(NET.me,{a:"bot"});hideModal();hostAct(NET.me,{a:"start"})}
  else{$("overlay").hidden=true;const T=$("title");const tb=T.querySelector(".tbulbs");for(let k=0;k<60;k++){const b=document.createElement("i");b.style.setProperty("--k",k);tb.appendChild(b)}
    const tc=T.querySelector(".tcoins");for(let k=0;k<24;k++){const c=document.createElement("i");c.style.left=(Math.random()*100)+"%";c.style.animationDelay=(-Math.random()*6)+"s";c.style.animationDuration=(4+Math.random()*4)+"s";tc.appendChild(c)}
    const go=()=>{jingle([523,659,784,1047,1319,1568],70);lobbyStart();T.classList.add("out");setTimeout(()=>T.remove(),600)};
    $("tstart").onclick=go;T.addEventListener("click",e=>{if(e.target===T)go()});
    document.addEventListener("keydown",e=>{if(document.body.contains(T)&&(e.code==="Space"||e.code==="Enter"))go()},{once:false})}})();
</script>
